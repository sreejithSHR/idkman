<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WIRELOOP | Arcade Rhythm WebXR Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #02040a;
        font-family: 'Inter', -apple-system, sans-serif;
      }
    </style>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const GAME_CONFIG = {
        POOL_SIZE: 10,
        SPAWN_Z: -18.0,
        DESPAWN_Z: 2.0,
        PLAYER_Z: 0.0,
        REACH_X: 0.7,
        REACH_Y: { min: 1.0, max: 1.7 },
        BASE_SPEED: 5.0, // Initial units/sec
        MAX_SPEED_BONUS: 6.0,
        BASE_SPAWN_INTERVAL: 2.0,
        MIN_SPAWN_INTERVAL: 0.6,
        DIFFICULTY_RAMP_SCORE: 150,
        
        LOOP_RADIUS: 0.32,
        TUBE_RADIUS: 0.012,
        CONTROL_POINTS: 16,
        BEND_INTENSITY: 0.08,
        CURVE_SAMPLES: 40,
        SAFETY_MARGIN: 0.025,
        
        WAND_LENGTH: 0.35,
        WAND_RADIUS: 0.008
      };

      const GAME_STATES = {
        MENU: 'MENU',
        PLAYING: 'PLAYING',
        GAME_OVER: 'GAME_OVER'
      };

      class AudioSynth {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }

        playTone(freq, type, duration, vol, sweep = null) {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, now + duration);
          
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        }

        playHit() {
          this.playTone(880, 'sine', 0.3, 0.15);
          setTimeout(() => this.playTone(1320, 'sine', 0.4, 0.15), 50);
        }

        playFail() {
          this.playTone(150, 'sawtooth', 0.4, 0.3, 40);
          // Noise burst
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          noise.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        }

        playMiss() {
          this.playTone(300, 'triangle', 0.2, 0.1, 100);
        }
      }

      class TwistedLoop extends THREE.Group {
        constructor() {
          super();
          this.active = false;
          this.resolved = false;
          this.hasPassedPlane = false;
          this.hasPreviousDot = false;
          this.previousDot = 0;
          this.speed = GAME_CONFIG.BASE_SPEED;

          this.worldSamples = Array.from({ length: GAME_CONFIG.CURVE_SAMPLES }, () => new THREE.Vector3());
          this.localSamples = [];
          this.worldCenter = new THREE.Vector3();
          this.worldNormal = new THREE.Vector3(0, 0, 1);
          this.effectiveInnerRadius = GAME_CONFIG.LOOP_RADIUS - GAME_CONFIG.TUBE_RADIUS - GAME_CONFIG.SAFETY_MARGIN;

          // Meshes
          this.wireMat = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x0055aa,
            emissiveIntensity: 0.5,
          });
          this.wireMesh = new THREE.Mesh(new THREE.BufferGeometry(), this.wireMat);
          this.add(this.wireMesh);

          // Particles for shatter effect
          this.particles = new THREE.Group();
          const pGeo = new THREE.BoxGeometry(0.03, 0.03, 0.08);
          const pMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
          this.fragments = Array.from({ length: 15 }, () => {
            const mesh = new THREE.Mesh(pGeo, pMat.clone());
            mesh.visible = false;
            mesh.userData = { vel: new THREE.Vector3(), rot: new THREE.Vector3(), life: 0 };
            this.particles.add(mesh);
            return mesh;
          });
          this.add(this.particles);

          this.generateShape();
          this.visible = false;
        }

        generateShape() {
          const points = [];
          const N = GAME_CONFIG.CONTROL_POINTS;
          const R = GAME_CONFIG.LOOP_RADIUS;
          const B = GAME_CONFIG.BEND_INTENSITY;
          
          const p1 = Math.random() * Math.PI * 2;
          const p2 = Math.random() * Math.PI * 2;
          const pZ = Math.random() * Math.PI * 2;

          for (let i = 0; i < N; i++) {
            const theta = (i / N) * Math.PI * 2;
            const rPerturb = Math.sin(theta * 3 + p1) * (B * 0.5) + Math.cos(theta * 2 + p2) * (B * 0.3);
            const zPerturb = Math.sin(theta * 2 + pZ) * B;
            points.push(new THREE.Vector3(
              Math.cos(theta) * (R + rPerturb),
              Math.sin(theta) * (R + rPerturb),
              zPerturb
            ));
          }

          this.curve = new THREE.CatmullRomCurve3(points, true, 'centripetal');
          
          if (this.wireMesh.geometry) this.wireMesh.geometry.dispose();
          this.wireMesh.geometry = new THREE.TubeGeometry(this.curve, 64, GAME_CONFIG.TUBE_RADIUS, 8, true);

          this.localSamples = Array.from({ length: GAME_CONFIG.CURVE_SAMPLES }, (_, i) => 
            this.curve.getPointAt(i / GAME_CONFIG.CURVE_SAMPLES)
          );
        }

        spawn(x, y, speed, colorHex) {
          this.position.set(x, y, GAME_CONFIG.SPAWN_Z);
          this.rotation.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, Math.random() * Math.PI);
          this.speed = speed;
          
          this.wireMat.color.setHex(colorHex);
          this.wireMat.emissive.setHex(colorHex);
          this.wireMat.emissiveIntensity = 0.4;
          
          this.wireMesh.visible = true;
          this.fragments.forEach(f => f.visible = false);
          
          this.active = true;
          this.resolved = false;
          this.hasPassedPlane = false;
          this.hasPreviousDot = false;
          this.visible = true;
          this.updateWorldMatrix(true, true);
        }

        shatter() {
          this.wireMesh.visible = false;
          this.fragments.forEach(f => {
            f.visible = true;
            f.userData.life = 1.0;
            f.position.set((Math.random() - 0.5) * R, (Math.random() - 0.5) * R, 0);
            f.userData.vel.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2 + 1);
            f.userData.rot.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
            f.material.color.setHex(0xff0044);
          });
        }

        updateLoop(dt) {
          if (!this.active) return false;

          this.position.z += this.speed * dt;
          
          let particlesActive = false;
          if (!this.wireMesh.visible) {
            this.fragments.forEach(f => {
              if (f.userData.life > 0) {
                particlesActive = true;
                f.userData.life -= dt * 2.0;
                f.position.addScaledVector(f.userData.vel, dt);
                f.rotation.x += f.userData.rot.x * dt;
                f.rotation.y += f.userData.rot.y * dt;
                f.material.opacity = Math.max(0, f.userData.life);
                if (f.userData.life <= 0) f.visible = false;
              }
            });
          }

          if (this.position.z > GAME_CONFIG.DESPAWN_Z && !particlesActive) {
            this.active = false;
            this.visible = false;
          }

          if (this.wireMesh.visible && !this.resolved) {
            const matrix = this.matrixWorld;
            for (let i = 0; i < GAME_CONFIG.CURVE_SAMPLES; i++) {
              this.worldSamples[i].copy(this.localSamples[i]).applyMatrix4(matrix);
            }
            this.getWorldPosition(this.worldCenter);
            this.worldNormal.set(0, 0, 1).transformDirection(matrix).normalize();
          }

          return this.active;
        }
      }

      class WireLoopGame extends xb.Script {
        constructor() {
          super();
          this.synth = new AudioSynth();
          this.state = GAME_STATES.MENU;
          this.score = 0;
          this.combo = 0;
          this.multiplier = 1;
          this.lives = 3;
          this.timeSinceSpawn = 0;
          
          // Zero-allocation math scratchpads
          this.scratchToWand = new THREE.Vector3();
          this.scratchProj = new THREE.Vector3();
          this.scratchPlane = new THREE.Plane();
          this.wandPos = new THREE.Vector3(0, 1.4, -0.5);
          this.wandTipWorld = new THREE.Vector3();
        }

        init() {
          this.buildEnvironment();
          this.buildWand();
          this.buildPool();
          this.buildUI();
          this.setupInputs();
        }

        buildEnvironment() {
          this.add(new THREE.HemisphereLight(0x4466aa, 0x111122, 2.0));
          const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
          dirLight.position.set(2, 5, 3);
          this.add(dirLight);

          // Grid Floor
          const grid = new THREE.GridHelper(40, 40, 0x00f0ff, 0x112244);
          grid.position.set(0, 0, -10);
          this.add(grid);

          // Moving particles to simulate speed
          const pGeo = new THREE.BufferGeometry();
          const pCount = 200;
          const pPos = new Float32Array(pCount * 3);
          for(let i=0; i<pCount*3; i+=3) {
            pPos[i] = (Math.random() - 0.5) * 10;
            pPos[i+1] = Math.random() * 5;
            pPos[i+2] = (Math.random() - 0.5) * 40;
          }
          pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
          this.starField = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xffaaff, size: 0.05 }));
          this.add(this.starField);
        }

        buildWand() {
          this.wand = new THREE.Group();
          
          const handleGeo = new THREE.CylinderGeometry(0.015, 0.02, 0.15, 16);
          const handleMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.7 });
          const handle = new THREE.Mesh(handleGeo, handleMat);
          handle.rotation.x = Math.PI / 2;
          handle.position.z = 0.075;
          this.wand.add(handle);

          const bladeGeo = new THREE.CylinderGeometry(GAME_CONFIG.WAND_RADIUS, GAME_CONFIG.WAND_RADIUS*1.5, GAME_CONFIG.WAND_LENGTH, 12);
          const bladeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 });
          const blade = new THREE.Mesh(bladeGeo, bladeMat);
          blade.rotation.x = Math.PI / 2;
          blade.position.z = -GAME_CONFIG.WAND_LENGTH / 2;
          this.wand.add(blade);

          this.wandTip = new THREE.Mesh(
            new THREE.SphereGeometry(GAME_CONFIG.WAND_RADIUS * 1.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff })
          );
          this.wandTip.position.z = -GAME_CONFIG.WAND_LENGTH;
          this.wand.add(this.wandTip);
          
          this.wand.position.copy(this.wandPos);
          this.add(this.wand);
        }

        buildPool() {
          this.loops = Array.from({ length: GAME_CONFIG.POOL_SIZE }, (_, i) => {
            const l = new TwistedLoop();
            this.add(l);
            return l;
          });
        }

        buildUI() {
          // Scoreboard Overhead
          this.scoreCard = new xb.UICard({
            size: { width: 0.8, height: 0.2 },
            style: { flexDirection: 'row', justifyContent: 'space-around', alignItems: 'center', backgroundColor: '#0a0a1aee', borderRadius: 12, padding: 10 }
          });
          
          this.txtScore = new xb.UIText({ text: 'SCORE: 0', style: { fontSize: 28, fontWeight: 'bold', color: '#00f0ff' }});
          this.txtCombo = new xb.UIText({ text: 'COMBO: 0x', style: { fontSize: 24, color: '#ff00a0' }});
          this.txtLives = new xb.UIText({ text: 'LIVES: 3', style: { fontSize: 24, color: '#00ff88' }});
          
          this.scoreCard.add(this.txtScore, this.txtCombo, this.txtLives);
          this.scoreCard.position.set(0, 2.2, -2.5);
          this.add(this.scoreCard);

          // Main Menu Console
          this.menuCard = new xb.UICard({
            size: { width: 0.6, height: 0.35 },
            manipulation: true,
            style: { flexDirection: 'column', justifyContent: 'center', alignItems: 'center', gap: 15, backgroundColor: '#0a0a1aee', borderRadius: 16 }
          });
          
          this.menuTitle = new xb.UIText({ text: 'WIRELOOP', style: { fontSize: 40, fontWeight: 'bold', color: '#ffffff' }});
          this.btnStart = new xb.UIButton({
            label: 'START GAME',
            icon: 'play_arrow',
            style: { width: 200, height: 50, backgroundColor: '#00f0ff', color: '#000000', fontWeight: 'bold' },
            onClick: () => this.startGame()
          });

          this.menuCard.add(this.menuTitle, this.btnStart);
          this.menuCard.position.set(0, 1.4, -1.8);
          this.add(this.menuCard);
        }

        setupInputs() {
          // Desktop pointer fallback
          window.addEventListener('pointermove', (e) => {
            if (xb.core.input?.controllers?.length > 0 && xb.core.input.controllers[0].visible) return;
            const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, xb.core.camera);
            const target = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), 0.6), target)) {
              this.wandPos.lerp(target, 0.4);
              this.wand.position.copy(this.wandPos);
            }
          });
        }

        startGame() {
          this.state = GAME_STATES.PLAYING;
          this.score = 0;
          this.combo = 0;
          this.multiplier = 1;
          this.lives = 3;
          this.timeSinceSpawn = 0;
          this.loops.forEach(l => l.despawn());
          
          this.menuTitle.text = 'GAME RUNNING';
          this.btnStart.label = 'STOP GAME';
          this.btnStart.style.backgroundColor = '#ff0044';
          
          this.menuCard.position.y = 0.8; // Lower menu out of view
          this.menuCard.rotation.x = -Math.PI / 6;
          this.updateUI();
        }

        endGame() {
          this.state = GAME_STATES.GAME_OVER;
          this.menuTitle.text = 'GAME OVER';
          this.btnStart.label = 'TRY AGAIN';
          this.btnStart.style.backgroundColor = '#00f0ff';
          this.menuCard.position.y = 1.4;
          this.menuCard.rotation.x = 0;
          this.updateUI();
        }

        updateUI() {
          this.txtScore.text = `SCORE: ${this.score}`;
          this.txtCombo.text = `COMBO: ${this.combo} (x${this.multiplier})`;
          this.txtLives.text = `LIVES: ${this.lives}`;
        }

        checkCollisions() {
          for (const loop of this.loops) {
            if (!loop.active || !loop.wireMesh.visible || loop.resolved) continue;

            // 1. Wire Grazing Check
            let minDist = Infinity;
            for (let i = 0; i < GAME_CONFIG.CURVE_SAMPLES; i++) {
              const d = this.wandTipWorld.distanceTo(loop.worldSamples[i]);
              if (d < minDist) minDist = d;
            }

            if (minDist < GAME_CONFIG.TUBE_RADIUS + GAME_CONFIG.WAND_RADIUS) {
              this.handleFail(loop);
              continue;
            }

            // 2. Plane Crossing Check
            this.scratchToWand.subVectors(this.wandTipWorld, loop.worldCenter);
            const currentDot = this.scratchToWand.dot(loop.worldNormal);

            if (loop.hasPreviousDot) {
              // Sign change means crossing the plane
              if (loop.previousDot * currentDot <= 0) {
                loop.hasPassedPlane = true;
                
                // Project wand onto loop plane
                this.scratchPlane.setFromNormalAndCoplanarPoint(loop.worldNormal, loop.worldCenter);
                this.scratchPlane.projectPoint(this.wandTipWorld, this.scratchProj);
                const distFromCenter = this.scratchProj.distanceTo(loop.worldCenter);

                if (distFromCenter <= loop.effectiveInnerRadius) {
                  this.handleSuccess(loop);
                  continue;
                }
              }
            }

            loop.previousDot = currentDot;
            loop.hasPreviousDot = true;

            // 3. Miss Check
            if (loop.position.z > GAME_CONFIG.PLAYER_Z + 0.5) {
              this.handleMiss(loop);
            }
          }
        }

        handleSuccess(loop) {
          loop.resolved = true;
          this.synth.playHit();
          this.combo++;
          this.multiplier = Math.min(4, 1 + Math.floor(this.combo / 10));
          this.score += 10 * this.multiplier;
          
          loop.wireMat.color.setHex(0x00ff88);
          loop.wireMat.emissive.setHex(0x00ff88);
          loop.wireMat.emissiveIntensity = 1.0;
          this.wandTip.material.color.setHex(0x00ff88);
          
          this.updateUI();
        }

        handleFail(loop) {
          loop.resolved = true;
          this.synth.playFail();
          this.combo = 0;
          this.multiplier = 1;
          this.lives--;
          
          loop.shatter();
          this.wandTip.material.color.setHex(0xff0044);
          
          // Haptics
          if (this.activeController?.gamepad?.hapticActuators?.[0]) {
            this.activeController.gamepad.hapticActuators[0].pulse(1.0, 150);
          }
          
          this.updateUI();
          if (this.lives <= 0) this.endGame();
        }

        handleMiss(loop) {
          loop.resolved = true;
          this.synth.playMiss();
          this.combo = 0;
          this.multiplier = 1;
          this.updateUI();
        }

        update(delta) {
          super.update?.(delta);
          const dt = Math.min(delta || 0.016, 0.05);

          // Move stars
          if (this.starField) {
            const pos = this.starField.geometry.attributes.position.array;
            for(let i=2; i<pos.length; i+=3) {
              pos[i] += dt * 10;
              if (pos[i] > 10) pos[i] = -30;
            }
            this.starField.geometry.attributes.position.needsUpdate = true;
          }

          // Sync Wand
          if (xb.core.input?.controllers?.[0]?.visible) {
            this.activeController = xb.core.input.controllers[0];
            this.wand.position.copy(this.activeController.position);
            this.wand.quaternion.copy(this.activeController.quaternion);
          }
          this.wandTip.getWorldPosition(this.wandTipWorld);
          this.wandTip.material.color.lerp(new THREE.Color(0x00f0ff), dt * 5.0);

          if (this.state !== GAME_STATES.PLAYING) return;

          // Spawn Loops
          const progress = Math.min(1.0, this.score / GAME_CONFIG.DIFFICULTY_RAMP_SCORE);
          const interval = THREE.MathUtils.lerp(GAME_CONFIG.BASE_SPAWN_INTERVAL, GAME_CONFIG.MIN_SPAWN_INTERVAL, progress);
          const speed = GAME_CONFIG.BASE_SPEED + Math.min(GAME_CONFIG.MAX_SPEED_BONUS, this.score * 0.015);

          this.timeSinceSpawn += dt;
          if (this.timeSinceSpawn >= interval) {
            this.timeSinceSpawn = 0;
            const loop = this.loops.find(l => !l.active);
            if (loop) {
              const x = (Math.random() - 0.5) * GAME_CONFIG.REACH_X * 2;
              const y = THREE.MathUtils.lerp(GAME_CONFIG.REACH_Y.min, GAME_CONFIG.REACH_Y.max, Math.random());
              const colors = [0x00f0ff, 0xff00a0, 0x00ff88, 0xffbb00];
              loop.generateShape();
              loop.spawn(x, y, speed, colors[Math.floor(Math.random() * colors.length)]);
            }
          }

          // Update Loops & Collisions
          this.loops.forEach(l => l.updateLoop(dt));
          this.checkCollisions();
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.enableControllers();
        options.enableHands();
        
        xb.add(new WireLoopGame());
        xb.init(options);
      });
    </script>
  </body>
</html>
