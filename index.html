<!doctype html>
<html lang="en">
  <head>
    <title>Infinite Wireloop | XR Blocks</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
  </head>
  <body style="background-color: #050510;">
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class WireCurve extends THREE.Curve {
        constructor(timeOffset = 0, difficulty = 1.0, safeZone = false) {
          super();
          this.timeOffset = timeOffset;
          this.difficulty = difficulty;
          this.safeZone = safeZone;
        }

        getPoint(t, optionalTarget = new THREE.Vector3()) {
          const z = 1.0 - t * 21.0; 
          
          if (this.safeZone && z > -1.0) {
            // Straight flat starting alignment so loop starts perfectly centered inside the wire
            return optionalTarget.set(0, 1.4, z);
          }

          const wave1 = Math.sin(z * 0.8 + this.timeOffset * 2.0);
          const wave2 = Math.cos(z * 1.5 + this.timeOffset * 1.3);
          const wave3 = Math.sin(z * 0.4 - this.timeOffset * 1.0);

          const x = (wave1 * 0.4 + wave2 * 0.15) * this.difficulty;
          const y = 1.4 + (wave3 * 0.4 + wave1 * 0.1) * this.difficulty;

          return optionalTarget.set(x, y, z);
        }
      }

      class WireloopGame extends xb.Script {
        init() {
          this.isPlaying = false;
          this.safeZoneActive = true;
          this.score = 0;
          this.timeOffset = 0;
          this.baseSpeed = 1.8;
          this.difficulty = 0.2;
          this.loopRadius = 0.12;
          this.wireRadius = 0.015;

          // Track grab state for dual wands (index 0 = Left/Primary, index 1 = Right)
          this.grabbedStates = [false, false];

          this.setupEnvironment();
          this.setupUI();
          this.setupWandsAndWire();
        }

        setupEnvironment() {
          this.add(new THREE.AmbientLight(0xffffff, 0.3));
          const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dirLight.position.set(0, 5, 2);
          this.add(dirLight);

          const grid = new THREE.GridHelper(40, 40, 0x003366, 0x001133);
          grid.position.y = 0;
          this.add(grid);
        }

        setupUI() {
          this.scoreText = new xb.UIText({
            text: 'Score: 0',
            style: { fontSize: 32, fontWeight: 'bold', color: '#00ffff', textAlign: 'center' }
          });

          this.statusText = new xb.UIText({
            text: 'Grab the wand trigger/pinch to hold.\nThread it along the wire without touching!',
            style: { fontSize: 16, color: '#aaaaaa', textAlign: 'center', lineHeight: 1.4 }
          });

          this.startButton = new xb.UIButton({
            label: 'START GAME',
            icon: 'play_arrow',
            onClick: () => this.startGame(),
            style: { width: '100%', marginTop: 15, backgroundColor: '#e91e63' }
          });

          this.uiCard = new xb.UICard({
            size: { width: 0.6, height: 0.45 },
            manipulation: false,
            style: { 
              flexDirection: 'column',
              justifyContent: 'center',
              alignItems: 'center', 
              padding: 24, 
              gap: 12,
              backgroundColor: '#0a0a19',
              borderRadius: 16,
              borderWidth: 2,
              borderColor: '#00ffff'
            },
            children: [
              new xb.UIText({ text: 'WIRELOOP VR', style: { fontSize: 40, fontWeight: 'bold', color: '#ffffff', textAlign: 'center' } }),
              this.scoreText,
              this.statusText,
              this.startButton
            ]
          });

          this.uiCard.position.set(0, 1.5, -1.2);
          this.add(this.uiCard);
        }

        createWandMesh() {
          const wandGroup = new THREE.Group();
          
          const loopGeom = new THREE.TorusGeometry(this.loopRadius, 0.008, 16, 64);
          const loopMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x00ffff, 
            emissiveIntensity: 0.8,
            roughness: 0.2
          });
          const loopMesh = new THREE.Mesh(loopGeom, loopMat);
          
          const innerLoop = new THREE.Mesh(
            new THREE.TorusGeometry(this.loopRadius - this.wireRadius, 0.002, 8, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
          );
          loopMesh.add(innerLoop);

          const handleGeom = new THREE.CylinderGeometry(0.015, 0.015, 0.15, 16);
          const handleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
          const handleMesh = new THREE.Mesh(handleGeom, handleMat);
          handleMesh.position.set(0, -this.loopRadius - 0.075, 0);
          loopMesh.add(handleMesh);

          wandGroup.add(loopMesh);
          return { group: wandGroup, material: loopMat };
        }

        setupWandsAndWire() {
          // Create dual wands for left & right controller/hands
          const wand1 = this.createWandMesh();
          const wand2 = this.createWandMesh();

          this.wands = [wand1, wand2];
          this.add(wand1.group);
          this.add(wand2.group);

          // Initial positions (Left and Right sides near start zone)
          wand1.group.position.set(-0.2, 1.4, 0.8);
          wand2.group.position.set(0.2, 1.4, 0.8);

          // Wire creation
          this.wireMat = new THREE.MeshStandardMaterial({
            color: 0xff00ff,
            emissive: 0xe91e63,
            emissiveIntensity: 1.0,
            roughness: 0.4
          });
          this.wireMesh = new THREE.Mesh(this.generateWireGeometry(), this.wireMat);
          this.add(this.wireMesh);
        }

        generateWireGeometry() {
          const curve = new WireCurve(this.timeOffset, this.difficulty, this.safeZoneActive);
          return new THREE.TubeGeometry(curve, 150, this.wireRadius, 8, false);
        }

        startGame() {
          this.isPlaying = true;
          this.safeZoneActive = false;
          this.score = 0;
          this.timeOffset = 0;
          this.difficulty = 0.2;
          
          this.scoreText.text = 'Score: 0';
          this.statusText.text = 'Keep the ring on the wire!';
          this.startButton.style.display = 'none';
          
          for (const w of this.wands) {
            w.material.color.setHex(0x00ffff);
            w.material.emissive.setHex(0x00ffff);
          }
          this.wireMat.emissive.setHex(0xe91e63);
        }

        gameOver() {
          this.isPlaying = false;
          
          this.statusText.text = 'CRASH! You touched the wire.';
          this.startButton.label = 'TRY AGAIN';
          this.startButton.icon = 'refresh';
          this.startButton.style.display = 'flex';

          for (const w of this.wands) {
            w.material.color.setHex(0xff0000);
            w.material.emissive.setHex(0xff0000);
          }
          this.wireMat.emissive.setHex(0xff0000);
        }

        update(delta) {
          const controllers = xb.core.input.controllers;

          // Update dual wands based on controller input or physics holding
          for (let i = 0; i < 2; i++) {
            const wandGroup = this.wands[i].group;
            const controller = controllers[i];

            if (controller) {
              const isTriggerPressed = controller.userData?.selected || controller.userData?.squeeze || false;
              
              if (isTriggerPressed) {
                this.grabbedStates[i] = true;
              }

              // If grabbed or active tracking
              if (controller.position.lengthSq() > 0.01) {
                wandGroup.position.lerp(controller.position, 0.4);
                wandGroup.quaternion.slerp(controller.quaternion, 0.4);
              }
            } else {
              // Desktop mouse/pose simulator fallback position for dual wands
              if (i === 0) {
                wandGroup.position.set(0, 1.4, this.safeZoneActive ? 0.8 : -0.5);
              } else {
                wandGroup.position.set(0.3, 1.2, -0.4);
              }
            }
          }

          if (this.isPlaying) {
            // Smoothly flow the wire toward the player
            this.timeOffset += this.baseSpeed * delta;
            this.difficulty = Math.min(1.8, this.difficulty + delta * 0.015);
            this.score += delta * 100 * this.difficulty;
            this.scoreText.text = `Score: ${Math.floor(this.score)}`;

            const oldGeo = this.wireMesh.geometry;
            this.wireMesh.geometry = this.generateWireGeometry();
            oldGeo.dispose();

            // Check collision for both active wands
            for (let i = 0; i < 2; i++) {
              this.checkCollision(this.wands[i].group.position);
            }
          } else if (this.safeZoneActive) {
            // Keep the initial wire stable in safe zone so loop rests inside it
            const oldGeo = this.wireMesh.geometry;
            this.wireMesh.geometry = this.generateWireGeometry();
            oldGeo.dispose();
          }
        }

        checkCollision(loopPos) {
          if (loopPos.z <= 1.0 && loopPos.z >= -20.0) {
            const t = (1.0 - loopPos.z) / 21.0;
            const curve = new WireCurve(this.timeOffset, this.difficulty, this.safeZoneActive);
            const wirePoint = curve.getPoint(t);

            const dx = loopPos.x - wirePoint.x;
            const dy = loopPos.y - wirePoint.y;
            const distanceXY = Math.sqrt(dx * dx + dy * dy);

            const tolerance = this.loopRadius - this.wireRadius;
            if (distanceXY > tolerance) {
              this.gameOver();
            }
          }
        }

        dispose() {
          this.wireMesh.geometry.dispose();
          this.wireMat.dispose();
          for (const w of this.wands) {
            w.group.children[0].geometry.dispose();
            w.material.dispose();
          }
        }
      }

      async function start() {
        const options = new xb.Options();
        options.setAppTitle('Infinite Wireloop');
        options.setAppDescription('Thread dual wands along an infinite flowing wire.');
        
        options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
        options.xrButton.showEnterSimulatorButton = true;
        
        xb.add(new WireloopGame());
        await xb.init(options);
      }

      document.addEventListener('DOMContentLoaded', start);
    </script>
  </body>
</html>
