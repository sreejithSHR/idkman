<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ball Pit Target Toss XR | XR Blocks</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class SoundFX {
        constructor() {
          this.ctx = null;
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playThrow() {
          this.initContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }

        playHit(tier) {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const baseFreq = tier === 3 ? 1046 : tier === 2 ? 784 : 523;
          osc.type = tier === 3 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.18);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }

        playStart() {
          this.initContext();
          if (!this.ctx) return;
          [440, 554, 659, 880].forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.06;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
          });
        }
      }

      class BallThrowGame extends xb.Script {
        constructor() {
          super();
          this.sfx = new SoundFX();
          this.score = 0;
          this.highScore = 0;
          this.shotsFired = 0;
          this.shotsHit = 0;
          this.streak = 0;
          this.throwSpeed = 13.5;
          this.isPlaying = true;
          this.roundTimeRemaining = 60.0;

          this.balls = [];
          this.targets = [];
          this.pitBalls = [];
          this.particles = [];
          this.lastThrowTime = 0;
          this.throwCooldownMs = 120;
          this.controllersBound = new WeakSet();

          this.inputMode = 'controller';
        }

        init() {
          this.setupLighting();
          this.buildEnvironment();
          this.buildBallPit();
          this.buildFreeFlowingTargets();
          this.buildScoreCard();
          this.buildParticlePool();
          this.setupFailSafeInputs();
        }

        setupLighting() {
          const hemiLight = new THREE.HemisphereLight(0x334466, 0x080e18, 2.5);
          this.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xfff8ee, 2.8);
          dirLight.position.set(2, 6, 2);
          dirLight.castShadow = true;
          this.add(dirLight);

          const cyanGlow = new THREE.PointLight(0x00f0ff, 2.5, 9);
          cyanGlow.position.set(-2, 2, -2);
          this.add(cyanGlow);

          const pinkGlow = new THREE.PointLight(0xff0077, 2.5, 9);
          pinkGlow.position.set(2, 2, -2);
          this.add(pinkGlow);
        }

        buildEnvironment() {
          const env = new THREE.Group();
          env.name = 'ArcadeEnvironment';
          env.xb = {pointerEvents: 'none'};

          // Elevated cyber circular player pod
          const platformGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.15, 32);
          const platformMat = new THREE.MeshStandardMaterial({
            color: 0x111928,
            roughness: 0.4,
            metalness: 0.6,
          });
          const platform = new THREE.Mesh(platformGeo, platformMat);
          platform.position.y = -0.075;
          env.add(platform);

          const platformRingGeo = new THREE.TorusGeometry(1.62, 0.025, 16, 48);
          platformRingGeo.rotateX(Math.PI / 2);
          const platformRing = new THREE.Mesh(
            platformRingGeo,
            new THREE.MeshBasicMaterial({color: 0x00e1ff})
          );
          platformRing.position.y = 0.01;
          env.add(platformRing);

          // Deep arena floor grid
          const grid = new THREE.GridHelper(32, 32, 0x00ffff, 0x142036);
          grid.position.y = -0.01;
          env.add(grid);

          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(36, 36),
            new THREE.MeshStandardMaterial({color: 0x070b14, roughness: 0.8})
          );
          floor.rotation.x = -Math.PI / 2;
          floor.position.y = -0.02;
          env.add(floor);

          // Neon boundary pillars
          const pillarGeo = new THREE.CylinderGeometry(0.08, 0.1, 5, 16);
          const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x151c2e,
            metalness: 0.8,
            roughness: 0.3,
          });
          const pillarLocations = [
            [-3, 2.5, -4, 0x00f0ff],
            [3, 2.5, -4, 0xff0066],
            [-3.8, 2.5, -2, 0x00ff88],
            [3.8, 2.5, -2, 0xffbb00],
          ];

          pillarLocations.forEach(([px, py, pz, color]) => {
            const p = new THREE.Mesh(pillarGeo, pillarMat);
            p.position.set(px, py, pz);
            env.add(p);

            const strip = new THREE.Mesh(
              new THREE.BoxGeometry(0.02, 4.8, 0.02),
              new THREE.MeshBasicMaterial({color})
            );
            strip.position.set(px, py, pz + 0.09);
            env.add(strip);
          });

          this.add(env);
        }

        buildBallPit() {
          this.pitGroup = new THREE.Group();
          this.pitGroup.position.set(0, 0, -0.65);
          // Enable direct clicking/tapping on the ball pit to throw balls!
          this.pitGroup.xb = {pointerEvents: 'auto'};

          // Tub Outer Wall
          const tubGeo = new THREE.CylinderGeometry(0.55, 0.5, 0.48, 32, 1, true);
          const tubMat = new THREE.MeshStandardMaterial({
            color: 0x131a2b,
            roughness: 0.4,
            metalness: 0.7,
            side: THREE.DoubleSide,
          });
          const tub = new THREE.Mesh(tubGeo, tubMat);
          tub.position.y = 0.52;
          this.pitGroup.add(tub);

          // Glowing basin rim
          const rimGeo = new THREE.TorusGeometry(0.55, 0.035, 16, 48);
          rimGeo.rotateX(Math.PI / 2);
          const rim = new THREE.Mesh(
            rimGeo,
            new THREE.MeshBasicMaterial({color: 0x00e1ff})
          );
          rim.position.y = 0.76;
          this.pitGroup.add(rim);

          // Inner basin glow light
          const pitLight = new THREE.PointLight(0x00d9ff, 1.8, 1.5);
          pitLight.position.set(0, 0.7, 0);
          this.pitGroup.add(pitLight);

          // Clickable interaction zone inside the pit
          const sensorGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.25, 20);
          const sensorMat = new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
          });
          const pitSensor = new THREE.Mesh(sensorGeo, sensorMat);
          pitSensor.position.y = 0.65;
          pitSensor.name = 'BallPitSensor';
          this.pitGroup.add(pitSensor);

          // Vibrant floating balls inside the pit
          const sphereGeo = new THREE.SphereGeometry(0.048, 14, 14);
          const ballColors = [
            0xff3355, 0x00d5ff, 0xffbb00, 0x00ff77, 0xaa00ff, 0xff0088,
          ];
          const ballMats = ballColors.map(
            (c) =>
              new THREE.MeshStandardMaterial({
                color: c,
                roughness: 0.25,
                metalness: 0.25,
                emissive: c,
                emissiveIntensity: 0.15,
              })
          );

          for (let i = 0; i < 46; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * 0.44;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = 0.65 + (Math.random() - 0.5) * 0.08;

            const bMesh = new THREE.Mesh(sphereGeo, ballMats[i % ballMats.length]);
            bMesh.position.set(x, y, z);
            bMesh.userData = {
              baseY: y,
              phase: Math.random() * Math.PI * 2,
              speed: 1.5 + Math.random() * 2.0,
            };
            this.pitGroup.add(bMesh);
            this.pitBalls.push(bMesh);
          }

          this.add(this.pitGroup);
        }

        buildFreeFlowingTargets() {
          const configs = [
            {
              id: 0,
              scale: 0.95,
              baseCenter: new THREE.Vector3(0, 1.55, -2.6),
              freq: new THREE.Vector3(0.7, 0.9, 0.5),
              amp: new THREE.Vector3(1.3, 0.45, 0.6),
              phase: 0.0,
              color: 0x00e1ff,
            },
            {
              id: 1,
              scale: 0.85,
              baseCenter: new THREE.Vector3(-0.8, 1.85, -3.2),
              freq: new THREE.Vector3(0.9, 1.2, 0.7),
              amp: new THREE.Vector3(1.2, 0.6, 0.8),
              phase: 1.7,
              color: 0xff0077,
            },
            {
              id: 2,
              scale: 0.9,
              baseCenter: new THREE.Vector3(0.8, 1.45, -3.0),
              freq: new THREE.Vector3(0.6, 0.8, 1.0),
              amp: new THREE.Vector3(1.5, 0.5, 0.7),
              phase: 3.4,
              color: 0xffbb00,
            },
            {
              id: 3,
              scale: 0.72,
              baseCenter: new THREE.Vector3(0, 2.05, -3.8),
              freq: new THREE.Vector3(1.1, 1.3, 0.8),
              amp: new THREE.Vector3(1.7, 0.65, 0.9),
              phase: 5.0,
              color: 0x00ff88,
            },
          ];

          configs.forEach((cfg) => {
            const targetMesh = this.createTargetMesh(cfg.scale, cfg.color);
            targetMesh.userData = {
              ...cfg,
              wobble: 0,
            };
            targetMesh.position.copy(cfg.baseCenter);
            this.add(targetMesh);
            this.targets.push(targetMesh);
          });
        }

        createTargetMesh(scaleFactor, accentColor) {
          const group = new THREE.Group();
          group.name = 'MovingTarget';

          // Outer Ring (25 pts)
          const outerGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.025, 36);
          outerGeo.rotateX(Math.PI / 2);
          const outerMat = new THREE.MeshStandardMaterial({
            color: 0x18243b,
            roughness: 0.3,
            metalness: 0.4,
          });
          const outer = new THREE.Mesh(outerGeo, outerMat);
          group.add(outer);

          // Middle Ring (50 pts)
          const midGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.03, 36);
          midGeo.rotateX(Math.PI / 2);
          const midMat = new THREE.MeshStandardMaterial({
            color: 0xff3b30,
            roughness: 0.25,
            metalness: 0.2,
          });
          const mid = new THREE.Mesh(midGeo, midMat);
          mid.position.z = 0.005;
          group.add(mid);

          // Center Bullseye (100 pts)
          const bullGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.035, 36);
          bullGeo.rotateX(Math.PI / 2);
          const bullMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.2,
            metalness: 0.5,
            emissive: 0x553300,
            emissiveIntensity: 0.4,
          });
          const bull = new THREE.Mesh(bullGeo, bullMat);
          bull.position.z = 0.01;
          group.add(bull);

          // Exterior glowing halo
          const haloGeo = new THREE.TorusGeometry(0.355, 0.012, 16, 48);
          const haloMat = new THREE.MeshBasicMaterial({color: accentColor});
          const halo = new THREE.Mesh(haloGeo, haloMat);
          group.add(halo);

          group.scale.setScalar(scaleFactor);
          return group;
        }

        buildScoreCard() {
          // Large digital score readouts
          this.scoreText = new xb.UIText({
            text: 'SCORE: 0',
            style: {
              fontSize: 26,
              fontWeight: 'bold',
              color: '#00ffff',
              textAlign: 'center',
            },
          });

          this.statsText = new xb.UIText({
            text: 'High: 0  |  Acc: 100%  |  Hits: 0/0',
            style: {
              fontSize: 14,
              opacity: 0.85,
              textAlign: 'center',
            },
          });

          this.timerText = new xb.UIText({
            text: 'TIME REMAINING: 60s',
            style: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#ffbb00',
              textAlign: 'center',
            },
          });

          this.streakText = new xb.UIText({
            text: 'Ready to throw! Aim and fire!',
            style: {
              fontSize: 15,
              color: '#00ff88',
              textAlign: 'center',
            },
          });

          // Throw speed slider
          this.speedLabel = new xb.UIText({
            text: 'Throw Power: 13.5 m/s',
            style: {fontSize: 14},
          });

          const speedSlider = new xb.UISlider({
            min: 8,
            max: 20,
            step: 0.5,
            value: 13.5,
            style: {width: '100%', height: 32},
            onInput: (val) => {
              this.throwSpeed = val;
              this.speedLabel.text = `Throw Power: ${val.toFixed(1)} m/s`;
            },
          });

          // Controller / Hand mode toggle
          this.modeButton = new xb.UIButton({
            label: 'Mode: Controller',
            icon: 'sports_esports',
            style: {flexGrow: 1, height: 42, backgroundColor: '#203050'},
            onClick: () => this.toggleInputMode(),
          });

          // Instant Throw button
          const quickThrowBtn = new xb.UIButton({
            label: 'TOSS BALL',
            icon: 'sports_baseball',
            style: {flexGrow: 1, height: 42, backgroundColor: '#00a855'},
            onClick: () => this.throwBallFromView(),
          });

          // Start / Reset button
          this.restartBtn = new xb.UIButton({
            label: 'RESTART ROUND',
            icon: 'restart_alt',
            style: {width: '100%', height: 42, backgroundColor: '#cc3355'},
            onClick: () => this.resetGame(),
          });

          // Main Spatial Card container
          this.scoreCard = new xb.UICard({
            size: {width: 0.52, height: 'auto'},
            manipulation: true,
            edge: true,
            style: {
              flexDirection: 'column',
              gap: 10,
              padding: 16,
              backgroundColor: 'rgba(10, 16, 30, 0.95)',
              borderColor: '#00d5ff',
              borderWidth: 2,
              borderRadius: 20,
            },
            children: [
              new xb.UIText({
                text: '🏆 ARCADE SCOREBOARD',
                style: {
                  fontSize: 18,
                  fontWeight: 'bold',
                  letterSpacing: 2,
                  color: '#ffffff',
                  textAlign: 'center',
                },
              }),
              this.scoreText,
              this.statsText,
              this.timerText,
              this.streakText,
              new xb.UIPanel({
                style: {width: '100%', flexDirection: 'column', gap: 4},
                children: [this.speedLabel, speedSlider],
              }),
              new xb.UIPanel({
                style: {width: '100%', flexDirection: 'row', gap: 8},
                children: [this.modeButton, quickThrowBtn],
              }),
              this.restartBtn,
            ],
          });

          // Position card at comfortable reading height right next to the pit
          this.scoreCard.position.set(0.58, 1.25, -0.85);
          this.scoreCard.rotation.y = -0.32;
          this.add(this.scoreCard);
        }

        toggleInputMode() {
          if (this.inputMode === 'controller') {
            this.inputMode = 'hands';
            this.modeButton.label = 'Mode: Hands';
            this.modeButton.icon = 'back_hand';
            xb.core.simulator?.setMode?.(xb.SimulatorMode.POSE);
          } else {
            this.inputMode = 'controller';
            this.modeButton.label = 'Mode: Controller';
            this.modeButton.icon = 'sports_esports';
            xb.core.simulator?.setMode?.(xb.SimulatorMode.CONTROLLER);
          }
        }

        setupFailSafeInputs() {
          // 1. Desktop & Mobile Touch tap anywhere on canvas
          window.addEventListener('pointerdown', (e) => {
            // Ignore clicks directly targeting UI HTML elements if any
            if (e.target && e.target.tagName === 'BUTTON') return;
            const now = performance.now();
            if (now - this.lastThrowTime < this.throwCooldownMs) return;

            // Direct throw targeting through cursor raycast
            const mouse = new THREE.Vector2(
              (e.clientX / window.innerWidth) * 2 - 1,
              -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, xb.core.camera);
            const dir = raycaster.ray.direction.clone().normalize();

            const origin = xb.core.camera.position.clone();
            origin.addScaledVector(dir, 0.3);
            origin.y -= 0.1;

            this.throwBall(origin, dir.multiplyScalar(this.throwSpeed));
          });

          // 2. Keyboard Spacebar shortcut
          window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
              this.throwBallFromView();
            }
          });
        }

        bindController(controller) {
          if (this.controllersBound.has(controller)) return;
          this.controllersBound.add(controller);

          controller.addEventListener('selectstart', () => {
            const origin = new THREE.Vector3();
            controller.getWorldPosition(origin);

            const forward = new THREE.Vector3(0, 0, -1)
              .applyQuaternion(controller.quaternion)
              .normalize();

            // Give a slight loft arc
            forward.y += 0.08;
            forward.normalize();

            this.throwBall(origin, forward.multiplyScalar(this.throwSpeed));
          });
        }

        throwBallFromView() {
          const now = performance.now();
          if (now - this.lastThrowTime < this.throwCooldownMs) return;

          const origin = new THREE.Vector3();
          xb.core.camera.getWorldPosition(origin);

          const forward = new THREE.Vector3(0, 0, -1)
            .applyQuaternion(xb.core.camera.quaternion)
            .normalize();

          origin.addScaledVector(forward, 0.35);
          origin.y -= 0.12;

          forward.y += 0.08;
          forward.normalize();

          this.throwBall(origin, forward.multiplyScalar(this.throwSpeed));
        }

        throwBall(position, velocity) {
          this.lastThrowTime = performance.now();
          this.shotsFired++;

          const radius = 0.065;
          const colors = [
            0xff2255, 0x00e1ff, 0xffbb00, 0x00ff88, 0xbb00ff, 0xff6600,
          ];
          const color = colors[this.shotsFired % colors.length];

          const ball = new THREE.Mesh(
            new THREE.SphereGeometry(radius, 20, 20),
            new THREE.MeshStandardMaterial({
              color,
              roughness: 0.2,
              metalness: 0.3,
              emissive: color,
              emissiveIntensity: 0.25,
            })
          );
          ball.position.copy(position);
          ball.userData = {
            velocity: velocity.clone(),
            radius,
            life: 0,
            maxLife: 3.5,
          };
          this.add(ball);
          this.balls.push(ball);

          this.sfx.playThrow();
          this.updateUi();
        }

        buildParticlePool() {
          const geo = new THREE.SphereGeometry(0.02, 6, 6);
          for (let i = 0; i < 60; i++) {
            const p = new THREE.Mesh(
              geo,
              new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
              })
            );
            p.visible = false;
            p.userData = {active: false, life: 0, vel: new THREE.Vector3()};
            this.add(p);
            this.particles.push(p);
          }
        }

        spawnSparks(pos, hexColor, count = 16) {
          let s = 0;
          for (const p of this.particles) {
            if (!p.userData.active) {
              p.visible = true;
              p.userData.active = true;
              p.userData.life = 1.0;
              p.position.copy(pos);
              p.material.color.set(hexColor);
              p.material.opacity = 1.0;
              p.userData.vel.set(
                (Math.random() - 0.5) * 4.5,
                (Math.random() - 0.2) * 4.0,
                (Math.random() - 0.5) * 4.5
              );
              s++;
              if (s >= count) break;
            }
          }
        }

        update(delta) {
          super.update?.(delta);
          const dt = Math.min(delta || 0.016, 0.05);
          const time = performance.now() * 0.001;

          // Continuously bind any newly connected WebXR controllers
          if (xb.core.input?.controllers) {
            for (const c of xb.core.input.controllers) {
              this.bindController(c);
            }
          }

          // Timer logic
          if (this.isPlaying) {
            this.roundTimeRemaining = Math.max(0, this.roundTimeRemaining - dt);
            if (this.roundTimeRemaining <= 0) {
              this.isPlaying = false;
              this.streakText.text = 'Round Complete! Press RESTART.';
            }
            this.timerText.text = `TIME REMAINING: ${Math.ceil(this.roundTimeRemaining)}s`;
          }

          // Animate pit bobbing balls
          this.pitBalls.forEach((b) => {
            b.position.y =
              b.userData.baseY +
              Math.sin(time * b.userData.speed + b.userData.phase) * 0.018;
          });

          this.updateTargets(time, dt);
          this.updateBalls(dt);
          this.updateParticles(dt);
        }

        updateTargets(time, dt) {
          this.targets.forEach((target) => {
            const d = target.userData;
            const t = time * 0.95 + d.phase;

            const x = d.baseCenter.x + Math.sin(t * d.freq.x) * d.amp.x;
            const y = d.baseCenter.y + Math.cos(t * d.freq.y) * d.amp.y;
            const z = d.baseCenter.z + Math.sin(t * d.freq.z) * d.amp.z;

            target.position.set(x, y, z);

            // Compute velocities for natural bank rotation
            const vx = Math.cos(t * d.freq.x) * d.amp.x * d.freq.x;
            const vy = -Math.sin(t * d.freq.y) * d.amp.y * d.freq.y;

            target.rotation.z = -vx * 0.35;
            target.rotation.x = vy * 0.25;
            target.rotation.y = Math.sin(t * 0.5) * 0.2;

            if (d.wobble > 0) {
              d.wobble = Math.max(0, d.wobble - dt * 3.5);
              const scaleMod =
                1.0 + Math.sin(d.wobble * Math.PI * 4) * 0.25 * d.wobble;
              target.scale.setScalar(d.scale * scaleMod);
            }
          });
        }

        updateBalls(dt) {
          const gravity = -8.5;
          for (let i = this.balls.length - 1; i >= 0; i--) {
            const ball = this.balls[i];
            const d = ball.userData;

            d.life += dt;
            if (d.life > d.maxLife) {
              this.removeBall(ball, i);
              continue;
            }

            d.velocity.y += gravity * dt;
            ball.position.addScaledVector(d.velocity, dt);

            ball.rotation.x += d.velocity.z * dt * 2;
            ball.rotation.y += d.velocity.x * dt * 2;

            // Target collision check
            let hit = false;
            for (const target of this.targets) {
              const radius = 0.35 * target.userData.scale;
              const dist = ball.position.distanceTo(target.position);

              if (dist < radius + d.radius) {
                const relativeDist = dist / target.userData.scale;
                let pts = 25;
                let tier = 1;
                let sparkColor = 0x00d5ff;

                if (relativeDist <= 0.12) {
                  pts = 100;
                  tier = 3;
                  sparkColor = 0xffd700;
                } else if (relativeDist <= 0.24) {
                  pts = 50;
                  tier = 2;
                  sparkColor = 0xff3b30;
                }

                this.onTargetHit(target, ball.position, pts, tier, sparkColor);
                hit = true;
                break;
              }
            }

            if (hit) {
              this.removeBall(ball, i);
              continue;
            }

            // Floor contact
            if (ball.position.y < -0.1) {
              this.streak = 0;
              this.updateUi();
              this.removeBall(ball, i);
            }
          }
        }

        onTargetHit(target, hitPos, basePts, tier, color) {
          this.shotsHit++;
          this.streak++;
          const multiplier = Math.min(4, 1 + Math.floor((this.streak - 1) / 3));
          const earned = basePts * multiplier;
          this.score += earned;
          if (this.score > this.highScore) this.highScore = this.score;

          target.userData.wobble = 1.0;
          this.spawnSparks(hitPos, color, tier === 3 ? 24 : 14);
          this.sfx.playHit(tier);

          this.streakText.text =
            this.streak > 1
              ? `🔥 ${this.streak}x STREAK! (x${multiplier} Mult)`
              : `🎯 HIT! +${earned} pts!`;

          this.updateUi();
        }

        updateParticles(dt) {
          for (const p of this.particles) {
            if (!p.userData.active) continue;
            p.userData.life -= dt * 2.2;
            if (p.userData.life <= 0) {
              p.userData.active = false;
              p.visible = false;
              continue;
            }
            p.userData.vel.y -= 7.0 * dt;
            p.position.addScaledVector(p.userData.vel, dt);
            p.material.opacity = p.userData.life;
            p.scale.setScalar(Math.max(0.15, p.userData.life));
          }
        }

        updateUi() {
          this.scoreText.text = `SCORE: ${this.score}`;
          const acc =
            this.shotsFired > 0
              ? Math.round((this.shotsHit / this.shotsFired) * 100)
              : 100;
          this.statsText.text = `High: ${this.highScore}  |  Acc: ${acc}%  |  Hits: ${this.shotsHit}/${this.shotsFired}`;
        }

        resetGame() {
          this.score = 0;
          this.shotsFired = 0;
          this.shotsHit = 0;
          this.streak = 0;
          this.roundTimeRemaining = 60.0;
          this.isPlaying = true;
          this.sfx.playStart();
          this.streakText.text = 'Game Reset! Aim and fire!';
          this.updateUi();
        }

        removeBall(ball, index) {
          this.remove(ball);
          ball.geometry.dispose();
          ball.material.dispose();
          this.balls.splice(index, 1);
        }

        dispose() {
          for (let i = this.balls.length - 1; i >= 0; i--) {
            this.removeBall(this.balls[i], i);
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Ball Pit Target Toss XR');
        options.setAppDescription(
          'Throw balls at free-flowing 3D targets. Features Spatial Scoreboard, Hand Tracking, and Controller support.'
        );

        // Enable Hand Tracking & Visualization
        options.enableHands();
        options.hands.visualization = true;
        options.hands.visualizeJoints = true;
        options.hands.visualizeMeshes = true;
        options.enableGestures();

        // Enable Reticles & Input
        options.enableReticles();
        options.interaction.raycastMode = 'select';
        options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
        options.xrButton.showEnterSimulatorButton = true;

        xb.add(new BallThrowGame());
        xb.init(options);
      });
    </script>
  </body>
</html>
