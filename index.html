<!doctype html>
<html lang="en">
  <head>
    <title>Infinite Wireloop | XR Blocks</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
  </head>
  <body style="background-color: #050510;">
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      // Custom Curve for procedural infinite wire generation
      class WireCurve extends THREE.Curve {
        constructor(timeOffset = 0, difficulty = 1.0) {
          super();
          this.timeOffset = timeOffset;
          this.difficulty = difficulty;
        }

        getPoint(t, optionalTarget = new THREE.Vector3()) {
          // t ranges from 0 to 1. Map this to a Z depth from +1 to -20 meters
          const z = 1.0 - t * 21.0; 
          
          // Generate wavy patterns using sine and cosine functions.
          // timeOffset propagates the wave towards the user.
          const wave1 = Math.sin(z * 0.8 + this.timeOffset * 2.0);
          const wave2 = Math.cos(z * 1.5 + this.timeOffset * 1.3);
          const wave3 = Math.sin(z * 0.4 - this.timeOffset * 1.0);

          const x = (wave1 * 0.4 + wave2 * 0.15) * this.difficulty;
          const y = 1.4 + (wave3 * 0.4 + wave1 * 0.1) * this.difficulty;

          return optionalTarget.set(x, y, z);
        }
      }

      class WireloopGame extends xb.Script {
        init() {
          // Game Constants & State
          this.isPlaying = false;
          this.score = 0;
          this.timeOffset = 0;
          this.baseSpeed = 1.5;
          this.difficulty = 0.2; // Starts easy, gets harder
          this.loopRadius = 0.12;
          this.wireRadius = 0.015;
          
          this.setupEnvironment();
          this.setupUI();
          this.setupWireAndLoop();
        }

        setupEnvironment() {
          // Ambient and directional lighting for the glowing neon feel
          this.add(new THREE.AmbientLight(0xffffff, 0.2));
          const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dirLight.position.set(0, 5, 2);
          this.add(dirLight);

          // Add a subtle floor grid for depth perception
          const grid = new THREE.GridHelper(40, 40, 0x003366, 0x001133);
          grid.position.y = 0;
          this.add(grid);
        }

        setupUI() {
          this.scoreText = new xb.UIText({
            text: 'Score: 0',
            style: { fontSize: 32, fontWeight: 'bold', color: '#00ffff', textAlign: 'center' }
          });

          this.statusText = new xb.UIText({
            text: 'Thread the ring over the wire.\nAvoid touching it!',
            style: { fontSize: 18, color: '#aaaaaa', textAlign: 'center', lineHeight: 1.4 }
          });

          this.startButton = new xb.UIButton({
            label: 'START GAME',
            icon: 'play_arrow',
            onClick: () => this.startGame(),
            style: { width: '100%', marginTop: 20, backgroundColor: '#e91e63' }
          });

          this.uiCard = new xb.UICard({
            size: { width: 0.6, height: 0.4 }, // Fixed height to guarantee visibility
            manipulation: false, // Locked in place
            style: { 
              flexDirection: 'column',
              justifyContent: 'center',
              alignItems: 'center', 
              padding: 24, 
              gap: 12,
              backgroundColor: '#0a0a19',
              borderRadius: 16,
              borderWidth: 2,
              borderColor: '#00ffff'
            },
            children: [
              new xb.UIText({ text: 'WIRELOOP VR', style: { fontSize: 42, fontWeight: 'bold', color: '#ffffff', textAlign: 'center' } }),
              this.scoreText,
              this.statusText,
              this.startButton
            ]
          });

          // Position UI directly in front of the user at eye-level so the Start button is obvious
          this.uiCard.position.set(0, 1.5, -1.2);
          this.add(this.uiCard);
        }

        setupWireAndLoop() {
          // Create the Loop (attached to controller later)
          const loopGeom = new THREE.TorusGeometry(this.loopRadius, 0.008, 16, 64);
          this.loopMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x00ffff, 
            emissiveIntensity: 0.8,
            roughness: 0.2
          });
          this.loopMesh = new THREE.Mesh(loopGeom, this.loopMat);
          
          // Add a smaller inner ring to indicate the sweet spot
          const innerLoop = new THREE.Mesh(
            new THREE.TorusGeometry(this.loopRadius - this.wireRadius, 0.002, 8, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
          );
          this.loopMesh.add(innerLoop);

          // Add a Wand Handle so it looks like a physical wand controller
          const handleGeom = new THREE.CylinderGeometry(0.015, 0.015, 0.15, 16);
          const handleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
          const handleMesh = new THREE.Mesh(handleGeom, handleMat);
          handleMesh.position.set(0, -this.loopRadius - 0.075, 0); // Below the ring
          this.loopMesh.add(handleMesh);

          this.add(this.loopMesh);

          // Create the initial Wire
          this.wireMat = new THREE.MeshStandardMaterial({
            color: 0xff00ff,
            emissive: 0xe91e63,
            emissiveIntensity: 1.0,
            roughness: 0.4
          });
          this.wireMesh = new THREE.Mesh(this.generateWireGeometry(), this.wireMat);
          this.add(this.wireMesh);
        }

        generateWireGeometry() {
          const curve = new WireCurve(this.timeOffset, this.difficulty);
          // 150 segments along the length, 8 radial segments
          return new THREE.TubeGeometry(curve, 150, this.wireRadius, 8, false);
        }

        startGame() {
          this.isPlaying = true;
          this.score = 0;
          this.timeOffset = 0;
          this.difficulty = 0.2;
          
          this.scoreText.text = 'Score: 0';
          this.statusText.text = 'Stay centered!';
          this.startButton.style.display = 'none';
          
          // Reset visual materials to playing state
          this.loopMat.color.setHex(0x00ffff);
          this.loopMat.emissive.setHex(0x00ffff);
          this.wireMat.emissive.setHex(0xe91e63);
        }

        gameOver() {
          this.isPlaying = false;
          
          this.statusText.text = 'CRASH! Game Over.';
          this.startButton.label = 'TRY AGAIN';
          this.startButton.icon = 'refresh';
          this.startButton.style.display = 'flex';

          // Visual feedback for crash
          this.loopMat.color.setHex(0xff0000);
          this.loopMat.emissive.setHex(0xff0000);
          this.wireMat.emissive.setHex(0xff0000);
        }

        update(delta) {
          // Track the primary controller (or fallback)
          const controller = xb.core.input.controllers[0];
          
          if (controller) {
            // Smoothly move the loop to the controller's position
            this.loopMesh.position.lerp(controller.position, 0.5);
            this.loopMesh.quaternion.slerp(controller.quaternion, 0.5);
          } else {
            // Default position if no controller is detected yet
            this.loopMesh.position.set(0, 1.4, -0.5);
          }

          if (this.isPlaying) {
            // 1. Advance the game state
            this.timeOffset += this.baseSpeed * delta;
            this.difficulty = Math.min(1.5, this.difficulty + delta * 0.02); // Max difficulty cap
            this.score += delta * 100 * this.difficulty;
            this.scoreText.text = `Score: ${Math.floor(this.score)}`;

            // 2. Update Wire Geometry procedurally
            const oldGeo = this.wireMesh.geometry;
            this.wireMesh.geometry = this.generateWireGeometry();
            oldGeo.dispose();

            // 3. Collision Detection
            this.checkCollision(this.loopMesh.position);
          }
        }

        checkCollision(loopPos) {
          // We only check for collision if the loop is within the active wire Z-range
          if (loopPos.z <= 1.0 && loopPos.z >= -20.0) {
            // Reverse engineering 't' from the curve logic: z = 1.0 - t * 21.0
            const t = (1.0 - loopPos.z) / 21.0;
            
            // Get the exact center of the wire at the loop's current Z depth
            const curve = new WireCurve(this.timeOffset, this.difficulty);
            const wirePoint = curve.getPoint(t);

            // Calculate distance in the XY plane between loop center and wire center
            const dx = loopPos.x - wirePoint.x;
            const dy = loopPos.y - wirePoint.y;
            const distanceXY = Math.sqrt(dx * dx + dy * dy);

            // If the distance is greater than the loop's inner radius minus wire radius, it's a hit.
            const tolerance = this.loopRadius - this.wireRadius;
            if (distanceXY > tolerance) {
              this.gameOver();
            }
          }
        }

        dispose() {
          this.wireMesh.geometry.dispose();
          this.wireMat.dispose();
          this.loopMesh.geometry.dispose();
          this.loopMat.dispose();
        }
      }

      async function start() {
        const options = new xb.Options();
        options.setAppTitle('Infinite Wireloop');
        options.setAppDescription('Thread the ring along an infinite, procedurally flowing wire.');
        
        // CONTROLLER mode maps desktop mouse to the controller position
        options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
        
        // Explicitly enable the simulator button so you can play on desktop/in the preview!
        options.xrButton.showEnterSimulatorButton = true;
        
        xb.add(new WireloopGame());
        await xb.init(options);
      }

      document.addEventListener('DOMContentLoaded', start);
    </script>
  </body>
</html>
