<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WIRELOOP | Rhythm WebXR Steady-Hand Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #040810;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      /*
       * FIXES APPLIED (see chat for the full explanation):
       * 1. Removed options.setAppTitle/setAppDescription/interaction.raycastMode/
       *    simulator.defaultMode/xrButton.* — none of these exist on xb.Options.
       *    xb.SimulatorMode was undefined, so `.CONTROLLER` threw immediately and
       *    killed the whole app before xb.init() ever ran.
       * 2. Replaced xb.UIText/xb.UIButton/xb.UICard (uiblocks-addon-only classes,
       *    not exported from core `xrblocks`) with the real core UI system:
       *    xb.SpatialPanel().addGrid().addRow()/.addCol()/.addText()/.addIconButton().
       * 3. Added options.enableUI()/.enableReticles()/.enableControllers()/
       *    .enableHands()/.enableHandRays() so controllers, hands, and the panel's
       *    click/pinch raycasting actually work.
       * 4. Fixed a real gameplay bug: the plane-crossing check read
       *    `this.previousWandPlaneDot` (never set, always NaN) instead of
       *    `loop.previousWandPlaneDot` (the value actually being updated).
       * 5. Switched delta-time to the documented xb.getDeltaTime() helper instead
       *    of assuming update()'s first argument is a seconds value.
       */

      const LOOP_CONFIG = {
        POOL_SIZE: 8,
        SPAWN_Z: -15.0,
        DESPAWN_Z: 1.5,
        PLAYER_DEFAULT_Z: 0.0,
        REACH_BOUNDS_X: { min: -0.55, max: 0.55 },
        REACH_BOUNDS_Y: { min: 1.1, max: 1.65 },
        BASE_SPEED: 4.5, // units/sec
        MAX_SPEED_BONUS: 4.0, // max speed increment
        SPEED_SCORE_SCALE: 0.02, // speed += min(maxBonus, score * scale)
        BASE_SPAWN_INTERVAL: 2.2, // seconds
        MIN_SPAWN_INTERVAL: 1.0, // seconds
        DIFFICULTY_RAMP_SCORE: 100, // score at which min spawn interval is reached

        // Loop Geometry Settings
        OUTER_RADIUS: 0.28,
        TUBE_RADIUS: 0.015,
        CONTROL_POINTS: 16,
        BEND_INTENSITY: 0.065,
        CURVE_SAMPLE_COUNT: 40, // M samples for distance check
        SAFETY_MARGIN: 0.02, // inner clear aperture margin

        // Wand Settings
        WAND_TIP_RADIUS: 0.009,
        WAND_LENGTH: 0.28
      };

      const GAME_STATES = {
        MENU: 'MENU',
        PLAYING: 'PLAYING',
        GAME_OVER: 'GAME_OVER'
      };

      class SoundSynthesizer {
        constructor() {
          this.ctx = null;
        }

        initContext() {
          if (!this.ctx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) this.ctx = new AudioContextClass();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playSuccess() {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [587.33, 880.0, 1174.66].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.04);
            gain.gain.setValueAtTime(0.2, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.25);
          });
        }

        playFail() {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(45, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);

          // Voltage noise zap
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.15);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.35;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          noise.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
        }

        playMiss() {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        }
      }

      class BentLoopInstance extends THREE.Group {
        constructor(id) {
          super();
          this.id = id;
          this.active = false;
          this.hasPassedPlane = false;
          this.resolved = false; // hit or fail already processed
          this.previousWandPlaneDot = 0;
          this.hasPreviousDot = false;
          this.speed = LOOP_CONFIG.BASE_SPEED;

          // Local curve & pre-sampled local points
          this.curve = null;
          this.localSampledPoints = [];
          this.worldSampledPoints = [];
          for (let i = 0; i < LOOP_CONFIG.CURVE_SAMPLE_COUNT; i++) {
            this.worldSampledPoints.push(new THREE.Vector3());
          }

          // Pre-allocated math helpers for zero GC during collision
          this.localNormal = new THREE.Vector3(0, 0, 1);
          this.worldNormal = new THREE.Vector3(0, 0, 1);
          this.worldCenter = new THREE.Vector3();
          this.effectiveInnerRadius = LOOP_CONFIG.OUTER_RADIUS - LOOP_CONFIG.TUBE_RADIUS - LOOP_CONFIG.SAFETY_MARGIN;

          // Visual meshes
          this.material = new THREE.MeshStandardMaterial({
            color: 0x00e5ff,
            metalness: 0.85,
            roughness: 0.25,
            emissive: 0x004488,
            emissiveIntensity: 0.35,
          });

          this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.material);
          this.add(this.mesh);

          // Success indicator aura
          this.auraMat = new THREE.MeshBasicMaterial({
            color: 0x00ff88,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide
          });
          this.auraMesh = new THREE.Mesh(
            new THREE.RingGeometry(this.effectiveInnerRadius * 0.9, LOOP_CONFIG.OUTER_RADIUS * 1.1, 32),
            this.auraMat
          );
          this.add(this.auraMesh);

          // Fragment burst pieces for shatter on fail
          this.fragments = [];
          const fragGeo = new THREE.BoxGeometry(0.02, 0.02, 0.06);
          const fragMat = new THREE.MeshBasicMaterial({ color: 0xff1744 });
          for (let i = 0; i < 12; i++) {
            const frag = new THREE.Mesh(fragGeo, fragMat.clone());
            frag.visible = false;
            frag.userData = { vel: new THREE.Vector3(), rotSpeed: new THREE.Vector3(), life: 0 };
            this.add(frag);
            this.fragments.push(frag);
          }

          this.rebuildGeometry();
          this.visible = false;
        }

        rebuildGeometry() {
          // 1. Generate Perturbed Closed 3D Curve
          const points = [];
          const N = LOOP_CONFIG.CONTROL_POINTS;
          const baseR = LOOP_CONFIG.OUTER_RADIUS;
          const bend = LOOP_CONFIG.BEND_INTENSITY;

          // Randomized harmonic phase offsets
          const phase1 = Math.random() * Math.PI * 2;
          const phase2 = Math.random() * Math.PI * 2;
          const phaseZ = Math.random() * Math.PI * 2;

          for (let i = 0; i < N; i++) {
            const theta = (i / N) * Math.PI * 2;
            // Radial perturbations via multi-sine harmonics
            const rPerturb = Math.sin(theta * 2 + phase1) * (bend * 0.6) +
                             Math.cos(theta * 3 + phase2) * (bend * 0.4);
            const r = baseR + rPerturb;

            // Non-flat Z/axis bend (curling hoop)
            const zPerturb = Math.sin(theta * 2 + phaseZ) * bend +
                             Math.cos(theta * 4 + phase1) * (bend * 0.5);

            points.push(new THREE.Vector3(
              Math.cos(theta) * r,
              Math.sin(theta) * r,
              zPerturb
            ));
          }

          // Closed CatmullRomCurve3
          this.curve = new THREE.CatmullRomCurve3(points, true, 'centripetal');

          // Build Tube Mesh
          if (this.mesh.geometry) this.mesh.geometry.dispose();
          this.mesh.geometry = new THREE.TubeGeometry(
            this.curve,
            64,
            LOOP_CONFIG.TUBE_RADIUS,
            8,
            true
          );

          // Cache M sampled local points along the curve
          this.localSampledPoints = [];
          for (let i = 0; i < LOOP_CONFIG.CURVE_SAMPLE_COUNT; i++) {
            const t = i / LOOP_CONFIG.CURVE_SAMPLE_COUNT;
            this.localSampledPoints.push(this.curve.getPointAt(t));
          }
        }

        spawn(x, y, speed, colorHex) {
          this.position.set(x, y, LOOP_CONFIG.SPAWN_Z);

          // Randomize orientation angles so loop approaches with 3D tilt
          this.rotation.set(
            (Math.random() - 0.5) * 0.7,
            (Math.random() - 0.5) * 0.7,
            Math.random() * Math.PI * 2
          );

          this.speed = speed;
          this.material.color.setHex(colorHex || 0x00e5ff);
          this.material.emissive.setHex(0x003366);
          this.material.emissiveIntensity = 0.4;
          this.auraMat.opacity = 0.0;
          this.mesh.visible = true;

          // Reset fragments
          this.fragments.forEach(f => { f.visible = false; f.userData.life = 0; });

          this.active = true;
          this.hasPassedPlane = false;
          this.resolved = false;
          this.hasPreviousDot = false;
          this.visible = true;
          this.updateWorldMatrix(true, true);
        }

        explodeFragments(wandTipWorld) {
          this.mesh.visible = false;
          for (const frag of this.fragments) {
            frag.visible = true;
            frag.userData.life = 1.0;
            frag.position.set(
              (Math.random() - 0.5) * LOOP_CONFIG.OUTER_RADIUS,
              (Math.random() - 0.5) * LOOP_CONFIG.OUTER_RADIUS,
              (Math.random() - 0.5) * 0.05
            );
            frag.userData.vel.set(
              (Math.random() - 0.5) * 2.4,
              (Math.random() - 0.5) * 2.4,
              (Math.random() - 0.5) * 2.0 + 1.0
            );
            frag.userData.rotSpeed.set(
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10
            );
          }
        }

        updateFragments(dt) {
          let anyActive = false;
          for (const frag of this.fragments) {
            if (frag.userData.life > 0) {
              anyActive = true;
              frag.userData.life -= dt * 2.2;
              frag.position.addScaledVector(frag.userData.vel, dt);
              frag.rotation.x += frag.userData.rotSpeed.x * dt;
              frag.rotation.y += frag.userData.rotSpeed.y * dt;
              frag.material.opacity = Math.max(0, frag.userData.life);
              if (frag.userData.life <= 0) frag.visible = false;
            }
          }
          return anyActive;
        }

        updateWorldSamples() {
          // Pre-transform the M sampled points to world coordinates
          const matrix = this.matrixWorld;
          for (let i = 0; i < LOOP_CONFIG.CURVE_SAMPLE_COUNT; i++) {
            this.worldSampledPoints[i].copy(this.localSampledPoints[i]).applyMatrix4(matrix);
          }
          this.getWorldPosition(this.worldCenter);
          this.worldNormal.set(0, 0, 1).transformDirection(matrix).normalize();
        }

        despawn() {
          this.active = false;
          this.visible = false;
          this.resolved = true;
          this.hasPreviousDot = false;
        }
      }

      class WireLoopGame extends xb.Script {
        constructor() {
          super();
          this.sfx = new SoundSynthesizer();

          // State Machine
          this.state = GAME_STATES.MENU;
          this.score = 0;
          this.combo = 0;
          this.comboMultiplier = 1;
          this.lives = 3;
          this.maxLives = 3;
          this.difficultyStage = 1;

          // Timing & Spawning
          this.timeSinceLastSpawn = 0;
          this.currentSpawnInterval = LOOP_CONFIG.BASE_SPAWN_INTERVAL;
          this.currentLoopSpeed = LOOP_CONFIG.BASE_SPEED;

          // Wand Transform Tracking (from controller or cursor ray)
          this.wandPosition = new THREE.Vector3(0, 1.35, -0.6);
          this.wandTipPosition = new THREE.Vector3(0, 1.35, -0.75);
          this.wandQuaternion = new THREE.Quaternion();
          this.activeController = null;

          // Reusable Scratch Math Objects (Strictly Zero Allocations in tick)
          this.scratchToWand = new THREE.Vector3();
          this.scratchProjected = new THREE.Vector3();
          this.scratchLocalWand = new THREE.Vector3();
          this.scratchLoopPlane = new THREE.Plane();
          this.scratchInvMatrix = new THREE.Matrix4();

          // External Callback Hooks for custom audio/event integration
          this.onSuccess = (loop, wandTip) => this.handleSuccess(loop, wandTip);
          this.onFail = (loop, wandTip) => this.handleFail(loop, wandTip);
          this.onMiss = (loop) => this.handleMiss(loop);
        }

        init() {
          this.setupLighting();
          this.setupEnvironment();
          this.setupWandVisual();
          this.setupLoopPool();
          this.setupSpatialUI();
          this.setupInputHandlers();
        }

        setupLighting() {
          const hemi = new THREE.HemisphereLight(0x6688cc, 0x111624, 2.5);
          this.add(hemi);

          const dir = new THREE.DirectionalLight(0xffffff, 2.2);
          dir.position.set(3, 8, 4);
          dir.castShadow = true;
          this.add(dir);

          const pointLightL = new THREE.PointLight(0x00f0ff, 2.0, 12);
          pointLightL.position.set(-2.0, 1.6, -5.0);
          this.add(pointLightL);

          const pointLightR = new THREE.PointLight(0xff0077, 2.0, 12);
          pointLightR.position.set(2.0, 1.6, -5.0);
          this.add(pointLightR);
        }

        setupEnvironment() {
          // Cyber Tunnel Runway
          const runwayGeo = new THREE.PlaneGeometry(3.2, 30);
          const runwayMat = new THREE.MeshStandardMaterial({
            color: 0x080d1a,
            roughness: 0.6,
            metalness: 0.7
          });
          const runway = new THREE.Mesh(runwayGeo, runwayMat);
          runway.rotation.x = -Math.PI / 2;
          runway.position.set(0, 0, -7.5);
          this.add(runway);

          const grid = new THREE.GridHelper(30, 30, 0x00f0ff, 0x1a2640);
          grid.position.set(0, 0.01, -7.5);
          this.add(grid);

          // Side neon guide rails
          const railGeo = new THREE.CylinderGeometry(0.015, 0.015, 30, 16);
          const railMatL = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
          const railMatR = new THREE.MeshBasicMaterial({ color: 0xff0077 });

          const leftRail = new THREE.Mesh(railGeo, railMatL);
          leftRail.rotation.x = Math.PI / 2;
          leftRail.position.set(-1.6, 0.05, -7.5);
          this.add(leftRail);

          const rightRail = new THREE.Mesh(railGeo, railMatR);
          rightRail.rotation.x = Math.PI / 2;
          rightRail.position.set(1.6, 0.05, -7.5);
          this.add(rightRail);
        }

        setupWandVisual() {
          this.wandGroup = new THREE.Group();
          this.wandGroup.name = 'PlayerNeedleWand';

          // Ergonomic handle
          const handleGeo = new THREE.CylinderGeometry(0.014, 0.017, 0.16, 16);
          const handleMat = new THREE.MeshStandardMaterial({
            color: 0x1c2438,
            roughness: 0.4,
            metalness: 0.8
          });
          const handle = new THREE.Mesh(handleGeo, handleMat);
          handle.rotation.x = Math.PI / 2;
          handle.position.z = 0.08;
          this.wandGroup.add(handle);

          // Glowing crossguard
          const guardGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.015, 16);
          const guardMat = new THREE.MeshStandardMaterial({
            color: 0x00e5ff,
            emissive: 0x0099cc,
            emissiveIntensity: 0.6
          });
          const guard = new THREE.Mesh(guardGeo, guardMat);
          guard.rotation.x = Math.PI / 2;
          this.wandGroup.add(guard);

          // Needle probe blade pointing forward into -Z
          const needleGeo = new THREE.CylinderGeometry(0.003, 0.007, LOOP_CONFIG.WAND_LENGTH, 12);
          const needleMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.95
          });
          const needle = new THREE.Mesh(needleGeo, needleMat);
          needle.rotation.x = -Math.PI / 2;
          needle.position.z = -LOOP_CONFIG.WAND_LENGTH / 2;
          this.wandGroup.add(needle);

          // Luminous Wand Tip Sphere
          const tipGeo = new THREE.SphereGeometry(LOOP_CONFIG.WAND_TIP_RADIUS, 16, 16);
          this.wandTipMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
          this.wandTipMesh = new THREE.Mesh(tipGeo, this.wandTipMat);
          this.wandTipMesh.position.z = -LOOP_CONFIG.WAND_LENGTH;
          this.wandGroup.add(this.wandTipMesh);

          this.wandGroup.position.copy(this.wandPosition);
          this.add(this.wandGroup);
        }

        setupLoopPool() {
          this.loopPool = [];
          for (let i = 0; i < LOOP_CONFIG.POOL_SIZE; i++) {
            const loop = new BentLoopInstance(i);
            this.add(loop);
            this.loopPool.push(loop);
          }
        }

        // --- Real core UI: xb.SpatialPanel + addGrid()/.addRow()/.addCol()/
        // .addText()/.addIconButton(). (xb.UICard/UIText/UIButton used in the
        // original file only exist in the separate uiblocks addon and were
        // never imported here, which is what crashed init().)
        setupSpatialUI() {
          this.panel = new xb.SpatialPanel({
            backgroundColor: '#080e1cee',
            width: 1.15,
            height: 0.72,
          });
          this.panel.position.set(0, xb.user.height, -xb.user.panelDistance);
          this.add(this.panel);

          const grid = this.panel.addGrid();

          grid.addRow({ weight: 0.22 }).addText({
            text: 'WIRELOOP',
            fontColor: '#00f0ff',
            fontSize: 0.09,
          });

          grid.addRow({ weight: 0.14 }).addText({
            text: 'Thread your wand cleanly through the warped loops!',
            fontColor: '#90a8c8',
            fontSize: 0.035,
          });

          this.uiStatsText = grid.addRow({ weight: 0.16 }).addText({
            text: 'Score: 0   Combo: 0 (x1)   Lives: 3/3',
            fontColor: '#ffd000',
            fontSize: 0.05,
          });

          this.uiStatusText = grid.addRow({ weight: 0.16 }).addText({
            text: 'Press START to Play',
            fontColor: '#a0c0e0',
            fontSize: 0.045,
          });

          this.uiActionButton = grid
            .addRow({ weight: 0.32 })
            .addCol({ weight: 1 })
            .addIconButton({ text: 'play_arrow', fontSize: 0.4 });
          this.uiActionButton.onTriggered = () => this.handleUiAction();
        }

        setupInputHandlers() {
          // Desktop pointer navigation for testing in the simulator, used
          // whenever a tracked XR controller isn't currently active.
          window.addEventListener('pointermove', (e) => {
            if (this.activeController) return;
            const mouse = new THREE.Vector2(
              (e.clientX / window.innerWidth) * 2 - 1,
              -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, xb.camera);
            const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0.75);
            const target = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(planeZ, target)) {
              this.wandPosition.x = THREE.MathUtils.lerp(this.wandPosition.x, target.x, 0.35);
              this.wandPosition.y = THREE.MathUtils.lerp(this.wandPosition.y, target.y, 0.35);
              this.wandGroup.position.copy(this.wandPosition);
            }
          });

          window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') this.handleUiAction();
          });
        }

        handleUiAction() {
          if (this.state === GAME_STATES.MENU || this.state === GAME_STATES.GAME_OVER) {
            this.startGame();
          } else if (this.state === GAME_STATES.PLAYING) {
            this.endGame('Game Paused');
          }
        }

        startGame() {
          this.state = GAME_STATES.PLAYING;
          this.score = 0;
          this.combo = 0;
          this.comboMultiplier = 1;
          this.lives = this.maxLives;
          this.difficultyStage = 1;
          this.currentSpawnInterval = LOOP_CONFIG.BASE_SPAWN_INTERVAL;
          this.currentLoopSpeed = LOOP_CONFIG.BASE_SPEED;
          this.timeSinceLastSpawn = this.currentSpawnInterval; // spawn first immediately

          // Clean pool
          this.loopPool.forEach(l => l.despawn());

          this.uiActionButton.text = 'stop';
          this.uiStatusText.text = 'GAME ACTIVE: Dodge the wire, thread the centers!';
          this.uiStatusText.fontColor = '#00ff88';
          this.updateUi();
        }

        endGame(message) {
          this.state = GAME_STATES.GAME_OVER;
          this.loopPool.forEach(l => l.despawn());

          this.uiActionButton.text = 'play_arrow';
          this.uiStatusText.text = `${message || 'GAME OVER'} — Final Score: ${this.score}`;
          this.uiStatusText.fontColor = '#ff3344';
          this.updateUi();
        }

        updateSpawner(dt) {
          if (this.state !== GAME_STATES.PLAYING) return;

          // Dynamic speed and interval scaling based on score
          const speedBonus = Math.min(LOOP_CONFIG.MAX_SPEED_BONUS, this.score * LOOP_CONFIG.SPEED_SCORE_SCALE);
          this.currentLoopSpeed = LOOP_CONFIG.BASE_SPEED + speedBonus;

          const progress = Math.min(1.0, this.score / LOOP_CONFIG.DIFFICULTY_RAMP_SCORE);
          this.currentSpawnInterval = THREE.MathUtils.lerp(
            LOOP_CONFIG.BASE_SPAWN_INTERVAL,
            LOOP_CONFIG.MIN_SPAWN_INTERVAL,
            progress
          );

          this.timeSinceLastSpawn += dt;
          if (this.timeSinceLastSpawn >= this.currentSpawnInterval) {
            this.timeSinceLastSpawn = 0;
            this.spawnNextLoop();
          }
        }

        spawnNextLoop() {
          const loop = this.loopPool.find(l => !l.active);
          if (!loop) return;

          const x = THREE.MathUtils.lerp(
            LOOP_CONFIG.REACH_BOUNDS_X.min,
            LOOP_CONFIG.REACH_BOUNDS_X.max,
            Math.random()
          );
          const y = THREE.MathUtils.lerp(
            LOOP_CONFIG.REACH_BOUNDS_Y.min,
            LOOP_CONFIG.REACH_BOUNDS_Y.max,
            Math.random()
          );

          // Cycle vibrant neon hues
          const palette = [0x00f0ff, 0xff00a0, 0x00ff88, 0xffbb00, 0xa044ff];
          const color = palette[Math.floor(Math.random() * palette.length)];

          loop.rebuildGeometry(); // generate unique perturbed 3D bend
          loop.spawn(x, y, this.currentLoopSpeed, color);
        }

        checkLoopCollision(loop, dt) {
          if (!loop.active || loop.resolved) return;

          loop.updateWorldSamples();

          // 3a) WIRE-TOUCH CHECK:
          // Min distance from wand tip to the M sampled world points on the 3D curve
          let minDistanceToWire = Infinity;
          for (let i = 0; i < LOOP_CONFIG.CURVE_SAMPLE_COUNT; i++) {
            const dist = this.wandTipPosition.distanceTo(loop.worldSampledPoints[i]);
            if (dist < minDistanceToWire) {
              minDistanceToWire = dist;
            }
          }

          const wireCollisionThreshold = LOOP_CONFIG.TUBE_RADIUS + LOOP_CONFIG.WAND_TIP_RADIUS;
          if (minDistanceToWire < wireCollisionThreshold) {
            // FAIL: grazed or hit the wire
            loop.resolved = true;
            this.onFail(loop, this.wandTipPosition);
            return;
          }

          // 3b) CLEAN-PASS CHECK:
          // Local plane-of-best-fit normal dot product: (wandTip - loopCenter) · loopNormal
          this.scratchToWand.subVectors(this.wandTipPosition, loop.worldCenter);
          const currentDot = this.scratchToWand.dot(loop.worldNormal);

          if (loop.hasPreviousDot) {
            // FIX: this must read loop.previousWandPlaneDot (the per-loop value
            // that's actually being updated below), not this.previousWandPlaneDot
            // (which was never set on the game instance and was always NaN).
            const crossedPlane = (loop.previousWandPlaneDot * currentDot <= 0) ||
                                 (Math.abs(loop.previousWandPlaneDot) < 0.04 && Math.abs(currentDot) < 0.04);

            if (crossedPlane && !loop.hasPassedPlane) {
              loop.hasPassedPlane = true;

              // Project wand tip onto the loop's local plane
              // Distance from loopCenter to wand projected point:
              this.scratchLoopPlane.setFromNormalAndCoplanarPoint(loop.worldNormal, loop.worldCenter);
              this.scratchLoopPlane.projectPoint(this.wandTipPosition, this.scratchProjected);
              const distFromCenter = this.scratchProjected.distanceTo(loop.worldCenter);

              if (distFromCenter <= loop.effectiveInnerRadius) {
                // SUCCESS: passed cleanly through the center!
                loop.resolved = true;
                this.onSuccess(loop, this.wandTipPosition);
                return;
              }
            }
          }

          loop.previousWandPlaneDot = currentDot;
          loop.hasPreviousDot = true;

          // 3c) MISS CHECK: loop passed player without successful crossing
          if (loop.position.z >= (LOOP_CONFIG.PLAYER_DEFAULT_Z + 0.3) && !loop.resolved) {
            loop.resolved = true;
            this.onMiss(loop);
          }
        }

        triggerHapticFeedback() {
          // WebXR Gamepad hapticActuators API
          if (this.activeController?.gamepad?.hapticActuators?.length > 0) {
            const actuator = this.activeController.gamepad.hapticActuators[0];
            if (actuator?.pulse) {
              actuator.pulse(0.85, 140);
            }
          }
        }

        handleSuccess(loop, wandTip) {
          this.sfx.playSuccess();
          this.combo++;
          this.comboMultiplier = Math.min(4, 1 + Math.floor(this.combo / 5));
          this.score += 10 * this.comboMultiplier;

          // Visual: flash loop green with pulse
          loop.material.color.setHex(0x00ff88);
          loop.material.emissive.setHex(0x00ff55);
          loop.material.emissiveIntensity = 1.0;
          loop.auraMat.opacity = 0.8;

          // Tip glow flare
          this.wandTipMat.color.setHex(0x00ff88);

          this.updateUi();
        }

        handleFail(loop, wandTip) {
          this.sfx.playFail();
          this.triggerHapticFeedback();
          this.combo = 0;
          this.comboMultiplier = 1;
          this.lives = Math.max(0, this.lives - 1);

          // Visual: Red flash & shatter fragments
          this.wandTipMat.color.setHex(0xff1744);
          loop.explodeFragments(wandTip);

          this.updateUi();

          if (this.lives <= 0) {
            this.endGame('OUT OF LIVES!');
          }
        }

        handleMiss(loop) {
          this.sfx.playMiss();
          this.combo = 0;
          this.comboMultiplier = 1;
          this.updateUi();
        }

        updateUi() {
          if (this.uiStatsText) {
            this.uiStatsText.text = `Score: ${this.score}   Combo: ${this.combo} (x${this.comboMultiplier})   Lives: ${this.lives}/${this.maxLives}`;
          }
        }

        update(time, frame) {
          // Use the documented delta-time helper rather than assuming update()'s
          // first argument is already a seconds value.
          const dt = Math.min(xb.getDeltaTime() || 0.016, 0.05);

          // 1. Sync Controller / Wand Tip Transform
          // NOTE: verify `xb.core.input.controllers` against your installed
          // xrblocks version's `input/` source if the wand doesn't track your
          // controller — this accessor isn't in the framework's own SKILL.md
          // examples, so treat it as best-effort. The pointer/keyboard fallback
          // above always works regardless, so the game is playable either way.
          if (xb.core.input?.controllers && xb.core.input.controllers.length > 0) {
            const c0 = xb.core.input.controllers[0];
            if (c0.visible && c0.position.lengthSq() > 0.01) {
              this.activeController = c0;
              this.wandGroup.position.copy(c0.position);
              this.wandGroup.quaternion.copy(c0.quaternion);
            }
          }

          // Calculate world position of the wand's forward collision tip
          this.wandTipMesh.getWorldPosition(this.wandTipPosition);

          // Ease wand tip color back to cyan
          this.wandTipMat.color.lerp(new THREE.Color(0x00f0ff), dt * 4.0);

          // 2. Update Spawner
          this.updateSpawner(dt);

          // 3. Move Active Loops & Check Collisions
          for (const loop of this.loopPool) {
            if (!loop.active) continue;

            // Move along +Z towards player
            loop.position.z += loop.speed * dt;

            // Update aura fade
            if (loop.auraMat.opacity > 0.01) {
              loop.auraMat.opacity -= dt * 2.5;
            }

            // Update explosion particles if shattered
            if (!loop.mesh.visible) {
              const activeParticles = loop.updateFragments(dt);
              if (!activeParticles && loop.position.z > LOOP_CONFIG.DESPAWN_Z) {
                loop.despawn();
              }
            } else {
              // Run collision evaluation
              this.checkLoopCollision(loop, dt);

              // Despawn if past cleanup threshold
              if (loop.position.z > LOOP_CONFIG.DESPAWN_Z) {
                loop.despawn();
              }
            }
          }
        }

        dispose() {
          this.loopPool.forEach(l => {
            l.mesh?.geometry?.dispose();
            l.material?.dispose();
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();

        // Real, verified feature flags (see src/SKILL.md in the xrblocks repo).
        options.enableUI();          // spatial UI + reticles for the SpatialPanel button
        options.enableReticles();    // pointing cursor
        options.enableControllers(); // tracked controllers
        options.enableHands();       // hand tracking
        options.enableHandRays();    // visible rays from hands/controllers

        xb.add(new WireLoopGame());
        xb.init(options);
      });
    </script>
  </body>
</html>
