<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Carnival Can Toss XR</title>
    <link
      type="text/css"
      rel="stylesheet"
      href="https://xrblocks.github.io/css/xr.css"
    />
    <!-- Cannon.js for authentic rigid-body physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js"

    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        border-radius: 50%;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
      }
      /* NEW: DOM HUD that replaces the crashed xb.UIText/UICard/UISlider panel.
         This renders reliably on the desktop simulator / any browser tab, but
         note: a plain DOM overlay like this is generally NOT visible once you
         enter an actual immersive WebXR session on a headset (the browser
         swaps to the XR compositor). For a real in-headset HUD later, you'd
         want xb.SpatialPanel (a 3D object in the scene) or to explicitly
         request WebXR's 'dom-overlay' session feature. For now this at least
         makes the game fully playable and testable in the simulator. */
      #hud-info {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(15, 23, 42, 0.88);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 260px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
      }
      #hud-score {
        font-size: 22px;
        font-weight: 800;
        color: #ffea00;
      }
      #hud-balls {
        font-size: 15px;
        font-weight: 700;
      }
      #hud-status {
        font-size: 13px;
        color: #cbd5e1;
        text-align: center;
      }
      #hud-power-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 12px;
        color: #e2e8f0;
      }
      #hud-controls {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.88);
        padding: 10px 16px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
      }
      .hud-btn {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #ffffff;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.1s ease, background 0.2s ease;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
      }
      .hud-btn:hover {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        transform: translateY(-2px);
      }

        transform: translateY(1px);
      }

        background: linear-gradient(135deg, #dc2626, #b91c1c);
        box-shadow: 0 4px 10px rgba(220, 38, 38, 0.35);
      }
      .hud-btn.reset-btn:hover {
        background: linear-gradient(135deg, #ef4444, #dc2626);
      }
      .hud-btn.toss-btn {
        background: linear-gradient(135deg, #059669, #047857);
        box-shadow: 0 4px 10px rgba(5, 150, 105, 0.35);
      }
      .hud-btn.toss-btn:hover {
        background: linear-gradient(135deg, #10b981, #059669);
      }
    </style>

  <body>
    <div id="crosshair"></div>

    <div id="hud-info">
      <div id="hud-score">SCORE: 0</div>
      <div id="hud-balls">BALLS: 5</div>
      <div id="hud-status">The can pyramid slides — time your throw!</div>
      <div id="hud-power-row">
        <span>Power</span>
        <input type="range" id="power-slider" min="3.5" max="9.0" step="0.5" value="5.8" />
      </div>
    </div>

    <div id="hud-controls">
      <button id="btn-start" class="hud-btn">▶ Start Game</button>
      <button id="btn-toss" class="hud-btn toss-btn">⚾ Toss Ball</button>
      <button id="btn-reset" class="hud-btn reset-btn">🔄 Reset Cans</button>
    </div>

    <script type="module">
import * as THREE from 'three';
import * as xb from 'xrblocks';

/*
 * FIXES APPLIED (see chat for the full explanation):
 * 1. Removed options.setAppTitle/setAppDescription/simulator.defaultMode
 *    (which read the undefined xb.SimulatorMode.CONTROLLER)/xrButton.*/
 *    reticles.enabled — none of these exist on xb.Options and the
 *    SimulatorMode access threw immediately, before xb.init() ever ran.
 * 2. Removed setupSpatialUI() entirely — it called xb.UIText/UIButton/UICard/
 *    UIPanel/UISlider, none of which exist on the core `xrblocks` import
 *    (they're uiblocks-addon-only and that addon was never imported here).
 *    Because setupSpatialUI() ran BEFORE setupControls() inside init(), that
 *    crash also silently prevented your real DOM buttons from ever being
 *    wired up — that's the actual reason nothing responded to clicks.
 * 3. Extended the existing DOM overlay (#hud-info) to show score/balls/status/
 *    power instead, since it's a working, dependency-free UI that doesn't
 *    guess at any XR Blocks class names.
 * 4. Added options.enableControllers() so xb.core.input.controllers is
 *    actually populated for the hand/controller-driven throw logic.
 * 5. Switched xb.core.camera -> xb.camera (the documented alias) in the two
 *    mouse-raycast functions.
 */

const CAN_RADIUS = 0.052;
const CAN_HEIGHT = 0.15;
const BALL_RADIUS = 0.046;
const TABLE_Y = 0.92;
const TABLE_Z = -1.85;
// Stand positioned right at comfortable arm's reach
const STAND_POS = new THREE.Vector3(0.18, 0.96, -0.55);
const INITIAL_BALLS = 5;

// Moving-target configuration: the whole can pyramid slides side to side as
// one unit. Cans stay "held" on the track (position forced every frame,
// velocity zeroed) until a fast-enough ball gets close, at which point that
// can is released and given a real velocity so ordinary Cannon.js physics
// topples it — this is why the existing tilt/fell-down scoring loop didn't
// need to change at all.
const TRACK_RANGE_X = 0.16;   // how far the pyramid sways left/right (m)
const TRACK_SPEED = 1.1;      // sway angular speed
const CAN_HIT_RADIUS = CAN_RADIUS + BALL_RADIUS + 0.02;
const MIN_KNOCK_SPEED = 1.5;  // ball speed (m/s) required to release+knock a can

class CarnivalAudio {
  constructor() {
    this.ctx = null;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playGrab() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(260, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(540, this.ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.11);
    } catch (_) {}
  }

  playWhoosh() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.24);
    } catch (_) {}
  }

  playCanHit() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(780, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    } catch (_) {}
  }

  playCheer() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.32);
      });
    } catch (_) {}
  }
}

function createBaseballTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#faf8f5';
  ctx.fillRect(0, 0, 512, 256);

  ctx.strokeStyle = '#c62828';
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let x = 0; x <= 512; x += 4) {
    const y = 128 + Math.sin((x / 512) * Math.PI * 2) * 54;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.lineWidth = 3;
  for (let x = 0; x <= 512; x += 18) {
    const y = 128 + Math.sin((x / 512) * Math.PI * 2) * 54;
    ctx.beginPath();
    ctx.moveTo(x - 5, y - 9);
    ctx.lineTo(x + 5, y + 9);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createCanTexture(colorHex, pointsLabel) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = colorHex;
  ctx.fillRect(0, 0, 256, 256);

  // Metallic top and bottom borders
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, 0, 256, 26);
  ctx.fillRect(0, 230, 256, 26);

  // White label badge
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(128, 128, 62, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Points text
  ctx.fillStyle = '#dc2626';
  ctx.font = 'bold 44px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pointsLabel, 128, 128);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

class ConfettiSystem extends THREE.Group {
  constructor(count = 70) {
    super();
    this.particles = [];
    const geom = new THREE.PlaneGeometry(0.025, 0.025);
    const colors = [0xff3b30, 0xffcc00, 0x34c759, 0x007aff, 0xff9500, 0xaf52de];

    for (let i = 0; i < count; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: colors[i % colors.length],
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.visible = false;
      this.add(mesh);
      this.particles.push({
        mesh,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3(),
        life: 0,
        maxLife: 0,
      });
    }
  }

  burst(origin) {
    for (const p of this.particles) {
      p.mesh.position.copy(origin);
      p.mesh.visible = true;
      p.vel.set(
        (Math.random() - 0.5) * 3.5,
        Math.random() * 2.8 + 1.2,
        (Math.random() - 0.5) * 3.0
      );
      p.rotVel.set(Math.random() * 12, Math.random() * 12, Math.random() * 12);
      p.life = 0;
      p.maxLife = 1.6 + Math.random() * 0.8;
    }
  }

  update(dt) {
    for (const p of this.particles) {
      if (!p.mesh.visible) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
        continue;
      }
      p.vel.y -= 7.5 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.rotation.x += p.rotVel.x * dt;
      p.mesh.rotation.y += p.rotVel.y * dt;
      p.mesh.scale.setScalar(Math.max(0.01, 1 - p.life / p.maxLife));
    }
  }
}

class CarnivalGameScene extends xb.Script {
  constructor() {
    super();
    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.pitchPower = 5.8;

    this.audio = new CarnivalAudio();
    this.baseballTexture = createBaseballTexture();

    this.cans = [];
    this.balls = [];
    this.controllers = [];
    this.controllerVelocityBuffers = new Map();

    // Natural grab and throw tracking
    this.isGrabbingInteractiveBall = false;
    this.grabbedSource = null; // Controller or 'mouse'
    this.grabOffset = new THREE.Vector3();
    this.mouseCoords = new THREE.Vector2();
    this.grabPlane = new THREE.Plane();
    this.grabPlaneIntersect = new THREE.Vector3();
    this.recentPositions = [];
    this.respawnTimer = null;

    // DOM HUD element references, wired up in setupControls()
    this.domScoreEl = null;
    this.domBallsEl = null;
    this.domStatusEl = null;
    this.domPowerSlider = null;

    this.initCannonWorld();
  }

  // Renamed from the original initPhysics() to avoid any confusion with the
  // xb.Script lifecycle hook of the same name (that hook is only invoked
  // automatically by Core when options.physics.RAPIER is set, which this
  // game intentionally doesn't use — it manages its own CANNON.World).
  initCannonWorld() {
    this.world = new CANNON.World();
    this.world.gravity.set(0, -9.82, 0);
    this.world.broadphase = new CANNON.NaiveBroadphase();
    this.world.solver.iterations = 14;

    const defaultMat = new CANNON.Material('default');
    const contactMat = new CANNON.ContactMaterial(defaultMat, defaultMat, {
      friction: 0.44,
      restitution: 0.3,
    });
    this.world.addContactMaterial(contactMat);
    this.world.defaultContactMaterial = contactMat;
  }

  init() {
    this.setupLighting();
    this.setupCarnivalBooth();
    this.setupCanPyramid();
    this.setupBallStand();
    this.setupInteractiveHands();
    this.setupControls();

    this.confetti = new ConfettiSystem(80);
    this.add(this.confetti);
  }

  setupLighting() {
    const hemi = new THREE.HemisphereLight(0xfff7e6, 0x422a1d, 2.6);
    this.add(hemi);

    const dir = new THREE.DirectionalLight(0xfff5e6, 2.6);
    dir.position.set(2.0, 4.2, 1.5);
    dir.castShadow = true;
    this.add(dir);

    // Warm booth lanterns
    const leftLamp = new THREE.PointLight(0xffb74d, 2.0, 5.0);
    leftLamp.position.set(-0.8, 2.2, TABLE_Z + 0.3);
    const rightLamp = new THREE.PointLight(0xffb74d, 2.0, 5.0);
    rightLamp.position.set(0.8, 2.2, TABLE_Z + 0.3);
    this.add(leftLamp, rightLamp);
  }

  setupCarnivalBooth() {
    this.boothGroup = new THREE.Group();

    // Wood counter table
    const tableGeom = new THREE.BoxGeometry(1.7, 0.1, 0.9);
    const tableMat = new THREE.MeshStandardMaterial({
      color: 0x5d4037,
      roughness: 0.65,
      metalness: 0.1,
    });
    const tableMesh = new THREE.Mesh(tableGeom, tableMat);
    tableMesh.position.set(0, TABLE_Y - 0.05, TABLE_Z);
    tableMesh.receiveShadow = true;
    this.boothGroup.add(tableMesh);

    // Static physics body for counter
    const tableBody = new CANNON.Body({ mass: 0 });
    tableBody.addShape(new CANNON.Box(new CANNON.Vec3(0.85, 0.05, 0.45)));
    tableBody.position.set(0, TABLE_Y - 0.05, TABLE_Z);
    this.world.addBody(tableBody);

    // Table legs
    const legGeom = new THREE.CylinderGeometry(0.04, 0.04, TABLE_Y - 0.1, 16);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 });
    const legCoords = [
      [-0.75, (TABLE_Y - 0.1) / 2, TABLE_Z - 0.35],
      [0.75, (TABLE_Y - 0.1) / 2, TABLE_Z - 0.35],
      [-0.75, (TABLE_Y - 0.1) / 2, TABLE_Z + 0.35],
      [0.75, (TABLE_Y - 0.1) / 2, TABLE_Z + 0.35],
    ];
    for (const [lx, ly, lz] of legCoords) {
      const leg = new THREE.Mesh(legGeom, legMat);
      leg.position.set(lx, ly, lz);
      this.boothGroup.add(leg);
    }

    // Booth backdrop
    const backGeom = new THREE.BoxGeometry(2.2, 2.2, 0.08);
    const backMat = new THREE.MeshStandardMaterial({
      color: 0x1a237e,
      roughness: 0.7,
    });
    const backMesh = new THREE.Mesh(backGeom, backMat);
    backMesh.position.set(0, 1.45, TABLE_Z - 0.45);
    this.boothGroup.add(backMesh);

    const backBody = new CANNON.Body({ mass: 0 });
    backBody.addShape(new CANNON.Box(new CANNON.Vec3(1.1, 1.1, 0.04)));
    backBody.position.set(0, 1.45, TABLE_Z - 0.45);
    this.world.addBody(backBody);

    // Side guards to keep cans contained
    const sideGeom = new THREE.BoxGeometry(0.06, 0.3, 0.85);
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
    const leftSide = new THREE.Mesh(sideGeom, sideMat);
    leftSide.position.set(-0.82, TABLE_Y + 0.15, TABLE_Z);
    const rightSide = new THREE.Mesh(sideGeom, sideMat);
    rightSide.position.set(0.82, TABLE_Y + 0.15, TABLE_Z);
    this.boothGroup.add(leftSide, rightSide);

    // Floor physics plane
    const floorBody = new CANNON.Body({ mass: 0 });
    floorBody.addShape(new CANNON.Plane());
    floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    floorBody.position.set(0, 0, 0);
    this.world.addBody(floorBody);

    // Striped Awning canopy
    const awning = new THREE.Group();
    const stripes = 9;
    const stripeW = 2.2 / stripes;
    for (let i = 0; i < stripes; i++) {
      const sGeom = new THREE.BoxGeometry(stripeW, 0.04, 0.7);
      const isRed = i % 2 === 0;
      const sMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xd32f2f : 0xffffff,
        roughness: 0.5,
      });
      const sMesh = new THREE.Mesh(sGeom, sMat);
      sMesh.position.set(-1.1 + stripeW * (i + 0.5), 0, 0);
      awning.add(sMesh);
    }
    awning.position.set(0, 2.5, TABLE_Z - 0.15);
    awning.rotation.x = 0.28;
    this.boothGroup.add(awning);

    this.add(this.boothGroup);
  }

  setupCanPyramid() {
    const pyramidLayout = [
      // Bottom Row (3 cans) - 100 points
      { x: -0.13, y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#e53935', label: '100', pts: 100 },
      { x: 0.0,   y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#1e88e5', label: '100', pts: 100 },
      { x: 0.13,  y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#43a047', label: '100', pts: 100 },
      // Middle Row (2 cans) - 200 points
      { x: -0.065, y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.015, z: TABLE_Z, color: '#fb8c00', label: '200', pts: 200 },
      { x: 0.065,  y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.015, z: TABLE_Z, color: '#8e24aa', label: '200', pts: 200 },
      // Top Row (1 can) - 500 points
      { x: 0.0,    y: TABLE_Y + CAN_HEIGHT * 2.5 + 0.025, z: TABLE_Z, color: '#fbc02d', label: '500', pts: 500 },
    ];

    const canGeom = new THREE.CylinderGeometry(CAN_RADIUS, CAN_RADIUS, CAN_HEIGHT, 24);

    for (const cfg of pyramidLayout) {
      const tex = createCanTexture(cfg.color, cfg.label);
      const canMat = new THREE.MeshStandardMaterial({
        map: tex,
        metalness: 0.55,
        roughness: 0.35,
      });
      const mesh = new THREE.Mesh(canGeom, canMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      this.add(mesh);

      // Stable rigid body with damping for reliable stacking
      const body = new CANNON.Body({
        mass: 0.32,
        position: new CANNON.Vec3(cfg.x, cfg.y, cfg.z),
      });
      body.addShape(new CANNON.Box(new CANNON.Vec3(CAN_RADIUS * 0.9, CAN_HEIGHT / 2, CAN_RADIUS * 0.9)));
      body.linearDamping = 0.25;
      body.angularDamping = 0.35;

      this.world.addBody(body);

      this.cans.push({
        mesh,
        body,
        initialPos: new CANNON.Vec3(cfg.x, cfg.y, cfg.z),
        points: cfg.pts,
        isKnocked: false,
        isReleasedFromTrack: false,
      });
    }

    this.syncCansTransforms();
  }

  setupBallStand() {
    const standGeom = new THREE.CylinderGeometry(0.14, 0.18, 0.95, 24);
    const standMat = new THREE.MeshStandardMaterial({
      color: 0x37474f,
      roughness: 0.6,
      metalness: 0.2,
    });
    this.stand = new THREE.Mesh(standGeom, standMat);
    this.stand.position.set(STAND_POS.x, STAND_POS.y / 2, STAND_POS.z);
    this.add(this.stand);

    // Pedestal cup
    const cupGeom = new THREE.CylinderGeometry(0.065, 0.04, 0.03, 16);
    const cupMat = new THREE.MeshStandardMaterial({ color: 0xc2185b, roughness: 0.5 });
    const cup = new THREE.Mesh(cupGeom, cupMat);
    cup.position.set(STAND_POS.x, STAND_POS.y + 0.015, STAND_POS.z);
    this.add(cup);

    // Interactive grabbable baseball
    const ballGeom = new THREE.SphereGeometry(BALL_RADIUS, 24, 24);
    const ballMat = new THREE.MeshStandardMaterial({
      map: this.baseballTexture,
      roughness: 0.38,
      metalness: 0.1,
    });
    this.interactiveBall = new THREE.Mesh(ballGeom, ballMat);
    this.interactiveBall.position.copy(STAND_POS);
    this.interactiveBall.position.y += BALL_RADIUS + 0.03;
    this.interactiveBall.castShadow = true;
    this.interactiveBall.name = 'InteractiveBall';

    // Grab target indicator ring
    const ringGeom = new THREE.RingGeometry(BALL_RADIUS + 0.012, BALL_RADIUS + 0.028, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00e5ff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75,
    });
    this.grabRing = new THREE.Mesh(ringGeom, ringMat);
    this.grabRing.rotation.x = -Math.PI / 2;
    this.grabRing.position.y = -BALL_RADIUS * 0.4;
    this.interactiveBall.add(this.grabRing);

    this.add(this.interactiveBall);
  }

  setupInteractiveHands() {
    this.handVisuals = [];
    const controllerColors = [0x0284c7, 0x9333ea];

    for (let i = 0; i < 2; i++) {
      const group = new THREE.Group();
      group.name = `GrabbableHand_${i}`;
      group.visible = false;

      // Ergonomic VR controller glove body
      const palmGeom = new THREE.BoxGeometry(0.065, 0.038, 0.1);
      const palmMat = new THREE.MeshStandardMaterial({
        color: controllerColors[i],
        roughness: 0.3,
        metalness: 0.2,
      });
      const palm = new THREE.Mesh(palmGeom, palmMat);
      group.add(palm);

      // Grasping fingers indicator
      const fingersGeom = new THREE.BoxGeometry(0.06, 0.024, 0.04);
      const fingersMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const fingers = new THREE.Mesh(fingersGeom, fingersMat);
      fingers.position.set(0, 0.015, -0.06);
      group.add(fingers);

      // Aiming laser reticle
      const rayGeom = new THREE.CylinderGeometry(0.002, 0.002, 0.65, 8);
      const rayMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.65,
      });
      const ray = new THREE.Mesh(rayGeom, rayMat);
      ray.rotation.x = -Math.PI / 2;
      ray.position.set(0, 0, -0.32);
      group.add(ray);

      // Grab proximity sphere
      const grabSphereGeom = new THREE.SphereGeometry(0.08, 16, 16);
      const grabSphereMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        wireframe: true,
        transparent: true,
        opacity: 0.0,
      });
      const grabSphere = new THREE.Mesh(grabSphereGeom, grabSphereMat);
      group.add(grabSphere);

      this.add(group);
      this.handVisuals.push({
        group,
        palm,
        fingers,
        ray,
        grabSphere,
        color: controllerColors[i],
      });
    }
  }

  setupControls() {
    // Wire up the DOM HUD (score/balls/status/power) — this is now the only
    // UI system this game uses; see the top-of-file fix notes for why.
    this.domScoreEl = document.getElementById('hud-score');
    this.domBallsEl = document.getElementById('hud-balls');
    this.domStatusEl = document.getElementById('hud-status');
    this.domPowerSlider = document.getElementById('power-slider');

    if (this.domPowerSlider) {
      this.domPowerSlider.value = String(this.pitchPower);
      this.domPowerSlider.addEventListener('input', (e) => {
        this.pitchPower = parseFloat(e.target.value);
      });
    }

    // Connect DOM HUD buttons for immediate responsiveness
    const btnStart = document.getElementById('btn-start');
    const btnToss = document.getElementById('btn-toss');
    const btnReset = document.getElementById('btn-reset');

    if (btnStart) btnStart.addEventListener('click', () => this.startGame());
    if (btnToss) btnToss.addEventListener('click', () => this.pitchTowardsCans(1.0));
    if (btnReset) btnReset.addEventListener('click', () => this.resetGame());

    // Desktop mouse fling & touch fallback controls
    window.addEventListener('mousedown', (e) => this.onPointerDown(e));
    window.addEventListener('mousemove', (e) => this.onPointerMove(e));
    window.addEventListener('mouseup', (e) => this.onPointerUp(e));
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) this.onPointerDown(e.touches[0]);
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) this.onPointerMove(e.touches[0]);
    }, { passive: false });
    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length > 0) this.onPointerUp(e.changedTouches[0]);
    }, { passive: false });

    // Render initial HUD state
    this.updateUI();
  }

  startGame() {
    this.resetGame();
    if (this.domStatusEl) {
      this.domStatusEl.textContent = 'Game started! The pyramid is sliding — lead your throw!';
      this.domStatusEl.style.color = '#38bdf8';
    }
    this.audio.playGrab();
  }

  onPointerDown(event) {
    if (event.target.tagName === 'BUTTON' || event.target.closest('button')) return;
    if (event.target.tagName === 'INPUT') return;
    if (this.ballsRemaining <= 0 || !this.interactiveBall.visible) return;

    this.mouseCoords.x = (event.clientX / window.innerWidth) * 2 - 1;
    this.mouseCoords.y = -(event.clientY / window.innerHeight) * 2 + 1;

    const camera = xb.camera;
    if (!camera) return;

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(this.mouseCoords, camera);
    const intersects = raycaster.intersectObject(this.interactiveBall, true);
    const distToBall = raycaster.ray.distanceToPoint(this.interactiveBall.position);

    if (intersects.length > 0 || distToBall < 0.2) {
      this.isGrabbingInteractiveBall = true;
      this.grabbedSource = 'mouse';
      this.audio.playGrab();

      this.recentPositions = [
        { pos: this.interactiveBall.position.clone(), time: performance.now() },
      ];

      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      this.grabPlane.setFromNormalAndCoplanarPoint(camDir.negate(), this.interactiveBall.position);
    }
  }

  onPointerMove(event) {
    if (!this.isGrabbingInteractiveBall || this.grabbedSource !== 'mouse') return;

    this.mouseCoords.x = (event.clientX / window.innerWidth) * 2 - 1;
    this.mouseCoords.y = -(event.clientY / window.innerHeight) * 2 + 1;

    const camera = xb.camera;
    if (!camera) return;

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(this.mouseCoords, camera);

    if (raycaster.ray.intersectPlane(this.grabPlane, this.grabPlaneIntersect)) {
      const dy = Math.max(0, this.grabPlaneIntersect.y - STAND_POS.y);
      this.grabPlaneIntersect.z = STAND_POS.z - dy * 0.45;
      this.interactiveBall.position.copy(this.grabPlaneIntersect);

      const now = performance.now();
      this.recentPositions.push({ pos: this.interactiveBall.position.clone(), time: now });
      while (this.recentPositions.length > 1 && now - this.recentPositions[0].time > 120) {
        this.recentPositions.shift();
      }
    }
  }

  onPointerUp() {
    if (!this.isGrabbingInteractiveBall || this.grabbedSource !== 'mouse') return;

    this.isGrabbingInteractiveBall = false;
    this.grabbedSource = null;

    let throwVelocity = new THREE.Vector3(0, 3.2, -6.0);

    if (this.recentPositions.length >= 2) {
      const oldest = this.recentPositions[0];
      const newest = this.recentPositions[this.recentPositions.length - 1];
      const dt = Math.max(0.016, (newest.time - oldest.time) / 1000);
      const delta = newest.pos.clone().sub(oldest.pos);
      const computedVel = delta.divideScalar(dt).multiplyScalar(1.25);

      if (computedVel.z >= -1.0) {
        computedVel.z = -Math.max(4.2, Math.hypot(computedVel.x, computedVel.y) * 1.3);
      }
      computedVel.y = Math.max(1.8, computedVel.y + 0.6);
      throwVelocity.copy(computedVel);
    }

    this.pitchBallWithVelocity(throwVelocity, this.interactiveBall.position);
    this.hideAndRespawnBall();
  }

  hideAndRespawnBall() {
    this.interactiveBall.visible = false;
    if (this.respawnTimer) clearTimeout(this.respawnTimer);

    if (this.ballsRemaining > 0) {
      this.respawnTimer = setTimeout(() => {
        this.interactiveBall.position.copy(STAND_POS);
        this.interactiveBall.position.y += BALL_RADIUS + 0.03;
        this.interactiveBall.visible = true;
      }, 450);
    }
  }

  pitchBallWithVelocity(velocity, customSpawnPos = null) {
    if (this.ballsRemaining <= 0) return;

    this.ballsRemaining--;
    this.updateUI();
    this.audio.playWhoosh();

    const spawnPos = customSpawnPos
      ? customSpawnPos.clone()
      : new THREE.Vector3(STAND_POS.x, STAND_POS.y + BALL_RADIUS + 0.05, STAND_POS.z);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_RADIUS, 24, 24),
      new THREE.MeshStandardMaterial({
        map: this.baseballTexture,
        roughness: 0.4,
        metalness: 0.1,
      })
    );
    ballMesh.castShadow = true;
    ballMesh.position.copy(spawnPos);
    this.add(ballMesh);

    const ballBody = new CANNON.Body({
      mass: 0.52,
      shape: new CANNON.Sphere(BALL_RADIUS),
      position: new CANNON.Vec3(spawnPos.x, spawnPos.y, spawnPos.z),
    });
    ballBody.velocity.set(velocity.x, velocity.y, velocity.z);
    ballBody.angularVelocity.set(
      (Math.random() - 0.5) * 16,
      (Math.random() - 0.5) * 16,
      (Math.random() - 0.5) * 16
    );

    ballBody.addEventListener('collide', (ev) => {
      if (ev.body && ev.body.mass > 0) {
        this.audio.playCanHit();
      }
    });

    this.world.addBody(ballBody);
    this.balls.push({ mesh: ballMesh, body: ballBody, aliveTime: 0 });
  }

  pitchTowardsCans(powerMultiplier = 1.0) {
    if (this.ballsRemaining <= 0) return;

    const speed = (this.pitchPower + Math.random() * 0.4) * powerMultiplier;
    const target = new THREE.Vector3(
      (Math.random() - 0.5) * 0.16,
      TABLE_Y + CAN_HEIGHT + 0.08,
      TABLE_Z
    );
    const start = this.interactiveBall.visible
      ? this.interactiveBall.position.clone()
      : new THREE.Vector3(STAND_POS.x, STAND_POS.y + 0.1, STAND_POS.z);
    const delta = target.clone().sub(start);
    const time = delta.length() / speed;

    const vel = delta.divideScalar(time);
    vel.y += 0.5 * 9.82 * time;

    this.pitchBallWithVelocity(vel, start);
    this.hideAndRespawnBall();
  }

  updateUI() {
    if (this.domScoreEl) this.domScoreEl.textContent = `SCORE: ${this.score}`;
    if (this.domBallsEl) this.domBallsEl.textContent = `BALLS: ${this.ballsRemaining}`;

    if (this.domStatusEl) {
      if (this.knockedCount === this.cans.length) {
        this.domStatusEl.textContent = '🎉 STRIKE! ALL CANS DOWN! +500 PTS!';
        this.domStatusEl.style.color = '#22c55e';
      } else if (this.ballsRemaining <= 0) {
        this.domStatusEl.textContent = 'Out of balls! Hit Start Game or Reset Cans!';
        this.domStatusEl.style.color = '#f97316';
      } else {
        this.domStatusEl.textContent = `${this.knockedCount}/6 cans knocked down!`;
        this.domStatusEl.style.color = '#cbd5e1';
      }
    }
  }

  resetGame() {
    for (const can of this.cans) {
      can.body.position.copy(can.initialPos);
      can.body.velocity.set(0, 0, 0);
      can.body.angularVelocity.set(0, 0, 0);
      can.body.quaternion.set(0, 0, 0, 1);
      can.isKnocked = false;
      can.isReleasedFromTrack = false;
    }
    this.syncCansTransforms();

    for (const b of this.balls) {
      this.world.removeBody(b.body);
      this.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
    this.balls = [];

    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.interactiveBall.position.copy(STAND_POS);
    this.interactiveBall.position.y += BALL_RADIUS + 0.03;
    this.interactiveBall.visible = true;
    this.updateUI();
  }

  syncCansTransforms() {
    for (const can of this.cans) {
      can.mesh.position.copy(can.body.position);
      can.mesh.quaternion.copy(can.body.quaternion);
    }
  }

  updateMovingTargets(timeSec) {
    const trackX = Math.sin(timeSec * TRACK_SPEED) * TRACK_RANGE_X;

    // 1. Check every still-on-track can against every live ball. A ball
    // close enough and fast enough releases that can from the track and
    // gives it a real velocity so normal Cannon.js physics topples it.
    for (const can of this.cans) {
      if (can.isKnocked || can.isReleasedFromTrack) continue;

      for (const b of this.balls) {
        const dx = b.body.position.x - can.body.position.x;
        const dy = b.body.position.y - can.body.position.y;
        const dz = b.body.position.z - can.body.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist >= CAN_HIT_RADIUS) continue;

        const speed = Math.hypot(b.body.velocity.x, b.body.velocity.y, b.body.velocity.z);
        if (speed < MIN_KNOCK_SPEED) continue;

        can.isReleasedFromTrack = true;
        can.body.velocity.set(
          b.body.velocity.x * 0.6,
          Math.max(1.2, b.body.velocity.y * 0.4 + 1.0),
          b.body.velocity.z * 0.6
        );
        can.body.angularVelocity.set(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10
        );
        break;
      }
    }

    // 2. Every can still on the track is held there kinematic-style: force
    // its position every frame and zero out velocity so gravity/collisions
    // can't drag it off the pyramid layout before it's actually been hit.
    for (const can of this.cans) {
      if (can.isKnocked || can.isReleasedFromTrack) continue;
      can.body.position.x = can.initialPos.x + trackX;
      can.body.position.y = can.initialPos.y;
      can.body.position.z = can.initialPos.z;
      can.body.velocity.set(0, 0, 0);
      can.body.angularVelocity.set(0, 0, 0);
      can.body.quaternion.set(0, 0, 0, 1);
    }
  }

  updateHandsAndControllers(dt) {
    // NOTE: xb.core.input.controllers isn't in XR Blocks' own verified
    // examples — treat this as best-effort and check the real shape with
    // console.log(xb.core.input) / console.log(xb.user) if hand/controller
    // throws don't register on a real headset. The mouse/touch path above
    // works regardless, so the game is fully playable either way.
    const inputControllers = xb.core.input?.controllers || [];

    for (let i = 0; i < this.handVisuals.length; i++) {
      const visual = this.handVisuals[i];
      const controller = inputControllers[i];

      if (controller && controller.visible) {
        visual.group.visible = true;
        visual.group.position.copy(controller.position);
        visual.group.quaternion.copy(controller.quaternion);

        // Track velocity buffer for realistic 6DoF momentum release
        let history = this.controllerVelocityBuffers.get(controller);
        if (!history) {
          history = [];
          this.controllerVelocityBuffers.set(controller, history);
        }
        const now = performance.now();
        history.push({ pos: controller.position.clone(), time: now });
        while (history.length > 1 && now - history[0].time > 120) {
          history.shift();
        }

        const distToBall = controller.position.distanceTo(this.interactiveBall.position);
        const isTriggerOrGrip = Boolean(controller.userData?.selected || controller.userData?.squeezed);

        // Highlight hand and ball grab ring when within reach
        if (distToBall < 0.16 && this.interactiveBall.visible) {
          visual.grabSphere.material.opacity = 0.45;
          this.grabRing.material.color.set(0x22c55e);
        } else {
          visual.grabSphere.material.opacity = 0.0;
          this.grabRing.material.color.set(0x00e5ff);
        }

        // Grabbing condition
        if (distToBall < 0.16 && isTriggerOrGrip && !this.isGrabbingInteractiveBall && this.interactiveBall.visible) {
          this.isGrabbingInteractiveBall = true;
          this.grabbedSource = controller;
          this.audio.playGrab();
          visual.fingers.position.set(0, 0.015, -0.04); // Clench fingers
        }

        // Holding ball: stick to hand
        if (this.isGrabbingInteractiveBall && this.grabbedSource === controller) {
          this.interactiveBall.position.copy(controller.position);

          // Release: compute velocity from buffer
          if (!isTriggerOrGrip) {
            this.isGrabbingInteractiveBall = false;
            this.grabbedSource = null;
            visual.fingers.position.set(0, 0.015, -0.06); // Open fingers

            let throwVel = new THREE.Vector3(0, 2.8, -5.5);
            if (history.length >= 2) {
              const oldest = history[0];
              const newest = history[history.length - 1];
              const timeDiff = Math.max(0.016, (newest.time - oldest.time) / 1000);
              const computed = newest.pos.clone().sub(oldest.pos).divideScalar(timeDiff).multiplyScalar(1.35);

              if (computed.length() > 1.2) {
                throwVel.copy(computed);
                if (throwVel.z >= -0.8) {
                  throwVel.z = -Math.max(3.8, Math.hypot(throwVel.x, throwVel.y) * 1.2);
                }
              }
            }

            this.pitchBallWithVelocity(throwVel, controller.position);
            this.hideAndRespawnBall();
          }
        }
      } else {
        visual.group.visible = false;
      }
    }
  }

  update() {
    const dt = xb.getDeltaTime() || 0.016;
    const timeSec = performance.now() * 0.001;

    // Pulse target ring
    this.grabRing.rotation.z += 0.025;
    this.grabRing.material.opacity = 0.55 + Math.sin(performance.now() * 0.006) * 0.25;

    // Step physics world
    this.world.step(Math.min(dt, 0.033));

    // Moving targets: check hits, then re-hold un-hit cans on the track
    this.updateMovingTargets(timeSec);

    // Update cans and scoring
    this.syncCansTransforms();
    let newlyKnocked = 0;

    for (const can of this.cans) {
      if (!can.isKnocked) {
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(can.mesh.quaternion);
        const tilt = Math.acos(Math.max(-1, Math.min(1, up.y)));
        const fellDown = can.mesh.position.y < TABLE_Y - 0.05;

        if (tilt > 0.65 || fellDown) {
          can.isKnocked = true;
          newlyKnocked++;
          this.score += can.points;
        }
      }
    }

    if (newlyKnocked > 0) {
      this.knockedCount += newlyKnocked;
      this.updateUI();

      if (this.knockedCount === this.cans.length) {
        this.score += 500;
        this.audio.playCheer();
        this.confetti.burst(new THREE.Vector3(0, TABLE_Y + 0.35, TABLE_Z));
        this.updateUI();
      }
    }

    // Update active baseballs
    for (let i = this.balls.length - 1; i >= 0; i--) {
      const b = this.balls[i];
      b.aliveTime += dt;
      b.mesh.position.copy(b.body.position);
      b.mesh.quaternion.copy(b.body.quaternion);

      if (b.aliveTime > 6.0) {
        this.world.removeBody(b.body);
        this.remove(b.mesh);
        b.mesh.geometry.dispose();
        b.mesh.material.dispose();
        this.balls.splice(i, 1);
      }
    }

    this.updateHandsAndControllers(dt);
    this.confetti.update(dt);
  }

  dispose() {
    this.baseballTexture.dispose();
    for (const can of this.cans) {
      can.mesh.geometry.dispose();
      can.mesh.material.dispose();
    }
    for (const b of this.balls) {
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const options = new xb.Options();

  // Real, verified feature flags only (see src/SKILL.md in the xrblocks repo).
  options.enableHands();       // hand tracking
  options.enableControllers(); // tracked controllers — needed for updateHandsAndControllers()
  options.enableReticles();    // pointing cursor

  // Best-effort sub-option properties — kept from your original file. These
  // aren't in the framework's own verified examples; if they're not real
  // property names they're simply ignored rather than crashing anything.
  options.hands.visualization = true;
  options.hands.visualizeJoints = true;
  options.hands.visualizeMeshes = true;

  xb.add(new CarnivalGameScene());
  xb.init(options);
});
    </script>
