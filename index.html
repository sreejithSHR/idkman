    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",

          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class SoundFX {
        constructor() {
          this.ctx = null;
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playThrow() {
          this.initContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.11);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.11);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        }

        playHit(ringTier) {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const baseFreq = ringTier === 3 ? 1046 : ringTier === 2 ? 698 : 523;
          osc.type = ringTier === 3 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, now + 0.22);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }

        playStart() {
          this.initContext();
          if (!this.ctx) return;
          const chord = [392, 523.25, 659.25, 783.99];
          chord.forEach((f, i) => {
            const now = this.ctx.currentTime + i * 0.08;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          });
        }

        playStreak() {
          this.initContext();
          if (!this.ctx) return;
          const notes = [587.33, 739.99, 880, 1174.66];
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.05;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
          });
        }
      }

      class BallThrowGame extends xb.Script {
        constructor() {
          super();
          this.sfx = new SoundFX();
          this.score = 0;
          this.highScore = 0;
          this.shotsFired = 0;
          this.shotsHit = 0;
          this.streak = 0;
          this.maxStreak = 0;

          this.isPlaying = false;
          this.gameTimeRemaining = 60.0;
          this.roundDuration = 60.0;

          this.balls = [];
          this.targets = [];
          this.pitBalls = [];
          this.particles = [];
          this.popups = [];

          this.gravity = -8.2;
          this.lastThrowTime = 0;
          this.throwCooldownMs = 140;
        }

        init() {
          this.setupLighting();
          this.buildEnvironment();
          this.buildBallPit();
          this.buildFreeFlowingTargets();
          this.buildNearSpatialUi();
          this.buildParticlePool();
        }

        setupLighting() {
          const hemiLight = new THREE.HemisphereLight(0x223355, 0x070b14, 2.2);
          this.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xfff0dd, 2.6);
          dirLight.position.set(2, 6, 2);
          dirLight.castShadow = true;
          this.add(dirLight);

          const leftNeon = new THREE.PointLight(0x00f0ff, 2.2, 8);
          leftNeon.position.set(-2.2, 1.8, -1.8);
          this.add(leftNeon);

          const rightNeon = new THREE.PointLight(0xff0066, 2.2, 8);
          rightNeon.position.set(2.2, 1.8, -1.8);
          this.add(rightNeon);
        }

        buildEnvironment() {
          this.envGroup = new THREE.Group();
          this.envGroup.name = 'ArcadeEnvironment';
          this.envGroup.xb = {pointerEvents: 'none'};

          // Ground floor grid
          const grid = new THREE.GridHelper(30, 30, 0x00f5ff, 0x141e33);
          grid.position.y = -0.01;
          this.envGroup.add(grid);

          const floorMat = new THREE.MeshStandardMaterial({
            color: 0x080e1a,
            roughness: 0.6,
            metalness: 0.4,
          });
          const floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), floorMat);
          floor.rotation.x = -Math.PI / 2;
          floor.position.y = -0.02;
          floor.receiveShadow = true;
          this.envGroup.add(floor);

          // Atmospheric pillars framing the arena
          const pillarGeo = new THREE.CylinderGeometry(0.12, 0.14, 5.5, 18);
          const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x101726,
            metalness: 0.7,
            roughness: 0.25,
          });
          const pillarStops = [
            [-3.2, 2.7, -4.5, 0x00e5ff],
            [3.2, 2.7, -4.5, 0xff0077],
            [-4.2, 2.7, -2.5, 0x9900ff],
            [4.2, 2.7, -2.5, 0x00ff88],
          ];

          pillarStops.forEach(([x, y, z, col]) => {
            const p = new THREE.Mesh(pillarGeo, pillarMat);
            p.position.set(x, y, z);
            this.envGroup.add(p);

            const strip = new THREE.Mesh(
              new THREE.BoxGeometry(0.03, 5.2, 0.03),
              new THREE.MeshBasicMaterial({color: col})
            );
            strip.position.set(x + (x < 0 ? 0.12 : -0.12), y, z);
            this.envGroup.add(strip);
          });

          this.add(this.envGroup);
        }

        buildBallPit() {
          this.pitGroup = new THREE.Group();
          this.pitGroup.position.set(0, 0, -0.65);
          this.pitGroup.xb = {pointerEvents: 'none'};

          // Basin tub outer body
          const tubOuterGeo = new THREE.CylinderGeometry(0.56, 0.52, 0.5, 36, 1, true);
          const tubMat = new THREE.MeshStandardMaterial({
            color: 0x151f33,
            roughness: 0.35,
            metalness: 0.6,
            side: THREE.DoubleSide,
          });
          const tub = new THREE.Mesh(tubOuterGeo, tubMat);
          tub.position.y = 0.5;
          this.pitGroup.add(tub);

          // Glowing rim ring around top
          const rimGeo = new THREE.TorusGeometry(0.56, 0.03, 16, 48);
          rimGeo.rotateX(Math.PI / 2);
          const rimMat = new THREE.MeshBasicMaterial({color: 0x00f0ff});
          const rim = new THREE.Mesh(rimGeo, rimMat);
          rim.position.y = 0.75;
          this.pitGroup.add(rim);

          // Ball pit underglow light
          const pitLight = new THREE.PointLight(0x00d9ff, 1.8, 1.5);
          pitLight.position.set(0, 0.7, 0);
          this.pitGroup.add(pitLight);

          // Populate pit with vibrant bobbing spheres
          const sphereGeo = new THREE.SphereGeometry(0.048, 16, 16);
          const colors = [
            0xff3344, 0x00d5ff, 0xffb700, 0x00ff77, 0xaa00ff, 0xff0088,
          ];
          const ballMaterials = colors.map(
            (c) =>
              new THREE.MeshStandardMaterial({
                color: c,
                roughness: 0.25,
                metalness: 0.2,
                emissive: c,
                emissiveIntensity: 0.15,
              })
          );

          const pitBallCount = 48;
          for (let i = 0; i < pitBallCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * 0.44;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = 0.66 + (Math.random() - 0.5) * 0.08;

            const mat = ballMaterials[i % ballMaterials.length];
            const ballMesh = new THREE.Mesh(sphereGeo, mat);
            ballMesh.position.set(x, y, z);
            ballMesh.userData = {
              baseY: y,
              phase: Math.random() * Math.PI * 2,
              speed: 1.5 + Math.random() * 2.0,
            };
            this.pitGroup.add(ballMesh);
            this.pitBalls.push(ballMesh);
          }

          this.add(this.pitGroup);
        }

        buildFreeFlowingTargets() {
          // 4 distinct targets flowing along multi-dimensional continuous curves
          const flowConfigs = [
            {
              id: 0,
              name: 'Cyan Cruiser',
              scale: 0.95,
              baseCenter: new THREE.Vector3(0, 1.6, -2.5),
              freq: new THREE.Vector3(0.65, 0.9, 0.45),
              amp: new THREE.Vector3(1.4, 0.45, 0.6),
              phase: 0.0,
            },
            {
              id: 1,
              name: 'Magenta Sweeper',
              scale: 0.85,
              baseCenter: new THREE.Vector3(-0.6, 1.85, -3.2),
              freq: new THREE.Vector3(0.85, 1.2, 0.7),
              amp: new THREE.Vector3(1.2, 0.65, 0.8),
              phase: 1.8,
            },
            {
              id: 2,
              name: 'Solar Looper',
              scale: 0.9,
              baseCenter: new THREE.Vector3(0.7, 1.5, -3.0),
              freq: new THREE.Vector3(0.5, 0.8, 1.1),
              amp: new THREE.Vector3(1.6, 0.55, 0.7),
              phase: 3.5,
            },
            {
              id: 3,
              name: 'Acrobatic Ace',
              scale: 0.7,
              baseCenter: new THREE.Vector3(0, 2.1, -3.8),
              freq: new THREE.Vector3(1.1, 1.4, 0.9),
              amp: new THREE.Vector3(1.8, 0.7, 0.9),
              phase: 5.1,
            },
          ];

          flowConfigs.forEach((cfg) => {
            const target = this.createTargetMesh(cfg.scale, cfg.id);
            target.userData = {
              ...cfg,
              wobble: 0,
              wobbleVec: new THREE.Vector3(),
            };
            target.position.copy(cfg.baseCenter);
            this.add(target);
            this.targets.push(target);
          });
        }

        createTargetMesh(scaleFactor = 1.0, id = 0) {
          const group = new THREE.Group();
          group.name = `FreeFlowTarget_${id}`;

          // Outer Ring (25 pts)
          const outerGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.025, 36);
          outerGeo.rotateX(Math.PI / 2);
          const outerMat = new THREE.MeshStandardMaterial({
            color: id % 2 === 0 ? 0x0088ff : 0xaa00cc,
            roughness: 0.3,
            metalness: 0.3,
          });
          const outerMesh = new THREE.Mesh(outerGeo, outerMat);
          group.add(outerMesh);

          // Middle Ring (50 pts)
          const midGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.03, 36);
          midGeo.rotateX(Math.PI / 2);
          const midMat = new THREE.MeshStandardMaterial({
            color: 0xff3b30,
            roughness: 0.25,
            metalness: 0.2,
          });
          const midMesh = new THREE.Mesh(midGeo, midMat);
          midMesh.position.z = 0.005;
          group.add(midMesh);

          // Bullseye (100 pts)
          const bullGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.035, 36);
          bullGeo.rotateX(Math.PI / 2);
          const bullMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.2,
            metalness: 0.5,
            emissive: 0x553300,
            emissiveIntensity: 0.4,
          });
          const bullMesh = new THREE.Mesh(bullGeo, bullMat);
          bullMesh.position.z = 0.01;
          group.add(bullMesh);

          // Holographic glowing halo
          const haloGeo = new THREE.TorusGeometry(0.36, 0.012, 16, 48);
          const haloMat = new THREE.MeshBasicMaterial({
            color: id % 2 === 0 ? 0x00f0ff : 0xff00aa,
          });
          const halo = new THREE.Mesh(haloGeo, haloMat);
          group.add(halo);

          group.scale.setScalar(scaleFactor);
          return group;
        }

        buildNearSpatialUi() {
          // Large digital score counter
          this.scoreDisplay = new xb.UIText({
            text: 'SCORE: 0',
            style: {
              fontSize: 28,
              fontWeight: 'bold',
              color: '#00ffff',
              textAlign: 'center',
            },
          });

          this.timerDisplay = new xb.UIText({
            text: 'TIME: 60s',
            style: {
              fontSize: 20,
              fontWeight: 'bold',
              color: '#ffcc00',
              textAlign: 'center',
            },
          });

          this.streakDisplay = new xb.UIText({
            text: 'Ready to throw! Press START.',
            style: {
              fontSize: 16,
              opacity: 0.85,
              textAlign: 'center',
            },
          });

          this.startButton = new xb.UIButton({
            label: 'START GAME',
            icon: 'play_arrow',
            style: {
              width: '100%',
              height: 48,
              backgroundColor: '#00cc66',
              fontWeight: 'bold',
            },
            onClick: () => this.toggleGame(),
          });

          // Placed directly in front of player, mounted on the front rim of the ball pit
          this.controlPanel = new xb.UICard({
            size: {width: 0.46, height: 'auto'},
            manipulation: false,
            edge: false,
            style: {
              flexDirection: 'column',
              gap: 8,
              padding: 14,
              backgroundColor: 'rgba(9, 14, 26, 0.94)',
              borderColor: '#00d5ff',
              borderWidth: 2,
              borderRadius: 18,
            },
            children: [
              new xb.UIText({
                text: 'TARGET TOSS XR',
                style: {
                  fontSize: 18,
                  fontWeight: 'bold',
                  letterSpacing: 2,
                  color: '#ffffff',
                  textAlign: 'center',
                },
              }),
              this.scoreDisplay,
              this.timerDisplay,
              this.streakDisplay,
              this.startButton,
            ],
          });

          // Positioned within direct arm reach (z = -0.56m, chest-level) tilted up towards face
          this.controlPanel.position.set(0, 1.12, -0.56);
          this.controlPanel.rotation.x = -0.32;
          this.add(this.controlPanel);
        }

        toggleGame() {
          if (!this.isPlaying) {
            this.startGame();
          } else {
            this.stopGame();
          }
        }

        startGame() {
          this.isPlaying = true;
          this.score = 0;
          this.shotsFired = 0;
          this.shotsHit = 0;
          this.streak = 0;
          this.gameTimeRemaining = this.roundDuration;

          this.startButton.label = 'STOP GAME';
          this.startButton.icon = 'stop';
          this.startButton.style.backgroundColor = '#cc2244';

          this.sfx.playStart();
          this.updateUiTexts();
        }

        stopGame() {
          this.isPlaying = false;
          this.startButton.label = 'START GAME';
          this.startButton.icon = 'play_arrow';
          this.startButton.style.backgroundColor = '#00cc66';

          const acc =
            this.shotsFired > 0
              ? Math.round((this.shotsHit / this.shotsFired) * 100)
              : 0;
          this.streakDisplay.text = `Final: ${this.score} pts (${acc}% Acc)`;
        }

        buildParticlePool() {
          const count = 70;
          const geo = new THREE.SphereGeometry(0.02, 6, 6);
          for (let i = 0; i < count; i++) {
            const p = new THREE.Mesh(
              geo,
              new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
              })
            );
            p.visible = false;
            p.userData = {active: false, life: 0, vel: new THREE.Vector3()};
            this.add(p);
            this.particles.push(p);
          }
        }

        spawnSparks(pos, hexColor, count = 16) {
          let s = 0;
          for (const p of this.particles) {
            if (!p.userData.active) {
              p.visible = true;
              p.userData.active = true;
              p.userData.life = 1.0;
              p.position.copy(pos);
              p.material.color.set(hexColor);
              p.material.opacity = 1.0;
              p.userData.vel.set(
                (Math.random() - 0.5) * 4.5,
                (Math.random() - 0.2) * 4.0,
                (Math.random() - 0.5) * 4.5
              );
              s++;
              if (s >= count) break;
            }
          }
        }

        onSelectStart(event) {
          const now = performance.now();
          if (now - this.lastThrowTime < this.throwCooldownMs) return;
          this.lastThrowTime = now;

          // Auto-start round on first throw if stopped
          if (!this.isPlaying) {
            this.startGame();
          }

          const controller = event.source?.controller;
          let origin = new THREE.Vector3();
          let forward = new THREE.Vector3(0, 0, -1);

          if (controller) {
            controller.getWorldPosition(origin);
            forward.applyQuaternion(controller.quaternion).normalize();
            origin.addScaledVector(forward, 0.08);
          } else {
            // Desktop simulator fallback via camera
            xb.core.camera.getWorldPosition(origin);
            forward = new THREE.Vector3(0, 0, -1)
              .applyQuaternion(xb.core.camera.quaternion)
              .normalize();
            origin.addScaledVector(forward, 0.25);
            origin.y -= 0.12;
          }

          // Launch velocity with an arcade arc
          const speed = 13.2;
          const launchDir = forward.clone();
          launchDir.y += 0.09;
          launchDir.normalize();

          const velocity = launchDir.multiplyScalar(speed);
          this.createBall(origin, velocity);

          this.shotsFired++;
          this.sfx.playThrow();
          this.updateUiTexts();
        }

        createBall(position, velocity) {
          const radius = 0.065;
          const ballColors = [
            0xff2255, 0x00e1ff, 0xffbb00, 0x00ff88, 0xbb00ff, 0xff6600,
          ];
          const color = ballColors[this.shotsFired % ballColors.length];

          const ball = new THREE.Mesh(
            new THREE.SphereGeometry(radius, 22, 22),
            new THREE.MeshStandardMaterial({
              color,
              roughness: 0.2,
              metalness: 0.25,
              emissive: color,
              emissiveIntensity: 0.2,
            })
          );

          ball.position.copy(position);
          ball.userData = {
            velocity: velocity.clone(),
            radius,
            active: true,
            life: 0,
            maxLife: 3.5,
          };
          this.add(ball);
          this.balls.push(ball);
        }

        update(delta) {
          super.update?.(delta);
          const dt = Math.min(delta || 0.016, 0.05);
          const time = performance.now() * 0.001;

          // Timer countdown
          if (this.isPlaying) {
            this.gameTimeRemaining = Math.max(0, this.gameTimeRemaining - dt);
            if (this.gameTimeRemaining <= 0) {
              this.stopGame();
            }
            this.timerDisplay.text = `TIME: ${Math.ceil(this.gameTimeRemaining)}s`;
          }

          // Animate bobbing pit balls
          this.pitBalls.forEach((b) => {
            const data = b.userData;
            b.position.y =
              data.baseY + Math.sin(time * data.speed + data.phase) * 0.02;
          });

          this.updateFreeFlowingTargets(time, dt);
          this.updateBalls(dt);
          this.updateParticles(dt);
        }

        updateFreeFlowingTargets(time, dt) {
          this.targets.forEach((target) => {
            const d = target.userData;

            // Free-flowing parametric 3D space curves
            const t = time * 0.9 + d.phase;
            const x =
              d.baseCenter.x + Math.sin(t * d.freq.x) * d.amp.x;
            const y =
              d.baseCenter.y + Math.cos(t * d.freq.y) * d.amp.y;
            const z =
              d.baseCenter.z + Math.sin(t * d.freq.z) * d.amp.z;

            target.position.set(x, y, z);

            // Compute tangent velocity for natural banking and pitch
            const vx = Math.cos(t * d.freq.x) * d.amp.x * d.freq.x;
            const vy = -Math.sin(t * d.freq.y) * d.amp.y * d.freq.y;

            // Bank roll into turns, pitch along elevation changes
            target.rotation.z = -vx * 0.35;
            target.rotation.x = vy * 0.25;
            target.rotation.y = Math.sin(t * 0.5) * 0.2;

            // Wobble decay after being struck
            if (d.wobble > 0) {
              d.wobble = Math.max(0, d.wobble - dt * 4.0);
              const wobbleScale =
                1.0 + Math.sin(d.wobble * Math.PI * 4) * 0.28 * d.wobble;
              target.scale.setScalar(d.scale * wobbleScale);
            }
          });
        }

        updateBalls(dt) {
          for (let i = this.balls.length - 1; i >= 0; i--) {
            const ball = this.balls[i];
            const d = ball.userData;

            d.life += dt;
            if (!d.active || d.life > d.maxLife) {
              this.removeBall(ball, i);
              continue;
            }

            d.velocity.y += this.gravity * dt;
            ball.position.addScaledVector(d.velocity, dt);

            ball.rotation.x += d.velocity.z * dt * 2.5;
            ball.rotation.y += d.velocity.x * dt * 2.5;

            // Check collision with free-flowing targets
            let hitOccurred = false;
            for (const target of this.targets) {
              const targetRadius = 0.35 * target.userData.scale;
              const dist = ball.position.distanceTo(target.position);

              if (dist < targetRadius + d.radius) {
                const relativeHitDist = dist / target.userData.scale;
                let points = 25;
                let tier = 1;
                let sparkColor = 0x00d5ff;

                if (relativeHitDist <= 0.12) {
                  points = 100;
                  tier = 3;
                  sparkColor = 0xffd700;
                } else if (relativeHitDist <= 0.24) {
                  points = 50;
                  tier = 2;
                  sparkColor = 0xff2255;
                }

                this.onTargetHit(target, ball.position, points, tier, sparkColor);
                hitOccurred = true;
                break;
              }
            }

            if (hitOccurred) {
              this.removeBall(ball, i);
              continue;
            }

            // Floor drop
            if (ball.position.y < -0.15) {
              this.streak = 0;
              this.updateUiTexts();
              this.removeBall(ball, i);
            }
          }
        }

        onTargetHit(target, hitPos, basePoints, tier, color) {
          this.shotsHit++;
          this.streak++;
          if (this.streak > this.maxStreak) this.maxStreak = this.streak;

          const streakMult = Math.min(4, 1 + Math.floor((this.streak - 1) / 3));
          const earned = basePoints * streakMult;
          this.score += earned;
          if (this.score > this.highScore) this.highScore = this.score;

          target.userData.wobble = 1.0;
          this.spawnSparks(hitPos, color, tier === 3 ? 24 : 14);

          if (this.streak > 1 && this.streak % 3 === 0) {
            this.sfx.playStreak();
          } else {
            this.sfx.playHit(tier);
          }

          this.updateUiTexts();
        }

        removeBall(ball, index) {
          this.remove(ball);
          ball.geometry.dispose();
          ball.material.dispose();
          this.balls.splice(index, 1);
        }

        updateParticles(dt) {
          for (const p of this.particles) {
            if (!p.userData.active) continue;
            p.userData.life -= dt * 2.0;
            if (p.userData.life <= 0) {
              p.userData.active = false;
              p.visible = false;
              continue;
            }
            p.userData.vel.y -= 7.0 * dt;
            p.position.addScaledVector(p.userData.vel, dt);
            p.material.opacity = p.userData.life;
            p.scale.setScalar(Math.max(0.15, p.userData.life));
          }
        }

        updateUiTexts() {
          this.scoreDisplay.text = `SCORE: ${this.score}`;
          const streakMsg =
            this.streak > 1
              ? `🔥 ${this.streak}x STREAK! (x${Math.min(4, 1 + Math.floor((this.streak - 1) / 3))} Mult)`
              : `Hits: ${this.shotsHit}/${this.shotsFired}`;
          this.streakDisplay.text = streakMsg;
        }

        dispose() {
          for (let i = this.balls.length - 1; i >= 0; i--) {
            this.removeBall(this.balls[i], i);
          }
          this.particles.forEach((p) => {
            p.geometry.dispose();
            p.material.dispose();
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Ball Toss XR');
        options.setAppDescription(
          'Physical ball pit toss with arm-reach start controls and free-flowing 3D targets.'
        );
        options.reticles.enabled = true;
        options.enableHands();
        options.hands.visualization = true;

        xb.add(new BallThrowGame());
        xb.init(options);
      });
    </script>
  </body>
</html>
