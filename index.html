<html lang="en">

      content="width=device-width, initial-scale=1.0, user-scalable=no"

    <script>
      window.litDisableBundleWarning = true;

    <style>
      /* Responsive HUD & Status Bar */
      #hud-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 16, 28, 0.92);
        backdrop-filter: blur(14px);
        padding: 12px 24px;
        border-radius: 16px;
        border: 1px solid rgba(0, 240, 255, 0.35);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .hud-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hud-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #7997c0;
        font-weight: 700;
      }
      .hud-value {
        font-size: 22px;
        font-weight: 800;
        color: #00f0ff;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      }
      .hud-value.danger {
        color: #ff3344;
        text-shadow: 0 0 12px rgba(255, 51, 68, 0.8);
      }
      .hud-value.accent {
        color: #ffd000;
        text-shadow: 0 0 10px rgba(255, 208, 0, 0.6);
      }
      .hud-instruction {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(12, 19, 34, 0.9);
        padding: 8px 22px;
        border-radius: 20px;
        font-size: 14px;
        color: #a8eeff;
        border: 1px solid rgba(0, 240, 255, 0.3);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
      }
      .hud-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding-bottom: 18px;
      }
      .hud-btn {
        pointer-events: auto;
        cursor: pointer;
        outline: none;
        border: none;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 24px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
        transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      .hud-btn:active {
        transform: scale(0.95);
      }
      .btn-start {
        background: linear-gradient(135deg, #00e676, #00b0ff);
        color: #051421;
        font-size: 17px;
        padding: 16px 32px;
        border: 2px solid #ffffff;
        box-shadow: 0 0 24px rgba(0, 230, 118, 0.6);
      }
      .btn-start.running {
        background: linear-gradient(135deg, #ff1744, #ff9100);
        color: #ffffff;
        box-shadow: 0 0 24px rgba(255, 23, 68, 0.6);
      }
      .btn-action {
        background: rgba(22, 33, 56, 0.92);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #ffffff;
      }
      .btn-action:hover {
        background: rgba(36, 52, 88, 0.95);
      }
      @keyframes pulseAnimation {
        0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 230, 118, 0.6); }
        50% { transform: scale(1.05); box-shadow: 0 0 32px rgba(0, 230, 118, 0.95); }
      }
      .pulse-start {
        animation: pulseAnimation 1.6s infinite ease-in-out;
      }
    </style>

  <body>
    <!-- Persistent Dual Screen HUD for Immediate Access -->
    <div id="hud-overlay">
      <div class="hud-header">
        <div class="hud-stat">
          <span class="hud-label">Buzzes</span>
          <span id="hud-buzzes" class="hud-value danger">0</span>

        <div class="hud-stat">

        <div class="hud-stat">

      <div id="hud-instruction" class="hud-instruction">
        ⚡ Guide the ring loop across the wire from START to FINISH without touching!

      <div class="hud-footer">

        <button id="btn-snap" class="hud-btn btn-action">

    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class SoundSynthesizer {
        constructor() {
          this.ctx = null;
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playElectricBuzz() {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Low electric hum
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(110, now);
          osc1.frequency.linearRampToValueAtTime(80, now + 0.18);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.005, now + 0.2);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.2);

          // Harsh voltage spark noise
          const bufferSize = this.ctx.sampleRate * 0.12;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.4;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.35, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          noise.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
        }

        playStartClick() {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }

        playVictoryFanfare() {
          this.initContext();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.09;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.005, now + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
          });
        }
      }

      class WireLoopGame extends xb.Script {
        constructor() {
          super();
          this.sfx = new SoundSynthesizer();

          this.isPlaying = false;
          this.isFinished = false;
          this.gameStartTime = 0;
          this.elapsedTime = 0;
          this.buzzCount = 0;
          this.bestScore = null;
          this.wireProgress = 0;

          // Wire dimensions
          this.wireRadius = 0.012; // 1.2 cm wire
          this.loopRadius = 0.046; // Outer ring hole radius
          this.loopTubeRadius = 0.005; // Ring metal thickness
          this.loopSizes = [
            { name: 'Large (Easy)', radius: 0.058 },
            { name: 'Medium (Normal)', radius: 0.046 },
            { name: 'Small (Hard)', radius: 0.034 },
          ];
          this.loopSizeIndex = 1;

          // Collision state
          this.lastBuzzTime = 0;
          this.buzzCooldownMs = 320;
          this.isCurrentlyTouching = false;

          // Wand position & tracking
          this.wandPosition = new THREE.Vector3(-0.6, 1.35, -0.9);
          this.wandRotation = new THREE.Euler(0, 0, 0);
          this.inputMode = 'controller';
          this.pointerCoords = new THREE.Vector2();
          this.isDraggingWand = false;
          this.controllersBound = new WeakSet();

          // Particle sparks pool
          this.sparks = [];
        }

        init() {
          this.setupLighting();
          this.buildEnvironment();
          this.buildElectricWire();
          this.buildPlayerWand();
          this.buildSparkEffects();
          this.buildSpatialScoreCard();
          this.bindHtmlHud();
          this.setupInteractionHandlers();
          this.snapWandToStart();
        }

        setupLighting() {
          const hemiLight = new THREE.HemisphereLight(0x4466aa, 0x111624, 2.2);
          this.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
          dirLight.position.set(2, 6, 3);
          dirLight.castShadow = true;
          this.add(dirLight);

          // Atmospheric glowing blue and gold accent lights
          const bluePillarGlow = new THREE.PointLight(0x00f0ff, 2.4, 5);
          bluePillarGlow.position.set(-1.2, 1.5, -1.0);
          this.add(bluePillarGlow);

          const goldPillarGlow = new THREE.PointLight(0xffaa00, 2.4, 5);
          goldPillarGlow.position.set(1.2, 1.5, -1.0);
          this.add(goldPillarGlow);
        }

        buildEnvironment() {
          const env = new THREE.Group();
          env.name = 'LabWorkbenchEnvironment';
          env.xb = { pointerEvents: 'none' };

          // Player floor platform
          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(16, 16),
            new THREE.MeshStandardMaterial({
              color: 0x070b14,
              roughness: 0.85,
              metalness: 0.4,
            })
          );
          floor.rotation.x = -Math.PI / 2;
          floor.position.y = -0.01;
          env.add(floor);

          const grid = new THREE.GridHelper(16, 16, 0x00e5ff, 0x12243d);
          grid.position.y = 0;
          env.add(grid);

          // Heavy industrial electrical workbench table
          const tableGeo = new THREE.BoxGeometry(1.8, 0.85, 0.9);
          const tableMat = new THREE.MeshStandardMaterial({
            color: 0x111a2c,
            roughness: 0.35,
            metalness: 0.6,
          });
          const table = new THREE.Mesh(tableGeo, tableMat);
          table.position.set(0, 0.425, -0.9);
          env.add(table);

          // Table top protective rubber / copper mat
          const matGeo = new THREE.BoxGeometry(1.68, 0.02, 0.78);
          const matMat = new THREE.MeshStandardMaterial({
            color: 0x0a101b,
            roughness: 0.7,
            metalness: 0.2,
          });
          const tableMatMesh = new THREE.Mesh(matGeo, matMat);
          tableMatMesh.position.set(0, 0.86, -0.9);
          env.add(tableMatMesh);

          // High-voltage warning plate
          const signGeo = new THREE.BoxGeometry(0.35, 0.12, 0.02);
          const signMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            roughness: 0.3,
            metalness: 0.3,
          });
          const sign = new THREE.Mesh(signGeo, signMat);
          sign.position.set(0, 0.8, -0.44);
          env.add(sign);

          this.add(env);
        }

        buildElectricWire() {
          this.wireGroup = new THREE.Group();
          this.wireGroup.name = 'ElectricWireSystem';

          // Define 10 control points creating an exciting 3D twisting curve
          const curvePoints = [
            new THREE.Vector3(-0.65, 1.15, -0.9), // Start terminal
            new THREE.Vector3(-0.55, 1.38, -0.85),
            new THREE.Vector3(-0.38, 1.52, -0.95), // High hump
            new THREE.Vector3(-0.25, 1.25, -0.8), // Dip forward
            new THREE.Vector3(-0.12, 1.48, -0.75), // Loop crest
            new THREE.Vector3(0.02, 1.20, -0.85), // Center dip
            new THREE.Vector3(0.18, 1.55, -0.92), // Peak arch
            new THREE.Vector3(0.35, 1.28, -0.78), // Swoop forward
            new THREE.Vector3(0.50, 1.45, -0.88),
            new THREE.Vector3(0.65, 1.15, -0.9), // Finish terminal
          ];

          this.wireCurve = new THREE.CatmullRomCurve3(curvePoints, false, 'catmullrom', 0.5);

          // Sample dense curve points for millimeter-accurate distance checks
          this.sampledWirePoints = this.wireCurve.getSpacedPoints(180);

          // Tube mesh for the physical copper wire
          const tubeGeo = new THREE.TubeGeometry(this.wireCurve, 120, this.wireRadius, 16, false);
          this.wireMaterial = new THREE.MeshStandardMaterial({
            color: 0xff9933,
            metalness: 0.9,
            roughness: 0.2,
            emissive: 0x442200,
            emissiveIntensity: 0.4,
          });
          this.wireMesh = new THREE.Mesh(tubeGeo, this.wireMaterial);
          this.wireGroup.add(this.wireMesh);

          // High-voltage pulsating electric halo along the wire
          const glowGeo = new THREE.TubeGeometry(this.wireCurve, 120, this.wireRadius * 1.28, 12, false);
          this.wireGlowMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.15,
            wireframe: true,
          });
          this.wireGlowMesh = new THREE.Mesh(glowGeo, this.wireGlowMat);
          this.wireGroup.add(this.wireGlowMesh);

          // START & FINISH Terminal Pedestals
          const pedestalMat = new THREE.MeshStandardMaterial({
            color: 0x1e283d,
            roughness: 0.3,
            metalness: 0.8,
          });

          // Start Pedestal (Left)
          const startPost = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 0.35, 24), pedestalMat);
          startPost.position.set(-0.65, 1.0, -0.9);
          this.wireGroup.add(startPost);

          const startDisc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.07, 0.03, 24),
            new THREE.MeshStandardMaterial({ color: 0x00e676, emissive: 0x00bb55, emissiveIntensity: 0.5 })
          );
          startDisc.position.set(-0.65, 1.15, -0.9);
          this.wireGroup.add(startDisc);

          // Start Flag / Banner
          const startHalo = new THREE.Mesh(
            new THREE.TorusGeometry(0.09, 0.01, 16, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ff88 })
          );
          startHalo.position.set(-0.65, 1.15, -0.9);
          this.wireGroup.add(startHalo);

          // Finish Pedestal (Right)
          const finishPost = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 0.35, 24), pedestalMat);
          finishPost.position.set(0.65, 1.0, -0.9);
          this.wireGroup.add(finishPost);

          const finishDisc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.07, 0.03, 24),
            new THREE.MeshStandardMaterial({ color: 0xffbb00, emissive: 0xdd8800, emissiveIntensity: 0.5 })
          );
          finishDisc.position.set(0.65, 1.15, -0.9);
          this.wireGroup.add(finishDisc);

          const finishHalo = new THREE.Mesh(
            new THREE.TorusGeometry(0.09, 0.01, 16, 32),
            new THREE.MeshBasicMaterial({ color: 0xffbb00 })
          );
          finishHalo.position.set(0.65, 1.15, -0.9);
          this.wireGroup.add(finishHalo);

          this.add(this.wireGroup);
        }

        buildPlayerWand() {
          this.wandGroup = new THREE.Group();
          this.wandGroup.name = 'PlayerWand';
          this.wandGroup.xb = { pointerEvents: 'auto' };

          // Insulated Rubber Grip Handle
          const handleGeo = new THREE.CylinderGeometry(0.018, 0.02, 0.22, 20);
          const handleMat = new THREE.MeshStandardMaterial({
            color: 0x182436,
            roughness: 0.65,
            metalness: 0.2,
          });
          const handle = new THREE.Mesh(handleGeo, handleMat);
          handle.rotation.x = Math.PI / 2;
          handle.position.z = 0.14;
          this.wandGroup.add(handle);

          // Protective Ring Collar
          const collarGeo = new THREE.CylinderGeometry(0.026, 0.024, 0.025, 20);
          const collarMat = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0x0088cc,
            emissiveIntensity: 0.4,
          });
          const collar = new THREE.Mesh(collarGeo, collarMat);
          collar.rotation.x = Math.PI / 2;
          collar.position.z = 0.02;
          this.wandGroup.add(collar);

          // Stem connecting handle to ring
          const stemGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.05, 16);
          const metalMat = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            roughness: 0.2,
            metalness: 0.9,
          });
          const stem = new THREE.Mesh(stemGeo, metalMat);
          stem.position.y = this.loopRadius * 0.5;
          stem.position.z = 0.01;
          this.wandGroup.add(stem);

          // The Conductive Loop Ring (Toroidal rim)
          this.loopTorusGeo = new THREE.TorusGeometry(this.loopRadius, this.loopTubeRadius, 18, 48);
          this.loopMaterial = new THREE.MeshStandardMaterial({
            color: 0xddeeff,
            roughness: 0.15,
            metalness: 0.95,
            emissive: 0x004488,
            emissiveIntensity: 0.2,
          });
          this.loopMesh = new THREE.Mesh(this.loopTorusGeo, this.loopMaterial);
          this.wandGroup.add(this.loopMesh);

          // Warning halo on the wand
          this.wandStatusRing = new THREE.Mesh(
            new THREE.TorusGeometry(this.loopRadius * 1.15, 0.002, 12, 36),
            new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 })
          );
          this.wandGroup.add(this.wandStatusRing);

          this.add(this.wandGroup);
        }

        buildSparkEffects() {
          const sparkGeo = new THREE.SphereGeometry(0.008, 6, 6);
          for (let i = 0; i < 40; i++) {
            const p = new THREE.Mesh(
              sparkGeo,
              new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
            );
            p.visible = false;
            p.userData = { active: false, life: 0, vel: new THREE.Vector3() };
            this.add(p);
            this.sparks.push(p);
          }

          // Dynamic lightning arc line
          const lightningGeo = new THREE.BufferGeometry();
          const positions = new Float32Array(16 * 3);
          lightningGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          this.lightningLine = new THREE.Line(
            lightningGeo,
            new THREE.LineBasicMaterial({ color: 0x88ffff, linewidth: 2, transparent: true, opacity: 0 })
          );
          this.lightningLine.visible = false;
          this.add(this.lightningLine);
        }

        spawnElectricZap(contactPoint, normal) {
          // Play buzz sound
          this.sfx.playElectricBuzz();

          // Flash wire and loop red
          this.loopMaterial.color.setHex(0xff1122);
          this.loopMaterial.emissive.setHex(0xff0022);
          this.loopMaterial.emissiveIntensity = 1.0;
          this.wireMaterial.emissive.setHex(0xff2200);
          this.wireMaterial.emissiveIntensity = 1.2;

          // Emit sparks
          let s = 0;
          for (const spark of this.sparks) {
            if (!spark.userData.active) {
              spark.visible = true;
              spark.userData.active = true;
              spark.userData.life = 1.0;
              spark.position.copy(contactPoint);
              spark.material.color.set(Math.random() > 0.4 ? 0x00f0ff : 0xffea00);
              spark.material.opacity = 1.0;
              spark.userData.vel.set(
                (Math.random() - 0.5) * 2.5 + normal.x * 1.2,
                Math.random() * 2.2 + 0.4,
                (Math.random() - 0.5) * 2.5 + normal.z * 1.2
              );
              s++;
              if (s >= 18) break;
            }
          }

          // Generate jagged lightning arc
          this.lightningLine.visible = true;
          this.lightningLine.material.opacity = 1.0;
          const posAttr = this.lightningLine.geometry.attributes.position;
          const start = this.wandGroup.position;
          for (let i = 0; i < 16; i++) {
            const alpha = i / 15;
            const jitter = (Math.random() - 0.5) * 0.04;
            posAttr.setXYZ(
              i,
              start.x + (contactPoint.x - start.x) * alpha + jitter,
              start.y + (contactPoint.y - start.y) * alpha + jitter,
              start.z + (contactPoint.z - start.z) * alpha + jitter
            );
          }
          posAttr.needsUpdate = true;
        }

        buildSpatialScoreCard() {
          this.titleText3D = new xb.UIText({
            text: '⚡ WIRE LOOP CHALLENGE',
            style: {
              fontSize: 20,
              fontWeight: 'bold',
              color: '#00ffff',
              textAlign: 'center',
            },
          });

          this.statusText3D = new xb.UIText({
            text: 'Press START GAME to begin steady-hand test!',
            style: {
              fontSize: 14,
              color: '#90b4e0',
              textAlign: 'center',
            },
          });

          this.statsText3D = new xb.UIText({
            text: 'Buzzes: 0  |  Time: 0.0s  |  Progress: 0%',
            style: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#ffd000',
              textAlign: 'center',
            },
          });

          this.startBtn3D = new xb.UIButton({
            label: '▶ START GAME',
            icon: 'play_arrow',
            style: { width: '100%', height: 44, backgroundColor: '#00a855' },
            onClick: () => this.toggleGameSession(),
          });

          const snapBtn3D = new xb.UIButton({
            label: 'Snap to Start',
            icon: 'restart_alt',
            style: { flexGrow: 1, height: 40, backgroundColor: '#1c2840' },
            onClick: () => this.snapWandToStart(),
          });

          const loopSizeBtn3D = new xb.UIButton({
            label: 'Loop: Medium',
            icon: 'circle',
            style: { flexGrow: 1, height: 40, backgroundColor: '#1c2840' },
            onClick: () => this.cycleLoopSize(),
          });
          this.loopSizeBtn3D = loopSizeBtn3D;

          this.scoreCard = new xb.UICard({
            size: { width: 0.54, height: 'auto' },
            manipulation: true,
            edge: true,
            style: {
              flexDirection: 'column',
              gap: 10,
              padding: 18,
              backgroundColor: 'rgba(8, 14, 26, 0.95)',
              borderColor: '#00d5ff',
              borderWidth: 2,
              borderRadius: 20,
            },
            children: [
              this.titleText3D,
              this.statusText3D,
              this.statsText3D,
              this.startBtn3D,
              new xb.UIPanel({
                style: { width: '100%', flexDirection: 'row', gap: 8 },
                children: [snapBtn3D, loopSizeBtn3D],
              }),
            ],
          });

          // Placed at table left side, convenient eye height
          this.scoreCard.position.set(-0.7, 1.45, -0.85);
          this.scoreCard.rotation.y = 0.35;
          this.add(this.scoreCard);
        }

        bindHtmlHud() {
          this.hudBuzzes = document.getElementById('hud-buzzes');
          this.hudTime = document.getElementById('hud-time');
          this.hudProgress = document.getElementById('hud-progress');
          this.hudBest = document.getElementById('hud-best');
          this.hudInstruction = document.getElementById('hud-instruction');
          this.hudStartBtn = document.getElementById('btn-start');
          this.hudSnapBtn = document.getElementById('btn-snap');
          this.hudLoopBtn = document.getElementById('btn-loop-size');
          this.hudModeBtn = document.getElementById('btn-mode');

          if (this.hudStartBtn) {
            this.hudStartBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              this.toggleGameSession();
            });
          }

          if (this.hudSnapBtn) {
            this.hudSnapBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              this.snapWandToStart();
            });
          }

          if (this.hudLoopBtn) {
            this.hudLoopBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              this.cycleLoopSize();
            });
          }

          if (this.hudModeBtn) {
            this.hudModeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              this.toggleInputMode();
            });
          }
        }

        toggleGameSession() {
          this.sfx.playStartClick();
          if (!this.isPlaying) {
            // Start round
            this.isPlaying = true;
            this.isFinished = false;
            this.buzzCount = 0;
            this.wireProgress = 0;
            this.gameStartTime = performance.now();
            this.elapsedTime = 0;

            this.snapWandToStart();

            if (this.hudStartBtn) {
              this.hudStartBtn.textContent = '⏹ RESTART CHALLENGE';
              this.hudStartBtn.classList.remove('pulse-start');
              this.hudStartBtn.classList.add('running');
            }
            if (this.startBtn3D) {
              this.startBtn3D.label = '⏹ RESTART CHALLENGE';
              this.startBtn3D.style.backgroundColor = '#d32f2f';
            }
            if (this.statusText3D) {
              this.statusText3D.text = 'CHALLENGE ACTIVE: Move slowly along the wire!';
              this.statusText3D.style.color = '#00ff88';
            }
            if (this.hudInstruction) {
              this.hudInstruction.textContent = '🚨 Carefully guide the wand along the wire to the FINISH flag!';
            }
          } else {
            // Reset round
            this.isPlaying = false;
            this.isFinished = false;
            this.elapsedTime = 0;
            this.snapWandToStart();

            if (this.hudStartBtn) {
              this.hudStartBtn.textContent = '▶ START GAME';
              this.hudStartBtn.classList.add('pulse-start');
              this.hudStartBtn.classList.remove('running');
            }
            if (this.startBtn3D) {
              this.startBtn3D.label = '▶ START GAME';
              this.startBtn3D.style.backgroundColor = '#00a855';
            }
            if (this.statusText3D) {
              this.statusText3D.text = 'Challenge reset. Press START to try again!';
              this.statusText3D.style.color = '#90b4e0';
            }
          }
          this.updateUi();
        }

        snapWandToStart() {
          const startPt = this.sampledWirePoints[0];
          this.wandGroup.position.set(startPt.x, startPt.y, startPt.z);
          this.wandGroup.rotation.set(0, 0, 0);
          this.wireProgress = 0;
          this.updateUi();
        }

        cycleLoopSize() {
          this.loopSizeIndex = (this.loopSizeIndex + 1) % this.loopSizes.length;
          const current = this.loopSizes[this.loopSizeIndex];
          this.loopRadius = current.radius;

          // Rebuild wand geometry with new diameter
          this.loopTorusGeo.dispose();
          this.loopTorusGeo = new THREE.TorusGeometry(this.loopRadius, this.loopTubeRadius, 18, 48);
          this.loopMesh.geometry = this.loopTorusGeo;

          this.wandStatusRing.geometry.dispose();
          this.wandStatusRing.geometry = new THREE.TorusGeometry(this.loopRadius * 1.15, 0.002, 12, 36);

          if (this.hudLoopBtn) this.hudLoopBtn.textContent = `⭕ ${current.name}`;
          if (this.loopSizeBtn3D) this.loopSizeBtn3D.label = current.name.split(' ')[0];
        }

        toggleInputMode() {
          if (this.inputMode === 'controller') {
            this.inputMode = 'hands';
            if (this.hudModeBtn) this.hudModeBtn.textContent = '🖐 Hand Mode';
            xb.core.simulator?.setMode?.(xb.SimulatorMode.POSE);
          } else {
            this.inputMode = 'controller';
            if (this.hudModeBtn) this.hudModeBtn.textContent = '🎮 Controller Mode';
            xb.core.simulator?.setMode?.(xb.SimulatorMode.CONTROLLER);
          }
        }

        setupInteractionHandlers() {
          // Desktop pointer dragging wand in 3D
          window.addEventListener('pointerdown', (e) => {
            if (e.target && e.target.closest('#hud-overlay button')) return;
            this.isDraggingWand = true;
            this.updatePointerWand(e);
          });

          window.addEventListener('pointermove', (e) => {
            if (this.isDraggingWand) {
              this.updatePointerWand(e);
            }
          });

          window.addEventListener('pointerup', () => {
            this.isDraggingWand = false;
          });

          // Keyboard arrow / WASD nudge for desktop precision
          window.addEventListener('keydown', (e) => {
            const step = 0.012;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') this.wandGroup.position.y += step;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') this.wandGroup.position.y -= step;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.wandGroup.position.x -= step;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') this.wandGroup.position.x += step;
            if (e.code === 'KeyQ') this.wandGroup.position.z -= step;
            if (e.code === 'KeyE') this.wandGroup.position.z += step;
            if (e.code === 'Space') this.toggleGameSession();
          });
        }

        updatePointerWand(e) {
          const mouse = new THREE.Vector2(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, xb.core.camera);

          // Raycast onto the table wire plane (z ~ -0.85)
          const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0.85);
          const targetPoint = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(targetPlane, targetPoint)) {
            // Smoothly lerp wand toward cursor position
            this.wandGroup.position.x = THREE.MathUtils.lerp(this.wandGroup.position.x, targetPoint.x, 0.4);
            this.wandGroup.position.y = THREE.MathUtils.lerp(this.wandGroup.position.y, targetPoint.y, 0.4);
            this.wandGroup.position.z = THREE.MathUtils.lerp(this.wandGroup.position.z, targetPoint.z, 0.4);
          }
        }

        bindController(controller) {
          if (this.controllersBound.has(controller)) return;
          this.controllersBound.add(controller);

          // Wand position follows primary controller in XR
          controller.addEventListener('selectstart', () => {
            if (!this.isPlaying) this.toggleGameSession();
          });
        }

        update(delta) {
          super.update?.(delta);
          const dt = Math.min(delta || 0.016, 0.05);
          const now = performance.now();

          // Sync XR controller positions if available
          if (xb.core.input?.controllers && xb.core.input.controllers.length > 0) {
            const c0 = xb.core.input.controllers[0];
            this.bindController(c0);
            if (c0.visible && c0.position.lengthSq() > 0.01) {
              this.wandGroup.position.copy(c0.position);
              this.wandGroup.quaternion.copy(c0.quaternion);
            }
          }

          // Timer logic
          if (this.isPlaying && !this.isFinished) {
            this.elapsedTime = (now - this.gameStartTime) / 1000;
            this.checkCollision(now);
            this.checkProgressAndFinish();
            this.updateUi();
          }

          // Relax hit flash back to normal
          this.loopMaterial.emissiveIntensity = Math.max(0.2, this.loopMaterial.emissiveIntensity - dt * 2.8);
          this.wireMaterial.emissiveIntensity = Math.max(0.4, this.wireMaterial.emissiveIntensity - dt * 2.8);
          if (this.loopMaterial.emissiveIntensity <= 0.25) {
            this.loopMaterial.color.setHex(0xddeeff);
            this.loopMaterial.emissive.setHex(0x004488);
            this.wireMaterial.emissive.setHex(0x442200);
          }

          // Pulsate electric halo
          if (this.wireGlowMesh) {
            this.wireGlowMesh.material.opacity = 0.12 + Math.sin(now * 0.006) * 0.06;
          }

          this.updateParticles(dt);
        }

        checkCollision(now) {
          const wandPos = this.wandGroup.position;
          const loopNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(this.wandGroup.quaternion).normalize();

          // Find the closest point along the wire curve to the center of the ring
          let minDistanceToRingCenter = Infinity;
          let closestWireIndex = 0;
          let closestWirePoint = this.sampledWirePoints[0];

          for (let i = 0; i < this.sampledWirePoints.length; i++) {
            const pt = this.sampledWirePoints[i];
            const d = wandPos.distanceTo(pt);
            if (d < minDistanceToRingCenter) {
              minDistanceToRingCenter = d;
              closestWireIndex = i;
              closestWirePoint = pt;
            }
          }

          // Compute distance from closest wire point to the circular centerline of the torus loop:
          // Vector from ring center to wire point
          const v = new THREE.Vector3().subVectors(closestWirePoint, wandPos);
          // Component perpendicular to the ring plane:
          const vPerp = loopNormal.clone().multiplyScalar(v.dot(loopNormal));
          // Component in the ring plane:
          const vParallel = new THREE.Vector3().subVectors(v, vPerp);
          const distInPlane = vParallel.length();

          // Point on the ring centerline closest to the wire:
          const ringCenterlinePt = wandPos.clone();
          if (distInPlane > 0.0001) {
            ringCenterlinePt.add(vParallel.normalize().multiplyScalar(this.loopRadius));
          } else {
            ringCenterlinePt.add(new THREE.Vector3(this.loopRadius, 0, 0));
          }

          // Distance between wire centerline and ring centerline:
          const distanceToMetal = closestWirePoint.distanceTo(ringCenterlinePt);

          // Combined physical collision threshold:
          const collisionThreshold = this.wireRadius + this.loopTubeRadius;

          if (distanceToMetal < collisionThreshold) {
            // BUZZ! Touch detected!
            if (now - this.lastBuzzTime > this.buzzCooldownMs) {
              this.lastBuzzTime = now;
              this.buzzCount++;
              const normal = new THREE.Vector3().subVectors(ringCenterlinePt, closestWirePoint).normalize();
              this.spawnElectricZap(closestWirePoint, normal);

              if (this.hudInstruction) {
                this.hudInstruction.textContent = `⚡ BUZZ! Wire Contact! (Total: ${this.buzzCount})`;
              }
            }
          }
        }

        checkProgressAndFinish() {
          // Calculate how far along the wire the wand currently is
          const startPt = this.sampledWirePoints[0];
          const finishPt = this.sampledWirePoints[this.sampledWirePoints.length - 1];

          let closestIdx = 0;
          let minD = Infinity;
          for (let i = 0; i < this.sampledWirePoints.length; i++) {
            const d = this.wandGroup.position.distanceTo(this.sampledWirePoints[i]);
            if (d < minD) {
              minD = d;
              closestIdx = i;
            }
          }

          const rawPct = Math.round((closestIdx / (this.sampledWirePoints.length - 1)) * 100);
          this.wireProgress = Math.max(this.wireProgress, rawPct);

          // Check if reached finish pedestal (>95% progress and close to finish point)
          const distToFinish = this.wandGroup.position.distanceTo(finishPt);
          if (this.wireProgress >= 95 && distToFinish < 0.1) {
            this.onCourseCompleted();
          }
        }

        onCourseCompleted() {
          this.isFinished = true;
          this.isPlaying = false;
          this.sfx.playVictoryFanfare();

          const totalTime = this.elapsedTime.toFixed(1);
          let grade = 'S - Master of Steady Hands!';
          if (this.buzzCount > 4) grade = 'C - Needs Practice!';
          else if (this.buzzCount > 2) grade = 'B - Good Steady Hand!';
          else if (this.buzzCount > 0) grade = 'A - Excellent Precision!';

          if (!this.bestScore || this.buzzCount < this.bestScore.buzzes) {
            this.bestScore = { buzzes: this.buzzCount, time: totalTime };
          }

          if (this.statusText3D) {
            this.statusText3D.text = `🏆 FINISHED! Buzzes: ${this.buzzCount} in ${totalTime}s [Grade ${grade.charAt(0)}]`;
            this.statusText3D.style.color = '#ffd700';
          }
          if (this.hudInstruction) {
            this.hudInstruction.textContent = `🎉 COURSE COMPLETED! Grade: ${grade} (${this.buzzCount} Buzzes in ${totalTime}s)`;
          }
          if (this.hudStartBtn) {
            this.hudStartBtn.textContent = '▶ PLAY AGAIN';
            this.hudStartBtn.classList.remove('running');
            this.hudStartBtn.classList.add('pulse-start');
          }
          if (this.startBtn3D) {
            this.startBtn3D.label = '▶ PLAY AGAIN';
            this.startBtn3D.style.backgroundColor = '#00a855';
          }

          this.updateUi();
        }

        updateParticles(dt) {
          for (const p of this.sparks) {
            if (!p.userData.active) continue;
            p.userData.life -= dt * 2.8;
            if (p.userData.life <= 0) {
              p.userData.active = false;
              p.visible = false;
              continue;
            }
            p.userData.vel.y -= 7.5 * dt;
            p.position.addScaledVector(p.userData.vel, dt);
            p.material.opacity = p.userData.life;
            p.scale.setScalar(Math.max(0.1, p.userData.life));
          }

          if (this.lightningLine.visible) {
            this.lightningLine.material.opacity -= dt * 3.5;
            if (this.lightningLine.material.opacity <= 0) {
              this.lightningLine.visible = false;
            }
          }
        }

        updateUi() {
          const timeStr = `${this.elapsedTime.toFixed(1)}s`;

          // Screen HUD updates
          if (this.hudBuzzes) this.hudBuzzes.textContent = `${this.buzzCount}`;
          if (this.hudTime) this.hudTime.textContent = timeStr;
          if (this.hudProgress) this.hudProgress.textContent = `${this.wireProgress}%`;
          if (this.hudBest && this.bestScore) {
            this.hudBest.textContent = `${this.bestScore.buzzes} B / ${this.bestScore.time}s`;
          }

          // 3D Spatial UI updates
          if (this.statsText3D) {
            this.statsText3D.text = `Buzzes: ${this.buzzCount}  |  Time: ${timeStr}  |  Progress: ${this.wireProgress}%`;
          }
        }

        dispose() {
          this.wireMesh?.geometry.dispose();
          this.wireMaterial?.dispose();
          this.loopTorusGeo?.dispose();
          this.loopMaterial?.dispose();
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Electric Wire Loop Game');
        options.setAppDescription(
          'Guide the metallic ring wand along the twisting high-voltage wire from START to FINISH without touching the wire! Features exact Torus-to-Cylinder collision, electric spark physics, and spatial scoreboard.'
        );

        // Enable Hand Tracking & Visualization
        options.enableHands();
        options.hands.visualization = true;
        options.hands.visualizeJoints = true;
        options.hands.visualizeMeshes = true;
        options.enableGestures();

        // Enable Controller & Raycasting
        options.enableReticles();
        options.interaction.raycastMode = 'select';
        options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
        options.xrButton.showEnterSimulatorButton = true;

        xb.add(new WireLoopGame());
        xb.init(options);
      });
    </script>
  </body>
