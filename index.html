<!doctype html>
<html lang="en">
  <head>
    <title>Goalkeeper VR | XR Blocks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class GoaleeVR extends xb.Script {
        constructor() {
          super();
          this.score = 0;
          this.isPlaying = false;
          this.balls = [];
          this.spawnTimer = 0;
          this.spawnInterval = 2.0;
          
          this.ballGeometry = new THREE.IcosahedronGeometry(0.12, 2);
          this.ballMaterial = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3, metalness: 0.1 });
          this.indicatorMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        }

        init() {
          // Add lighting
          this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
          const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dirLight.position.set(0, 5, -2);
          this.add(dirLight);

          this.buildEnvironment();
          this.buildGoal();
          this.buildUI();
        }

        buildEnvironment() {
          // Grass pitch
          const pitchGeo = new THREE.PlaneGeometry(60, 60);
          const pitchMat = new THREE.MeshStandardMaterial({ color: 0x2d7a33, roughness: 0.9, metalness: 0.1 });
          const pitch = new THREE.Mesh(pitchGeo, pitchMat);
          pitch.rotation.x = -Math.PI / 2;
          pitch.position.y = -0.01; // Slightly below 0 to prevent z-fighting
          this.add(pitch);

          // Penalty spot (11 meters from goal line at z=0)
          const spotGeo = new THREE.CircleGeometry(0.15, 32);
          const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const penaltySpot = new THREE.Mesh(spotGeo, lineMat);
          penaltySpot.rotation.x = -Math.PI / 2;
          penaltySpot.position.set(0, 0, -11);
          this.add(penaltySpot);

          // Penalty box lines
          const lineGeo = new THREE.PlaneGeometry(12, 0.1);
          const boxFront = new THREE.Mesh(lineGeo, lineMat);
          boxFront.rotation.x = -Math.PI / 2;
          boxFront.position.set(0, 0, -16.5);
          this.add(boxFront);

          const sideLineGeo = new THREE.PlaneGeometry(0.1, 16.5);
          const boxLeft = new THREE.Mesh(sideLineGeo, lineMat);
          boxLeft.rotation.x = -Math.PI / 2;
          boxLeft.position.set(-6, 0, -8.25);
          this.add(boxLeft);

          const boxRight = new THREE.Mesh(sideLineGeo, lineMat);
          boxRight.rotation.x = -Math.PI / 2;
          boxRight.position.set(6, 0, -8.25);
          this.add(boxRight);
          
          const goalLineGeo = new THREE.PlaneGeometry(12, 0.1);
          const goalLine = new THREE.Mesh(goalLineGeo, lineMat);
          goalLine.rotation.x = -Math.PI / 2;
          goalLine.position.set(0, 0, 0);
          this.add(goalLine);
        }

        buildGoal() {
          this.goalGroup = new THREE.Group();
          
          const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
          const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.5, 16);
          
          const leftPost = new THREE.Mesh(postGeo, postMat);
          leftPost.position.set(-1.5, 1.25, 0);
          
          const rightPost = new THREE.Mesh(postGeo, postMat);
          rightPost.position.set(1.5, 1.25, 0);
          
          const crossGeo = new THREE.CylinderGeometry(0.06, 0.06, 3.12, 16);
          const crossbar = new THREE.Mesh(crossGeo, postMat);
          crossbar.rotation.z = Math.PI / 2;
          crossbar.position.set(0, 2.5, 0);

          // Indicator for hits/misses (flashes green/red)
          const indicatorGeo = new THREE.PlaneGeometry(5, 5);
          this.indicatorMesh = new THREE.Mesh(indicatorGeo, this.indicatorMaterial);
          this.indicatorMesh.position.set(0, 1.5, 1);
          this.indicatorMesh.xb = { pointerEvents: 'none', interactionEnabled: false };

          this.goalGroup.add(leftPost, rightPost, crossbar, this.indicatorMesh);
          this.add(this.goalGroup);
        }

        buildUI() {
          this.scoreText = new xb.UIText({
            text: 'Score: 0',
            style: { fontSize: 42, fontWeight: 'bold', textAlign: 'center' }
          });

          this.statusText = new xb.UIText({
            text: 'Block the penalty kicks!',
            style: { fontSize: 20, opacity: 0.8, textAlign: 'center' }
          });

          this.actionButton = new xb.UIButton({
            label: 'Start Game',
            icon: 'sports_soccer',
            style: { width: '100%', height: 60, fontSize: 24 },
            onClick: () => this.toggleGame()
          });

          this.uiCard = new xb.UICard({
            size: { width: 0.6, height: 'auto' },
            manipulation: true,
            style: {
              flexDirection: 'column',
              gap: 20,
              padding: 30,
              alignItems: 'center',
              backgroundColor: 'rgba(20, 30, 40, 0.85)'
            },
            children: [
              new xb.UIText({
                text: 'GOALKEEPER VR',
                style: { fontSize: 32, fontWeight: 'bold', color: '#66ccff' }
              }),
              this.scoreText,
              this.statusText,
              this.actionButton
            ]
          });

          // Place the UI directly in front of the user so it's easily visible
          // Moved slightly to the left so it doesn't block the view of the penalty spot
          this.uiCard.position.set(-1.0, 1.4, -1.2);
          this.add(this.uiCard);
        }

        toggleGame() {
          if (this.isPlaying) {
            this.stopGame();
          } else {
            this.startGame();
          }
        }

        startGame() {
          this.isPlaying = true;
          this.score = 0;
          this.spawnTimer = 0;
          this.spawnInterval = 2.0;
          this.updateScoreUI();
          this.statusText.text = 'Game active. Get ready!';
          this.actionButton.label = 'Stop Game';
          this.actionButton.icon = 'stop';
        }

        stopGame() {
          this.isPlaying = false;
          this.statusText.text = 'Game stopped.';
          this.actionButton.label = 'Start Game';
          this.actionButton.icon = 'sports_soccer';
          
          // Clear remaining balls
          this.balls.forEach(ball => this.remove(ball));
          this.balls = [];
        }

        spawnBall() {
          const ball = new THREE.Mesh(this.ballGeometry, this.ballMaterial);
          
          // Spawn position at the penalty spot (11 meters away, on the ground)
          const startX = 0;
          const startY = 0.12; // Radius of the ball so it sits on grass
          const startZ = -11;
          
          ball.position.set(startX, startY, startZ);
          
          // Target a random spot inside the goal area
          const targetX = (Math.random() - 0.5) * 2.8; // within the posts
          const targetY = Math.random() * 2.2 + 0.2; // below crossbar
          const targetZ = 0;
          
          // Calculate realistic physics for a penalty kick (parabolic trajectory)
          const flightTime = 0.6 + Math.random() * 0.5; // varies speed
          const gravity = 9.81;
          
          const vx = (targetX - startX) / flightTime;
          const vz = (targetZ - startZ) / flightTime;
          // Calculate initial Y velocity to hit the target height factoring in gravity
          const vy = (targetY - startY + 0.5 * gravity * flightTime * flightTime) / flightTime;
          
          ball.userData.velocity = new THREE.Vector3(vx, vy, vz);
          ball.userData.gravity = gravity;
          
          this.add(ball);
          this.balls.push(ball);
        }

        updateScoreUI() {
          this.scoreText.text = `Score: ${this.score}`;
        }

        flashIndicator(hexColor) {
          this.indicatorMaterial.color.setHex(hexColor);
          this.indicatorMaterial.opacity = 0.4;
        }

        update() {
          const delta = xb.getDeltaTime();
          
          // Fade out the indicator screen
          if (this.indicatorMaterial.opacity > 0) {
            this.indicatorMaterial.opacity = Math.max(0, this.indicatorMaterial.opacity - delta * 0.8);
          }

          if (!this.isPlaying) return;

          // Spawning logic
          this.spawnTimer += delta;
          if (this.spawnTimer >= this.spawnInterval) {
            this.spawnBall();
            this.spawnTimer = 0;
            // Gradually increase difficulty
            this.spawnInterval = Math.max(0.6, this.spawnInterval - 0.05);
          }

          // Ball movement and collision logic
          for (let i = this.balls.length - 1; i >= 0; i--) {
            const ball = this.balls[i];
            
            // Apply gravity to velocity
            ball.userData.velocity.y -= ball.userData.gravity * delta;
            
            // Move ball
            ball.position.addScaledVector(ball.userData.velocity, delta);

            // Ground bounce if it hits the grass
            if (ball.position.y < 0.12 && ball.userData.velocity.y < 0) {
              ball.position.y = 0.12;
              ball.userData.velocity.y *= -0.7; // Dampen the bounce
            }

            // Spin the ball for realism
            ball.rotation.x += delta * 5;
            ball.rotation.z += delta * 3;

            // Collision detection with hands/controllers
            let caught = false;
            for (const controller of xb.core.input.controllers) {
              // 0.3 meters radius is forgiving enough to simulate hand blocking easily
              if (ball.position.distanceTo(controller.position) < 0.3) {
                caught = true;
                break;
              }
            }

            if (caught) {
              this.score += 1;
              this.flashIndicator(0x00ff00); // Flash green
              this.removeBall(ball, i);
              this.updateScoreUI();
            } else if (ball.position.z > 0.5) {
              // Passed the goal line
              this.score -= 1;
              this.flashIndicator(0xff0000); // Flash red
              this.removeBall(ball, i);
              this.updateScoreUI();
            }
          }
        }

        removeBall(ball, index) {
          this.remove(ball);
          if (ball.geometry) ball.geometry.dispose();
          if (ball.material) ball.material.dispose();
          this.balls.splice(index, 1);
        }

        dispose() {
          this.stopGame();
          this.ballGeometry.dispose();
          this.ballMaterial.dispose();
          this.indicatorMaterial.dispose();
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const options = new xb.Options();
        options.setAppTitle('Goalkeeper VR');
        options.setAppDescription('Use your hands to catch the penalty balls before they enter the goal.');
        
        // Enable hands tracking for the ultimate blocking experience
        options.enableHands();
        options.hands.visualization = true;
        options.hands.visualizeMeshes = true;
        options.simulator.defaultMode = xb.SimulatorMode.POSE;
        
        xb.add(new GoaleeVR());
        await xb.init(options);
      });
    </script>
  </body>
</html>
