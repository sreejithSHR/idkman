      window.litDisableBundleWarning = true;

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",

    <script type="module">
import * as THREE from 'three';
import * as xb from 'xrblocks';

const CAN_RADIUS = 0.052;
const CAN_HEIGHT = 0.15;
const BALL_RADIUS = 0.048;
const TABLE_Y = 0.88;
const TABLE_Z = -1.95;
const GRAVITY = -9.2;
const INITIAL_BALLS = 5;

function createBaseballTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Base off-white leather background
  ctx.fillStyle = '#f6f3eb';
  ctx.fillRect(0, 0, 512, 256);

  // Red stitching curves
  ctx.strokeStyle = '#c62828';
  ctx.lineWidth = 5;

  ctx.beginPath();
  for (let x = 0; x < 512; x += 4) {
    const y1 = 128 + Math.sin((x / 512) * Math.PI * 2) * 52;
    if (x === 0) ctx.moveTo(x, y1);
    else ctx.lineTo(x, y1);
  }
  ctx.stroke();

  // Stitch tick marks
  ctx.lineWidth = 3;
  for (let x = 0; x < 512; x += 16) {
    const y = 128 + Math.sin((x / 512) * Math.PI * 2) * 52;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 8);
    ctx.lineTo(x + 4, y + 8);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

class ConfettiSystem extends THREE.Group {
  constructor(count = 80) {
    super();
    this.particles = [];
    const geom = new THREE.PlaneGeometry(0.026, 0.026);
    const colors = [0xff3b30, 0xffcc00, 0x34c759, 0x007aff, 0xff9500, 0xaf52de];

    for (let i = 0; i < count; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: colors[i % colors.length],
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.visible = false;
      this.add(mesh);
      this.particles.push({
        mesh,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3(),
        life: 0,
        maxLife: 0,
      });
    }
  }

  burst(origin) {
    for (const p of this.particles) {
      p.mesh.position.copy(origin);
      p.mesh.visible = true;
      p.vel.set(
        (Math.random() - 0.5) * 3.2,
        Math.random() * 2.8 + 1.2,
        (Math.random() - 0.5) * 2.4
      );
      p.rotVel.set(
        Math.random() * 12,
        Math.random() * 12,
        Math.random() * 12
      );
      p.life = 0;
      p.maxLife = 1.6 + Math.random() * 0.9;
    }
  }

  update(dt) {
    for (const p of this.particles) {
      if (!p.mesh.visible) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
        continue;
      }
      p.vel.y += GRAVITY * 0.45 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.rotation.x += p.rotVel.x * dt;
      p.mesh.rotation.y += p.rotVel.y * dt;
      p.mesh.scale.setScalar(Math.max(0.01, 1 - p.life / p.maxLife));
    }
  }
}

class CarnivalCan {
  constructor(initialPos, colorHex, points) {
    this.initialPos = initialPos.clone();
    this.points = points;
    this.isKnocked = false;

    this.pos = initialPos.clone();
    this.vel = new THREE.Vector3();
    this.rot = new THREE.Euler();
    this.angVel = new THREE.Vector3();

    // Visual Mesh Cylinder
    const canGeom = new THREE.CylinderGeometry(CAN_RADIUS, CAN_RADIUS, CAN_HEIGHT, 24);
    const canMat = new THREE.MeshStandardMaterial({
      color: colorHex,
      metalness: 0.68,
      roughness: 0.28,
    });
    this.mesh = new THREE.Mesh(canGeom, canMat);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;

    // Metallic rim collars
    const rimGeom = new THREE.TorusGeometry(CAN_RADIUS, 0.005, 8, 24);
    const rimMat = new THREE.MeshStandardMaterial({
      color: 0xeeeeee,
      metalness: 0.88,
      roughness: 0.2,
    });
    const topRim = new THREE.Mesh(rimGeom, rimMat);
    topRim.rotation.x = Math.PI / 2;
    topRim.position.y = CAN_HEIGHT / 2;
    const bottomRim = topRim.clone();
    bottomRim.position.y = -CAN_HEIGHT / 2;
    this.mesh.add(topRim, bottomRim);

    this.updateTransform();
  }

  reset() {
    this.pos.copy(this.initialPos);
    this.vel.set(0, 0, 0);
    this.rot.set(0, 0, 0);
    this.angVel.set(0, 0, 0);
    this.isKnocked = false;
    this.updateTransform();
  }

  updateTransform() {
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.copy(this.rot);
  }

  update(dt) {
    // Check if knocked over (tilted significantly or fallen below table plane)
    const tilt = Math.abs(Math.sin(this.rot.x)) + Math.abs(Math.sin(this.rot.z));
    const fellBelowTable = this.pos.y < this.initialPos.y - 0.06;
    if (!this.isKnocked && (tilt > 0.46 || fellBelowTable)) {
      this.isKnocked = true;
    }

    if (this.vel.lengthSq() > 0.0001 || this.angVel.lengthSq() > 0.0001 || this.pos.y > 0.05) {
      this.vel.y += GRAVITY * dt;
      this.pos.addScaledVector(this.vel, dt);

      this.rot.x += this.angVel.x * dt;
      this.rot.y += this.angVel.y * dt;
      this.rot.z += this.angVel.z * dt;

      // Collisions against counter table and floor
      const floorY = 0.08;
      const onTable =
        this.pos.z > TABLE_Z - 0.42 &&
        this.pos.z < TABLE_Z + 0.42 &&
        Math.abs(this.pos.x) < 0.78;

      const surfaceY = onTable && this.pos.y > TABLE_Y ? TABLE_Y + CAN_HEIGHT / 2 : floorY;

      if (this.pos.y < surfaceY) {
        this.pos.y = surfaceY;
        this.vel.y = -this.vel.y * 0.3;
        this.vel.x *= 0.76;
        this.vel.z *= 0.76;
        this.angVel.multiplyScalar(0.72);
      }

      // Air and rotation damping
      this.vel.multiplyScalar(0.984);
      this.angVel.multiplyScalar(0.96);

      this.updateTransform();
    }
  }
}

class CarnivalGameScene extends xb.Script {
  constructor() {
    super();
    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.cans = [];
    this.activeBalls = [];

    // Interactive grab velocity estimator
    this.isGrabbingBall = false;
    this.grabHandPositionHistory = [];
    this.pitchPower = 5.2;

    this.baseballTexture = createBaseballTexture();
  }

  init() {
    this.setupLighting();
    this.setupCarnivalBooth();
    this.setupCans();
    this.setupBallStand();
    this.setupSpatialUI();

    this.confetti = new ConfettiSystem(85);
    this.add(this.confetti);

    this.xb = { pointerEvents: 'auto' };
  }

  setupLighting() {
    const hemiLight = new THREE.HemisphereLight(0xfff5e6, 0x3e2723, 2.5);
    this.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffaf0, 2.8);
    dirLight.position.set(1.5, 4.0, 1.2);
    dirLight.castShadow = true;
    this.add(dirLight);

    // Festive lanterns
    const bulbLeft = new THREE.PointLight(0xffb74d, 1.9, 4.5);
    bulbLeft.position.set(-0.78, 2.05, TABLE_Z + 0.2);
    const bulbRight = new THREE.PointLight(0xffb74d, 1.9, 4.5);
    bulbRight.position.set(0.78, 2.05, TABLE_Z + 0.2);
    this.add(bulbLeft, bulbRight);
  }

  setupCarnivalBooth() {
    this.boothGroup = new THREE.Group();

    // Wood Counter Table
    const tableGeom = new THREE.BoxGeometry(1.65, 0.08, 0.85);
    const tableMat = new THREE.MeshStandardMaterial({
      color: 0x5d4037,
      roughness: 0.72,
      metalness: 0.1,
    });
    const table = new THREE.Mesh(tableGeom, tableMat);
    table.position.set(0, TABLE_Y, TABLE_Z);
    table.receiveShadow = true;
    this.boothGroup.add(table);

    // Table legs
    const legGeom = new THREE.CylinderGeometry(0.042, 0.042, TABLE_Y, 12);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.8 });
    const legOffsets = [
      [-0.72, TABLE_Y / 2, TABLE_Z - 0.32],
      [0.72, TABLE_Y / 2, TABLE_Z - 0.32],
      [-0.72, TABLE_Y / 2, TABLE_Z + 0.32],
      [0.72, TABLE_Y / 2, TABLE_Z + 0.32],
    ];
    for (const [lx, ly, lz] of legOffsets) {
      const leg = new THREE.Mesh(legGeom, legMat);
      leg.position.set(lx, ly, lz);
      this.boothGroup.add(leg);
    }

    // Carnival Booth Backdrop Wall
    const backWallGeom = new THREE.BoxGeometry(2.3, 2.3, 0.06);
    const backWallMat = new THREE.MeshStandardMaterial({
      color: 0x1a237e,
      roughness: 0.65,
    });
    const backWall = new THREE.Mesh(backWallGeom, backWallMat);
    backWall.position.set(0, 1.35, TABLE_Z - 0.44);
    this.boothGroup.add(backWall);

    // Striped Canopy Awning at the top
    const awningGroup = new THREE.Group();
    const stripeCount = 9;
    const stripeWidth = 2.3 / stripeCount;
    for (let i = 0; i < stripeCount; i++) {
      const stripeGeom = new THREE.BoxGeometry(stripeWidth, 0.04, 0.72);
      const isRed = i % 2 === 0;
      const stripeMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xd32f2f : 0xffffff,
        roughness: 0.45,
      });
      const stripe = new THREE.Mesh(stripeGeom, stripeMat);
      stripe.position.set(-1.15 + stripeWidth * (i + 0.5), 0, 0);
      awningGroup.add(stripe);
    }
    awningGroup.position.set(0, 2.4, TABLE_Z - 0.1);
    awningGroup.rotation.x = 0.25;
    this.boothGroup.add(awningGroup);

    // Brass Side Pillars
    const poleGeom = new THREE.CylinderGeometry(0.03, 0.03, 2.4, 16);
    const poleMat = new THREE.MeshStandardMaterial({
      color: 0xffb300,
      metalness: 0.8,
      roughness: 0.3,
    });
    const leftPole = new THREE.Mesh(poleGeom, poleMat);
    leftPole.position.set(-1.1, 1.2, TABLE_Z - 0.05);
    const rightPole = new THREE.Mesh(poleGeom, poleMat);
    rightPole.position.set(1.1, 1.2, TABLE_Z - 0.05);
    this.boothGroup.add(leftPole, rightPole);

    this.add(this.boothGroup);
  }

  setupCans() {
    // 6-can pyramid stack (3 bottom, 2 middle, 1 top)
    const pyramidCansConfig = [
      // Bottom row (3 cans) - 100 points each
      { x: -0.15, y: TABLE_Y + CAN_HEIGHT / 2 + 0.04, z: TABLE_Z, color: 0xe53935, pts: 100 },
      { x: 0.0,   y: TABLE_Y + CAN_HEIGHT / 2 + 0.04, z: TABLE_Z, color: 0x1e88e5, pts: 100 },
      { x: 0.15,  y: TABLE_Y + CAN_HEIGHT / 2 + 0.04, z: TABLE_Z, color: 0x43a047, pts: 100 },
      // Middle row (2 cans) - 200 points each
      { x: -0.075, y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.04, z: TABLE_Z, color: 0xfb8c00, pts: 200 },
      { x: 0.075,  y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.04, z: TABLE_Z, color: 0x8e24aa, pts: 200 },
      // Top row (1 can) - 500 points
      { x: 0.0,    y: TABLE_Y + CAN_HEIGHT * 2.5 + 0.04, z: TABLE_Z, color: 0xfdd835, pts: 500 },
    ];

    for (const cfg of pyramidCansConfig) {
      const can = new CarnivalCan(
        new THREE.Vector3(cfg.x, cfg.y, cfg.z),
        cfg.color,
        cfg.pts
      );
      this.cans.push(can);
      this.add(can.mesh);
    }
  }

  setupBallStand() {
    // Pedestal placed in front of player
    const standGeom = new THREE.CylinderGeometry(0.18, 0.22, 0.95, 24);
    const standMat = new THREE.MeshStandardMaterial({
      color: 0x37474f,
      roughness: 0.5,
      metalness: 0.3,
    });
    this.stand = new THREE.Mesh(standGeom, standMat);
    this.stand.position.set(0, 0.475, -0.75);
    this.add(this.stand);

    // Interactive baseball on pedestal
    const ballGeom = new THREE.SphereGeometry(BALL_RADIUS, 24, 24);
    const ballMat = new THREE.MeshStandardMaterial({
      map: this.baseballTexture,
      roughness: 0.4,
      metalness: 0.1,
    });
    this.interactiveBall = new THREE.Mesh(ballGeom, ballMat);
    this.interactiveBall.position.set(0, 0.95 + BALL_RADIUS + 0.02, -0.75);
    this.interactiveBall.name = 'Interactive Carnival Baseball';

    // Enable manipulation and direct pointer interactions
    this.interactiveBall.xb = {
      manipulation: true,
      pointerEvents: 'auto',
      reticleMode: 'auto',
    };

    this.interactiveBall.onObjectSelectStart = (event) => this.onBallGrabStart(event);
    this.interactiveBall.onObjectManipulate = (event) => this.onBallManipulate(event);
    this.interactiveBall.onObjectSelectEnd = (event) => this.onBallGrabEnd(event);
    this.interactiveBall.onObjectTouchStart = (event) => this.onBallGrabStart(event);
    this.interactiveBall.onObjectTouchEnd = (event) => this.onBallGrabEnd(event);

    this.add(this.interactiveBall);
  }

  onBallGrabStart(event) {
    if (this.ballsRemaining <= 0) return;
    this.isGrabbingBall = true;
    this.grabHandPositionHistory = [];
    event.stopPropagation();
  }

  onBallManipulate(event) {
    if (!this.isGrabbingBall) return;
    const currentPos = this.interactiveBall.position.clone();
    const now = performance.now();
    this.grabHandPositionHistory.push({ pos: currentPos, time: now });

    // Retain only last 120ms to measure release impulse
    while (
      this.grabHandPositionHistory.length > 2 &&
      now - this.grabHandPositionHistory[0].time > 120
    ) {
      this.grabHandPositionHistory.shift();
    }
  }

  onBallGrabEnd(event) {
    if (!this.isGrabbingBall) return;
    this.isGrabbingBall = false;

    let releaseVelocity = new THREE.Vector3(0, 1.2, -4.5);
    if (this.grabHandPositionHistory.length >= 2) {
      const first = this.grabHandPositionHistory[0];
      const last =
        this.grabHandPositionHistory[this.grabHandPositionHistory.length - 1];
      const dt = Math.max(0.016, (last.time - first.time) / 1000);
      const delta = last.pos.clone().sub(first.pos);
      releaseVelocity = delta.divideScalar(dt);

      releaseVelocity.multiplyScalar(1.4);
      if (releaseVelocity.length() < 1.5) {
        releaseVelocity.set(0, 1.2, -4.0);
      }
    }

    const spawnPos = this.interactiveBall.position.clone();
    this.launchBall(spawnPos, releaseVelocity);
    this.resetInteractiveBallPosition();
    event.stopPropagation();
  }

  resetInteractiveBallPosition() {
    this.interactiveBall.position.set(0, 0.95 + BALL_RADIUS + 0.02, -0.75);
    this.interactiveBall.rotation.set(0, 0, 0);
  }

  pitchTowardsCans(powerMultiplier = 1.0) {
    if (this.ballsRemaining <= 0) return;

    const target = new THREE.Vector3(
      (Math.random() - 0.5) * 0.16,
      TABLE_Y + CAN_HEIGHT + 0.06 + (Math.random() - 0.5) * 0.1,
      TABLE_Z
    );
    const startPos = new THREE.Vector3(0, 1.35, -0.6);

    const delta = target.clone().sub(startPos);
    const distance = delta.length();
    const speed = (this.pitchPower + Math.random() * 0.6) * powerMultiplier;
    const travelTime = distance / speed;

    const velocity = delta.divideScalar(travelTime);
    velocity.y += -0.5 * GRAVITY * travelTime;

    this.launchBall(startPos, velocity);
  }

  launchBall(startPos, velocity) {
    if (this.ballsRemaining <= 0) return;

    this.ballsRemaining--;
    this.updateUI();

    const geom = new THREE.SphereGeometry(BALL_RADIUS, 20, 20);
    const mat = new THREE.MeshStandardMaterial({
      map: this.baseballTexture,
      roughness: 0.4,
      metalness: 0.1,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.copy(startPos);
    mesh.castShadow = true;
    this.add(mesh);

    this.activeBalls.push({
      mesh,
      vel: velocity.clone(),
      spin: new THREE.Vector3(
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15
      ),
      aliveTime: 0,
    });
  }

  setupSpatialUI() {
    this.scoreText = new xb.UIText({
      text: 'SCORE: 0',
      style: {
        fontSize: 28,
        fontWeight: 'bold',
        color: '#ffeb3b',
        textAlign: 'center',
      },
    });

    this.ballsText = new xb.UIText({
      text: `BALLS: ${this.ballsRemaining}`,
      style: {
        fontSize: 22,
        fontWeight: 'bold',
        color: '#ffffff',
        textAlign: 'center',
      },
    });

    this.statusText = new xb.UIText({
      text: 'Pinch & throw the ball or press Pitch!',
      style: {
        fontSize: 16,
        color: '#cfd8dc',
        textAlign: 'center',
        lineHeight: 1.3,
      },
    });

    this.powerSlider = new xb.UISlider({
      ariaLabel: 'Pitch Power',
      min: 3,
      max: 9,
      step: 0.5,
      value: this.pitchPower,
      style: { width: '100%', height: 38 },
      onInput: (val) => {
        this.pitchPower = val;
      },
    });

    const pitchBtn = new xb.UIButton({
      label: 'Pitch Ball',
      icon: 'sports_baseball',
      style: { flexGrow: 1 },
      onClick: () => this.pitchTowardsCans(1.0),
    });

    const resetBtn = new xb.UIButton({
      label: 'Reset Cans',
      icon: 'restart_alt',
      style: { flexGrow: 1 },
      onClick: () => this.resetGame(),
    });

    this.uiCard = new xb.UICard({
      size: { width: 0.64, height: 'auto' },
      manipulation: true,
      edge: { scale: true },
      style: {
        flexDirection: 'column',
        gap: 14,
        padding: 18,
        backgroundColor: 'rgba(18, 24, 38, 0.88)',
      },
      children: [
        new xb.UIText({
          text: '🎪 CARNIVAL TOSS',
          style: {
            fontSize: 32,
            fontWeight: 'bold',
            textAlign: 'center',
            color: '#ff5252',
          },
        }),
        this.scoreText,
        this.ballsText,
        this.statusText,
        new xb.UIPanel({
          style: {
            width: '100%',
            flexDirection: 'row',
            justifyContent: 'space-between',
            alignItems: 'center',
            marginTop: 4,
          },
          children: [
            new xb.UIText({ text: 'Pitch Power', style: { fontSize: 16 } }),
          ],
        }),
        this.powerSlider,
        new xb.UIPanel({
          style: { width: '100%', flexDirection: 'row', gap: 10 },
          children: [pitchBtn, resetBtn],
        }),
      ],
    });

    this.uiCard.position.set(-0.85, 1.45, -1.25);
    this.uiCard.rotation.y = 0.32;
    this.add(this.uiCard);
  }

  updateUI() {
    this.scoreText.text = `SCORE: ${this.score}`;
    this.ballsText.text = `BALLS: ${this.ballsRemaining}`;

    if (this.knockedCount === this.cans.length) {
      this.statusText.text = '🎉 STRIKE! PERFECT ROUND! +500 BONUS!';
      this.statusText.style.color = '#00e676';
    } else if (this.ballsRemaining <= 0) {
      this.statusText.text = 'Out of balls! Hit Reset Cans to try again!';
      this.statusText.style.color = '#ff9100';
    } else {
      this.statusText.text = `${this.knockedCount}/6 cans knocked down!`;
      this.statusText.style.color = '#cfd8dc';
    }
  }

  resetGame() {
    for (const can of this.cans) {
      can.reset();
    }
    for (const b of this.activeBalls) {
      this.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
    this.activeBalls = [];
    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.resetInteractiveBallPosition();
    this.updateUI();
  }

  update(dt = 0.016) {
    super.update(dt);
    this.confetti.update(dt);

    // Update cans simulation
    let newlyKnocked = 0;
    for (const can of this.cans) {
      const wasKnocked = can.isKnocked;
      can.update(dt);
      if (!wasKnocked && can.isKnocked) {
        newlyKnocked++;
        this.score += can.points;
      }
    }

    if (newlyKnocked > 0) {
      this.knockedCount += newlyKnocked;
      this.updateUI();

      if (this.knockedCount === this.cans.length) {
        this.score += 500;
        this.confetti.burst(new THREE.Vector3(0, TABLE_Y + 0.4, TABLE_Z));
        this.updateUI();
      }
    }

    // Update thrown baseballs
    for (let i = this.activeBalls.length - 1; i >= 0; i--) {
      const ball = this.activeBalls[i];
      ball.aliveTime += dt;

      ball.vel.y += GRAVITY * dt;
      ball.mesh.position.addScaledVector(ball.vel, dt);
      ball.mesh.rotation.x += ball.spin.x * dt;
      ball.mesh.rotation.y += ball.spin.y * dt;

      // Ball & can cylinder collision
      for (const can of this.cans) {
        const diff = ball.mesh.position.clone().sub(can.pos);
        const horizDist = Math.hypot(diff.x, diff.z);
        const vertDist = Math.abs(diff.y);

        if (horizDist < CAN_RADIUS + BALL_RADIUS && vertDist < CAN_HEIGHT / 2 + BALL_RADIUS) {
          const normal = diff.normalize();
          const impactSpeed = ball.vel.length();

          const impulse = normal.clone().multiplyScalar(impactSpeed * 0.72);
          can.vel.add(impulse);
          can.angVel.add(
            new THREE.Vector3(
              (Math.random() - 0.5) * 8,
              (Math.random() - 0.5) * 8,
              (Math.random() - 0.5) * 8
            )
          );

          ball.vel.reflect(normal).multiplyScalar(0.4);
          ball.vel.add(new THREE.Vector3((Math.random() - 0.5) * 0.5, 0.4, 0));
        }
      }

      // Backboard collision
      if (ball.mesh.position.z < TABLE_Z - 0.38) {
        ball.mesh.position.z = TABLE_Z - 0.38;
        ball.vel.z = -ball.vel.z * 0.45;
      }

      // Floor bounce
      if (ball.mesh.position.y < 0.06) {
        ball.mesh.position.y = 0.06;
        ball.vel.y = -ball.vel.y * 0.35;
        ball.vel.x *= 0.8;
        ball.vel.z *= 0.8;
      }

      // Despawn old balls after 4.5 seconds
      if (ball.aliveTime > 4.5) {
        this.remove(ball.mesh);
        ball.mesh.geometry.dispose();
        ball.mesh.material.dispose();
        this.activeBalls.splice(i, 1);
      }
    }
  }

  dispose() {
    this.baseballTexture.dispose();
    this.interactiveBall.geometry.dispose();
    this.interactiveBall.material.dispose();
    for (const can of this.cans) {
      can.mesh.geometry.dispose();
      can.mesh.material.dispose();
    }
    for (const b of this.activeBalls) {
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const options = new xb.Options();
  options.setAppTitle('Carnival Can Toss');
  options.setAppDescription(
    'Knock down the stacked cans with interactive baseballs.'
  );
  options.enableHands();
  options.enableReticles();
  options.hands.visualization = true;
  options.reticles.enabled = true;

  xb.add(new CarnivalGameScene());
  xb.init(options);
});
    </script>
