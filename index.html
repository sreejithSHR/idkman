  <body>
    <script type="module">
import RAPIER from '@dimforge/rapier3d-simd-compat';
import * as THREE from 'three';
import * as xb from 'xrblocks';

// Game Configuration Constants
const NUM_BALLS = 8;
const BALLS_PER_ROUND = 10;
const BALL_RADIUS = 0.052;
const MAX_THROW_SPEED = 12.0;       // Max velocity cap (m/s) to prevent tracking spikes
const MIN_HIT_SPEED = 1.8;          // Minimum velocity (m/s) required for a qualifying hit
const CRAB_TRACK_Z = -2.85;         // Target track distance
const CRAB_TRACK_Y = 1.30;          // Height of crab track
const CRAB_RANGE_X = 1.35;          // Scuttle horizontal reach (-X to +X)
const CRAB_BASE_SPEED = 1.3;        // Movement speed
const PIT_POS = new THREE.Vector3(0.24, 0.72, -0.62); // Arm's reach ball pit location
const PIT_WIDTH = 0.60;
const PIT_DEPTH = 0.44;
const PIT_WALL_HEIGHT = 0.16;

// Reusable scratch vectors to avoid per-frame allocations
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _rayOrigin = new THREE.Vector3();
const _rayDir = new THREE.Vector3();

class CarnivalAudioManager {
  constructor() {
    this.ctx = null;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playGrab() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(560, this.ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    } catch (_) {}
  }

  playWhoosh(speed = 5.0) {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      const startFreq = 260 + Math.min(speed * 35, 300);
      osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    } catch (_) {}
  }

  playCrabHit() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      // Dual-tone celebratory bell pop
      [784, 1046.5].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.04);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime + i * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.04 + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + i * 0.04);
        osc.stop(this.ctx.currentTime + i * 0.04 + 0.3);
      });
    } catch (_) {}
  }

  playMissThud() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(130, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    } catch (_) {}
  }
}

class SparkParticleGroup extends THREE.Group {
  constructor(count = 28) {
    super();
    this.particles = [];
    const geom = new THREE.SphereGeometry(0.016, 6, 6);
    const colors = [0xffd700, 0xff5722, 0xffeb3b, 0xff1744];

    for (let i = 0; i < count; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: colors[i % colors.length],
        transparent: true,
        opacity: 0,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.visible = false;
      this.add(mesh);
      this.particles.push({
        mesh,
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 0.5,
      });
    }
  }

  burst(origin) {
    for (const p of this.particles) {
      p.mesh.position.copy(origin);
      p.mesh.visible = true;
      p.mesh.material.opacity = 1.0;
      p.vel.set(
        (Math.random() - 0.5) * 4.2,
        Math.random() * 2.8 + 0.8,
        (Math.random() - 0.5) * 3.5
      );
      p.life = 0;
      p.maxLife = 0.35 + Math.random() * 0.3;
    }
  }

  update(dt) {
    for (const p of this.particles) {
      if (!p.mesh.visible) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
        continue;
      }
      p.vel.y -= 7.0 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      const ratio = 1 - p.life / p.maxLife;
      p.mesh.scale.setScalar(Math.max(0.01, ratio));
      p.mesh.material.opacity = ratio;
    }
  }
}

class TossBallScript extends xb.Script {
  constructor(ballIndex, manager) {
    super();
    this.ballIndex = ballIndex;
    this.manager = manager;

    // Visual Mesh & Materials
    const geom = new THREE.SphereGeometry(BALL_RADIUS, 24, 20);
    this.normalMaterial = new THREE.MeshStandardMaterial({
      color: 0xef4444,
      roughness: 0.35,
      metalness: 0.1,
    });
    this.grabbedMaterial = new THREE.MeshStandardMaterial({
      color: 0xffaa00,
      emissive: 0xff4400,
      emissiveIntensity: 0.45,
      roughness: 0.25,
    });
    this.mesh = new THREE.Mesh(geom, this.normalMaterial);
    this.mesh.castShadow = true;
    this.add(this.mesh);

    // Interaction flags for XR Blocks
    this.xb = {
      pointerEvents: 'auto',
      reticleMode: 'auto',
      manipulation: true,
    };

    // Physics reference
    this.rigidBody = null;
    this.collider = null;

    // Grab State & 5-Frame Circular Ring Buffer
    this.isGrabbed = false;
    this.grabSource = null; // Controller or camera/mouse pointer
    this.ringBuffer = [];   // Stores { pos: THREE.Vector3, time: number }
    this.lastThrowTime = 0;
  }

  initPhysics({ RAPIER, blendedWorld }) {
    this.RAPIER = RAPIER;
    this.blendedWorld = blendedWorld;

    // Spawn ball inside the ball pit
    const spawnPos = this.getPitSpawnPosition();
    this.mesh.position.copy(spawnPos);

    const rbDesc = RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(spawnPos.x, spawnPos.y, spawnPos.z)
      .setLinearDamping(0.35)
      .setAngularDamping(0.4)
      .setCcdEnabled(true);

    this.rigidBody = blendedWorld.createRigidBody(rbDesc);

    const colDesc = RAPIER.ColliderDesc.ball(BALL_RADIUS)
      .setRestitution(0.45)
      .setFriction(0.6)
      .setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS);

    this.collider = blendedWorld.createCollider(colDesc, this.rigidBody);
  }

  getPitSpawnPosition() {
    const col = this.ballIndex % 4;
    const row = Math.floor(this.ballIndex / 4);
    const offsetX = (col - 1.5) * (BALL_RADIUS * 2.2);
    const offsetZ = (row - 0.5) * (BALL_RADIUS * 2.2);
    return new THREE.Vector3(
      PIT_POS.x + offsetX,
      PIT_POS.y + 0.08,
      PIT_POS.z + offsetZ
    );
  }

  respawnInPit() {
    if (!this.rigidBody) return;
    const pos = this.getPitSpawnPosition();
    this.rigidBody.setBodyType(this.RAPIER.RigidBodyType.Dynamic, true);
    this.rigidBody.setTranslation({ x: pos.x, y: pos.y, z: pos.z }, true);
    this.rigidBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
    this.rigidBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
    this.mesh.position.copy(pos);
    this.isGrabbed = false;
    this.mesh.material = this.normalMaterial;
  }

  // --- Grab Lifecycle Integration ---
  onObjectGrabStart(event) {
    if (this.manager.gameState !== 'PLAYING') return true;
    if (this.isGrabbed) return true;

    this.isGrabbed = true;
    this.grabSource = event.source?.controller || event.source || null;

    // Switch Rapier body to kinematicPositionBased so physics obeys the hand
    this.rigidBody.setBodyType(this.RAPIER.RigidBodyType.KinematicPositionBased, true);
    this.mesh.material = this.grabbedMaterial;

    // Initialize 5-frame ring buffer
    const now = performance.now();
    this.ringBuffer = [
      { pos: this.mesh.position.clone(), time: now }
    ];

    this.manager.audio.playGrab();
    event.stopPropagation?.();
    return true;
  }

  onObjectGrabbing(event) {
    if (!this.isGrabbed || !this.rigidBody) return true;

    const controller = event.source?.controller || this.grabSource;
    if (controller && controller.position) {
      _v1.copy(controller.position);
    } else {
      // Fallback: mouse/camera raycast plane
      const cam = xb.core.camera;
      if (cam) {
        _v1.copy(cam.position).addScaledVector(cam.getWorldDirection(_v2), 0.55);
      }
    }

    // Kinematic synchronization with Rapier
    this.rigidBody.setNextKinematicTranslation({ x: _v1.x, y: _v1.y, z: _v1.z });
    this.mesh.position.copy(_v1);

    // Record to Ring Buffer (keep max 5 samples within ~0.15s window)
    const now = performance.now();
    this.ringBuffer.push({ pos: _v1.clone(), time: now });
    while (this.ringBuffer.length > 5 || (this.ringBuffer.length > 2 && now - this.ringBuffer[0].time > 150)) {
      this.ringBuffer.shift();
    }

    event.stopPropagation?.();
    return true;
  }

  onObjectGrabEnd(event) {
    if (!this.isGrabbed || !this.rigidBody) return true;
    this.isGrabbed = false;
    this.mesh.material = this.normalMaterial;

    // 3. THROW / RELEASE PHYSICS
    _v1.set(0, 1.8, -4.5); // Fallback velocity

    if (this.ringBuffer.length >= 2) {
      const oldest = this.ringBuffer[0];
      const newest = this.ringBuffer[this.ringBuffer.length - 1];
      const dt = (newest.time - oldest.time) / 1000.0;

      if (dt > 0.008) {
        _v1.copy(newest.pos).sub(oldest.pos).divideScalar(dt);
        // Boost forward impulse slightly for throwing comfort
        _v1.multiplyScalar(1.2);

        // Clamp to MAX_THROW_SPEED to avoid tracking spikes
        const currentSpeed = _v1.length();
        if (currentSpeed > MAX_THROW_SPEED) {
          _v1.multiplyScalar(MAX_THROW_SPEED / currentSpeed);
        }

        // Ensure realistic forward toss trajectory if pitched forward
        if (_v1.z >= -0.5) {
          _v1.z = -Math.max(2.8, Math.hypot(_v1.x, _v1.y) * 0.9);
        }
      }
    }

    // Switch body back to dynamic and apply computed launch velocity directly
    this.rigidBody.setBodyType(this.RAPIER.RigidBodyType.Dynamic, true);
    this.rigidBody.setLinvel({ x: _v1.x, y: _v1.y, z: _v1.z }, true);

    this.lastThrowTime = performance.now();
    this.manager.onBallThrown(this, _v1);
    this.ringBuffer = [];

    event.stopPropagation?.();
    return true;
  }

  // Support direct select/pinch for desktop preview simulator
  onObjectSelectStart(event) {
    return this.onObjectGrabStart(event);
  }

  onObjectSelectEnd(event) {
    return this.onObjectGrabEnd(event);
  }

  physicsStep() {
    if (!this.rigidBody) return;

    if (!this.isGrabbed) {
      const t = this.rigidBody.translation();
      const r = this.rigidBody.rotation();
      this.mesh.position.set(t.x, t.y, t.z);
      this.mesh.quaternion.set(r.x, r.y, r.z, r.w);

      // Check for balls that fell out of bounds or idle too long away from pit
      if (t.y < -0.6 || (performance.now() - this.lastThrowTime > 8500 && this.lastThrowTime > 0)) {
        this.respawnInPit();
      }
    }
  }

  dispose() {
    this.mesh.geometry.dispose();
    this.normalMaterial.dispose();
    this.grabbedMaterial.dispose();
    if (this.rigidBody && this.blendedWorld) {
      this.blendedWorld.removeRigidBody(this.rigidBody);
    }
  }
}

class CrabTarget extends THREE.Group {
  constructor() {
    super();
    this.buildCrabMesh();
    this.resetState();
  }

  buildCrabMesh() {
    this.crabContainer = new THREE.Group();
    this.add(this.crabContainer);

    // Carapace shell
    const bodyGeom = new THREE.CylinderGeometry(0.18, 0.22, 0.09, 16);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0xe11d48,
      roughness: 0.35,
      metalness: 0.15,
    });
    this.bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
    this.bodyMesh.castShadow = true;
    this.crabContainer.add(this.bodyMesh);

    // Eyes
    const eyeGeom = new THREE.SphereGeometry(0.032, 12, 12);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

    [-0.08, 0.08].forEach((x) => {
      const eye = new THREE.Mesh(eyeGeom, eyeMat);
      eye.position.set(x, 0.065, 0.16);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), pupilMat);
      pupil.position.set(0, 0, 0.024);
      eye.add(pupil);
      this.crabContainer.add(eye);
    });

    // Pincers / Claws
    const clawGeom = new THREE.BoxGeometry(0.12, 0.06, 0.15);
    const clawMat = new THREE.MeshStandardMaterial({ color: 0xbe123c, roughness: 0.4 });
    this.leftClaw = new THREE.Mesh(clawGeom, clawMat);
    this.leftClaw.position.set(-0.25, 0.02, 0.14);
    this.leftClaw.rotation.y = 0.35;
    this.rightClaw = new THREE.Mesh(clawGeom, clawMat);
    this.rightClaw.position.set(0.25, 0.02, 0.14);
    this.rightClaw.rotation.y = -0.35;
    this.crabContainer.add(this.leftClaw, this.rightClaw);

    // Walking legs
    this.legs = [];
    const legGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.12, 8);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x9f1239 });

    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const leg = new THREE.Mesh(legGeom, legMat);
        leg.position.set(side * (0.16 + i * 0.03), -0.04, -0.06 + i * 0.07);
        leg.rotation.z = side * (0.7 + i * 0.1);
        this.crabContainer.add(leg);
        this.legs.push({ mesh: leg, baseRotZ: leg.rotation.z, phase: i * 0.8 + (side > 0 ? Math.PI : 0) });
      }
    }
  }

  resetState() {
    this.isHit = false;
    this.isRespawning = false;
    this.crabContainer.rotation.set(0, 0, 0);
    this.crabContainer.scale.set(1, 1, 1);
    this.crabContainer.visible = true;
    this.trackPositionX = (Math.random() - 0.5) * CRAB_RANGE_X;
    this.direction = Math.random() > 0.5 ? 1 : -1;
    this.speed = CRAB_BASE_SPEED;
    this.updatePosition();
  }

  updatePosition() {
    this.position.set(this.trackPositionX, CRAB_TRACK_Y, CRAB_TRACK_Z);
  }

  update(dt, timeSec) {
    if (this.isHit) {
      // Knockdown tip-over & shrink animation
      if (this.crabContainer.rotation.x > -Math.PI / 2) {
        this.crabContainer.rotation.x -= 7.5 * dt;
        this.crabContainer.position.y += 0.4 * dt;
        this.crabContainer.scale.multiplyScalar(Math.max(0.01, 1 - 2.8 * dt));
      }
      return;
    }

    // Scuttle movement side-to-side along track
    this.trackPositionX += this.direction * this.speed * dt;
    if (this.trackPositionX > CRAB_RANGE_X) {
      this.trackPositionX = CRAB_RANGE_X;
      this.direction = -1;
    } else if (this.trackPositionX < -CRAB_RANGE_X) {
      this.trackPositionX = -CRAB_RANGE_X;
      this.direction = 1;
    }
    this.updatePosition();

    // Leg scuttle animation
    for (const leg of this.legs) {
      leg.mesh.rotation.z = leg.baseRotZ + Math.sin(timeSec * 16 + leg.phase) * 0.22;
    }

    // Claw wave
    this.leftClaw.rotation.y = 0.35 + Math.sin(timeSec * 6) * 0.15;
    this.rightClaw.rotation.y = -0.35 - Math.sin(timeSec * 6) * 0.15;
  }

  triggerKnockdown() {
    this.isHit = true;
    this.crabContainer.scale.set(1.25, 0.75, 1.25); // Squash pulse
  }
}

class CarnivalBallTossGame extends xb.Script {
  constructor() {
    super();
    this.gameState = 'MENU'; // 'MENU' | 'PLAYING' | 'ROUND_OVER'
    this.score = 0;
    this.ballsRemaining = BALLS_PER_ROUND;
    this.successfulHits = 0;
    this.roundLevel = 1;

    this.audio = new CarnivalAudioManager();
    this.balls = [];
    this.rigidBodyToBall = new Map();
  }

  initPhysics(physics) {
    this.RAPIER = physics.RAPIER;
    this.blendedWorld = physics.blendedWorld;

    // Floor physics plane
    const floorDesc = this.RAPIER.RigidBodyDesc.fixed().setTranslation(0, 0, 0);
    const floorBody = this.blendedWorld.createRigidBody(floorDesc);
    const floorCol = this.RAPIER.ColliderDesc.cuboid(10, 0.05, 10);
    this.blendedWorld.createCollider(floorCol, floorBody);

    // Ball pit table and surrounding walls
    this.setupBallPitPhysics();

    // Initialize all ball pool physics
    for (const ball of this.balls) {
      ball.initPhysics(physics);
      this.rigidBodyToBall.set(ball.rigidBody.handle, ball);
    }
  }

  setupBallPitPhysics() {
    // Tray base
    const pitBaseDesc = this.RAPIER.RigidBodyDesc.fixed().setTranslation(
      PIT_POS.x,
      PIT_POS.y - 0.02,
      PIT_POS.z
    );
    const pitBaseBody = this.blendedWorld.createRigidBody(pitBaseDesc);
    const pitBaseCol = this.RAPIER.ColliderDesc.cuboid(
      PIT_WIDTH / 2,
      0.02,
      PIT_DEPTH / 2
    );
    this.blendedWorld.createCollider(pitBaseCol, pitBaseBody);

    // Perimeter retaining walls
    const hw = PIT_WIDTH / 2;
    const hd = PIT_DEPTH / 2;
    const wallThick = 0.025;
    const wallH = PIT_WALL_HEIGHT / 2;

    const walls = [
      { x: PIT_POS.x, z: PIT_POS.z - hd, sx: hw, sz: wallThick },
      { x: PIT_POS.x, z: PIT_POS.z + hd, sx: hw, sz: wallThick },
      { x: PIT_POS.x - hw, z: PIT_POS.z, sx: wallThick, sz: hd },
      { x: PIT_POS.x + hw, z: PIT_POS.z, sx: wallThick, sz: hd },
    ];

    walls.forEach((w) => {
      const desc = this.RAPIER.RigidBodyDesc.fixed().setTranslation(
        w.x,
        PIT_POS.y + wallH,
        w.z
      );
      const b = this.blendedWorld.createRigidBody(desc);
      const c = this.RAPIER.ColliderDesc.cuboid(w.sx, wallH, w.sz);
      this.blendedWorld.createCollider(c, b);
    });
  }

  init() {
    this.setupEnvironment();
    this.setupBallPitVisuals();
    this.setupCrabAndTrack();
    this.setupBalls();
    this.setupSpatialHUD();

    this.sparks = new SparkParticleGroup(32);
    this.add(this.sparks);

    // Desktop Raycasting helper
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyR') this.startNewRound();
      if (e.code === 'Space') this.simulateToss();
    });
  }

  setupEnvironment() {
    const hemi = new THREE.HemisphereLight(0xfff7e6, 0x1e1b4b, 2.5);
    this.add(hemi);

    const sun = new THREE.DirectionalLight(0xffedd5, 2.8);
    sun.position.set(2.5, 4.8, 1.2);
    sun.castShadow = true;
    this.add(sun);

    // Warm booth spotlights
    const trackLight = new THREE.PointLight(0xf59e0b, 2.2, 7.0);
    trackLight.position.set(0, CRAB_TRACK_Y + 1.2, CRAB_TRACK_Z + 0.4);
    this.add(trackLight);

    // Carnival back-wall
    const wallGeom = new THREE.BoxGeometry(4.8, 3.2, 0.1);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.8 });
    const wallMesh = new THREE.Mesh(wallGeom, wallMat);
    wallMesh.position.set(0, 1.6, CRAB_TRACK_Z - 0.4);
    this.add(wallMesh);
  }

  setupBallPitVisuals() {
    this.pitGroup = new THREE.Group();
    this.pitGroup.position.copy(PIT_POS);

    // Wooden stand table
    const standGeom = new THREE.CylinderGeometry(0.24, 0.28, PIT_POS.y, 24);
    const standMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.7 });
    const standMesh = new THREE.Mesh(standGeom, standMat);
    standMesh.position.set(0, -PIT_POS.y / 2, 0);
    this.pitGroup.add(standMesh);

    // Ball tray
    const trayGeom = new THREE.BoxGeometry(PIT_WIDTH, 0.04, PIT_DEPTH);
    const trayMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.5 });
    const trayMesh = new THREE.Mesh(trayGeom, trayMat);
    this.pitGroup.add(trayMesh);

    // Striped rim border
    const rimGeom = new THREE.BoxGeometry(PIT_WIDTH + 0.04, PIT_WALL_HEIGHT, PIT_DEPTH + 0.04);
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.6 });
    const rimMesh = new THREE.Mesh(rimGeom, rimMat);
    rimMesh.position.y = PIT_WALL_HEIGHT / 2;
    this.pitGroup.add(rimMesh);

    this.add(this.pitGroup);
  }

  setupCrabAndTrack() {
    // Physical wooden track beam
    const beamGeom = new THREE.BoxGeometry(CRAB_RANGE_X * 2 + 0.5, 0.08, 0.35);
    const beamMat = new THREE.MeshStandardMaterial({ color: 0x581c87, roughness: 0.6 });
    const beamMesh = new THREE.Mesh(beamGeom, beamMat);
    beamMesh.position.set(0, CRAB_TRACK_Y - 0.05, CRAB_TRACK_Z);
    beamMesh.receiveShadow = true;
    this.add(beamMesh);

    // Striped carnival backdrop banner
    const bannerGeom = new THREE.BoxGeometry(CRAB_RANGE_X * 2 + 0.4, 0.5, 0.02);
    const bannerMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });
    const bannerMesh = new THREE.Mesh(bannerGeom, bannerMat);
    bannerMesh.position.set(0, CRAB_TRACK_Y + 0.28, CRAB_TRACK_Z - 0.12);
    this.add(bannerMesh);

    // Animated Crab Target
    this.crab = new CrabTarget();
    this.add(this.crab);
  }

  setupBalls() {
    for (let i = 0; i < NUM_BALLS; i++) {
      const ballScript = new TossBallScript(i, this);
      this.balls.push(ballScript);
      this.add(ballScript);
    }
  }

  setupSpatialHUD() {
    this.scoreText = new xb.UIText({
      text: '0000',
      style: { fontSize: 36, fontWeight: 'bold', color: '#fbbf24', textAlign: 'center' },
    });

    this.ballsText = new xb.UIText({
      text: 'BALLS: 10',
      style: { fontSize: 18, fontWeight: 'bold', color: '#38bdf8', textAlign: 'center' },
    });

    this.statusText = new xb.UIText({
      text: 'Reach into the pit, grab a ball, and fling it at the crab!',
      style: { fontSize: 13, color: '#cbd5e1', textAlign: 'center', lineHeight: 1.35 },
    });

    this.playAgainBtn = new xb.UIButton({
      label: 'Play Round',
      icon: 'sports_baseball',
      style: { width: '100%', padding: 10, backgroundColor: '#2563eb' },
      onClick: () => this.startNewRound(),
    });

    this.hudCard = new xb.UICard({
      size: { width: 0.44, height: 'auto' },
      manipulation: false,
      style: {
        flexDirection: 'column',
        gap: 10,
        padding: 16,
        backgroundColor: 'rgba(15, 23, 42, 0.94)',
        borderRadius: 18,
        borderWidth: 2,
        borderColor: 'rgba(251, 191, 36, 0.4)',
      },
      children: [
        new xb.UIText({
          text: '🦀 CARNIVAL TOSS',
          style: { fontSize: 22, fontWeight: 'bold', color: '#f43f5e', textAlign: 'center' },
        }),
        new xb.UIPanel({
          style: {
            width: '100%',
            flexDirection: 'row',
            justifyContent: 'space-around',
            backgroundColor: 'rgba(0, 0, 0, 0.35)',
            borderRadius: 12,
            padding: 8,
          },
          children: [
            new xb.UIPanel({
              style: { flexDirection: 'column', alignItems: 'center' },
              children: [
                new xb.UIText({ text: 'SCORE', style: { fontSize: 11, color: '#94a3b8' } }),
                this.scoreText,
              ],
            }),
            new xb.UIPanel({
              style: { flexDirection: 'column', alignItems: 'center' },
              children: [
                new xb.UIText({ text: 'REMAINING', style: { fontSize: 11, color: '#94a3b8' } }),
                this.ballsText,
              ],
            }),
          ],
        }),
        this.statusText,
        this.playAgainBtn,
      ],
    });

    // Positioned beside the player at arm's reach
    this.hudCard.position.set(-0.36, 1.08, -0.62);
    this.hudCard.rotation.set(-0.16, 0.42, 0);
    this.add(this.hudCard);
  }

  startNewRound() {
    this.gameState = 'PLAYING';
    this.score = 0;
    this.ballsRemaining = BALLS_PER_ROUND;
    this.successfulHits = 0;
    this.roundLevel = 1;

    this.crab.resetState();
    for (const b of this.balls) b.respawnInPit();

    this.updateHUD();
    this.audio.playGrab();
  }

  onBallThrown(ball, velocity) {
    if (this.gameState !== 'PLAYING') return;

    this.ballsRemaining--;
    this.audio.playWhoosh(velocity.length());

    if (this.ballsRemaining <= 0) {
      setTimeout(() => {
        if (this.gameState === 'PLAYING') {
          this.gameState = 'ROUND_OVER';
          this.updateHUD();
        }
      }, 2500);
    }

    this.updateHUD();
  }

  simulateToss() {
    if (this.gameState !== 'PLAYING' || this.ballsRemaining <= 0) return;
    const availableBall = this.balls.find((b) => !b.isGrabbed);
    if (!availableBall) return;

    // Direct pitch towards crab with simulated throw
    _v1.set(
      this.crab.position.x + (Math.random() - 0.5) * 0.18,
      this.crab.position.y + 0.05,
      this.crab.position.z
    );
    const start = availableBall.mesh.position.clone();
    const delta = _v1.sub(start);
    const time = 0.45;
    const vel = delta.divideScalar(time);
    vel.y += 0.5 * 9.81 * time;

    availableBall.rigidBody.setTranslation({ x: start.x, y: start.y + 0.1, z: start.z }, true);
    availableBall.rigidBody.setLinvel({ x: vel.x, y: vel.y, z: vel.z }, true);
    availableBall.lastThrowTime = performance.now();
    this.onBallThrown(availableBall, vel);
  }

  updateHUD() {
    this.scoreText.text = String(this.score).padStart(4, '0');
    this.ballsText.text = `BALLS: ${Math.max(0, this.ballsRemaining)}`;

    if (this.gameState === 'MENU') {
      this.statusText.text = 'Tap Play Round to start the carnival toss!';
      this.playAgainBtn.label = 'Start Game';
    } else if (this.gameState === 'ROUND_OVER') {
      this.statusText.text = `Round Over! Score: ${this.score} (${this.successfulHits} hits). Play again?`;
      this.playAgainBtn.label = 'Play Again';
    } else {
      this.statusText.text = `Hits: ${this.successfulHits} | Speed: Lv.${this.roundLevel}`;
      this.playAgainBtn.label = 'Restart Round';
    }
  }

  physicsStep() {
    const dt = xb.getDeltaTime() || 0.016;
    const timeSec = performance.now() * 0.001;

    // Step each individual ball's physics
    for (const b of this.balls) {
      b.physicsStep();
    }

    // Crab Target Movement
    this.crab.update(dt, timeSec);

    // Continuous Hit Detection against Crab Mesh
    if (this.gameState === 'PLAYING' && !this.crab.isHit) {
      const crabPos = this.crab.position;
      const crabRadius = 0.28;

      for (const ball of this.balls) {
        if (ball.isGrabbed || !ball.rigidBody) continue;

        const ballPos = ball.mesh.position;
        const dist = ballPos.distanceTo(crabPos);

        if (dist < crabRadius + BALL_RADIUS) {
          const linvel = ball.rigidBody.linvel();
          const speed = Math.hypot(linvel.x, linvel.y, linvel.z);

          // 4. QUALIFYING HIT SPEED THRESHOLD
          if (speed >= MIN_HIT_SPEED) {
            this.handleCrabHit(ballPos, speed);
            break;
          }
        }
      }
    }
  }

  handleCrabHit(contactPoint, speed) {
    this.successfulHits++;
    const points = 100 * this.roundLevel;
    this.score += points;

    this.crab.triggerKnockdown();
    this.sparks.burst(contactPoint);
    this.audio.playCrabHit();

    // Ramp up speed on next respawn
    this.roundLevel++;
    this.updateHUD();

    // Respawn crab after brief knockdown delay
    setTimeout(() => {
      if (this.gameState === 'PLAYING') {
        this.crab.resetState();
        this.crab.speed = CRAB_BASE_SPEED + this.roundLevel * 0.25;
      }
    }, 1200);
  }

  update() {
    const dt = xb.getDeltaTime() || 0.016;
    this.sparks.update(dt);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const options = new xb.Options();
  options.setAppTitle('Carnival Ball Toss');
  options.setAppDescription(
    'Grab physical balls from the pit and throw them at the scuttling crab target!'
  );

  // Enable Rapier3D Physics Engine
  options.physics.RAPIER = RAPIER;

  // Hand and controller configuration
  options.enableHands();
  options.enableReticles();
  options.hands.visualization = true;
  options.hands.visualizeJoints = true;
  options.hands.visualizeMeshes = true;
  options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
  options.xrButton.showEnterSimulatorButton = true;

  xb.add(new CarnivalBallTossGame());
  xb.init(options);
});
    </script>
