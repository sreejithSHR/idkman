<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ball Throw XR | XR Blocks</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.1/build/addons/"
        }
      }
    </script>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      // --- Synthesized Audio FX (Procedural Web Audio) ---
      class SoundFX {
        constructor() {
          this.ctx = null;
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playThrow() {
          this.initContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.12);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        }

        playHit(ringTier) {
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          const baseFreq = ringTier === 3 ? 980 : ringTier === 2 ? 660 : 440;
          osc.type = ringTier === 3 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.2);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        }

        playCombo() {
          this.initContext();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.06;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
          });
        }
      }

      // --- Ball Throw Scene Script ---
      class BallThrowGame extends xb.Script {
        constructor() {
          super();
          this.sfx = new SoundFX();
          this.score = 0;
          this.highScore = 0;
          this.thrownCount = 0;
          this.hitCount = 0;
          this.combo = 0;
          this.maxCombo = 0;
          this.targetSpeedMult = 1.0;

          this.balls = [];
          this.targets = [];
          this.particles = [];
          this.hitTexts = [];

          this.gravity = -7.5;
          this.lastThrowTime = 0;
          this.throwCooldownMs = 160;
        }

        init() {
          this.setupLighting();
          this.buildEnvironment();
          this.buildTargetGallery();
          this.buildSpatialUi();
          this.buildParticlePool();
        }

        setupLighting() {
          const hemiLight = new THREE.HemisphereLight(0x1a2639, 0x050811, 2.0);
          this.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xddeeff, 2.5);
          dirLight.position.set(2, 5, 2.5);
          dirLight.castShadow = true;
          this.add(dirLight);

          const backLight = new THREE.DirectionalLight(0x7928ca, 1.6);
          backLight.position.set(-3, 4, -4);
          this.add(backLight);

          // Subtle arcade neon point lights
          const leftLight = new THREE.PointLight(0x00d2ff, 1.8, 6);
          leftLight.position.set(-2, 2.2, -2.5);
          this.add(leftLight);

          const rightLight = new THREE.PointLight(0xff007f, 1.8, 6);
          rightLight.position.set(2, 2.2, -2.5);
          this.add(rightLight);
        }

        buildEnvironment() {
          this.envGroup = new THREE.Group();
          this.envGroup.name = 'Environment';
          this.envGroup.xb = {pointerEvents: 'none'};

          // 1. Cyber-grid floor
          const gridHelper = new THREE.GridHelper(24, 24, 0x00f0ff, 0x142036);
          gridHelper.position.y = -0.01;
          this.envGroup.add(gridHelper);

          // Dark reflective ground plane
          const floorGeo = new THREE.PlaneGeometry(30, 30);
          const floorMat = new THREE.MeshStandardMaterial({
            color: 0x070b14,
            roughness: 0.7,
            metalness: 0.3,
          });
          const floor = new THREE.Mesh(floorGeo, floorMat);
          floor.rotation.x = -Math.PI / 2;
          floor.position.y = -0.02;
          floor.receiveShadow = true;
          this.envGroup.add(floor);

          // 2. Player Podium / Launching Pad
          const padGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.05, 36);
          const padMat = new THREE.MeshStandardMaterial({
            color: 0x0d1527,
            roughness: 0.4,
            metalness: 0.5,
          });
          const pad = new THREE.Mesh(padGeo, padMat);
          pad.position.set(0, 0.025, 0);
          this.envGroup.add(pad);

          // Glowing podium border ring
          const padRingGeo = new THREE.TorusGeometry(1.22, 0.018, 16, 48);
          padRingGeo.rotateX(Math.PI / 2);
          const padRingMat = new THREE.MeshBasicMaterial({color: 0x00ffff});
          const padRing = new THREE.Mesh(padRingGeo, padRingMat);
          padRing.position.set(0, 0.05, 0);
          this.envGroup.add(padRing);

          // 3. Futuristic Background Boundary Arch & Pillars
          const pillarGeo = new THREE.CylinderGeometry(0.08, 0.1, 4.5, 16);
          const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x111c30,
            metalness: 0.7,
            roughness: 0.2,
          });

          const pillarPositions = [
            [-2.4, 2.25, -4.2],
            [2.4, 2.25, -4.2],
            [-3.4, 2.25, -3.2],
            [3.4, 2.25, -3.2],
          ];

          pillarPositions.forEach(([x, y, z]) => {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(x, y, z);
            this.envGroup.add(pillar);

            // Neon vertical light strip on each pillar
            const stripGeo = new THREE.BoxGeometry(0.02, 4.2, 0.02);
            const stripMat = new THREE.MeshBasicMaterial({
              color: x < 0 ? 0x00d2ff : 0xff007f,
            });
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.set(x + (x < 0 ? 0.08 : -0.08), y, z);
            this.envGroup.add(strip);
          });

          // Top Cross Beam / Header
          const beamGeo = new THREE.BoxGeometry(5.0, 0.12, 0.2);
          const beamMat = new THREE.MeshStandardMaterial({
            color: 0x152033,
            metalness: 0.6,
            roughness: 0.3,
          });
          const beam = new THREE.Mesh(beamGeo, beamMat);
          beam.position.set(0, 4.4, -4.2);
          this.envGroup.add(beam);

          // Glowing neon header strip
          const neonBeamGeo = new THREE.BoxGeometry(4.8, 0.03, 0.04);
          const neonBeamMat = new THREE.MeshBasicMaterial({color: 0x00f0ff});
          const neonBeam = new THREE.Mesh(neonBeamGeo, neonBeamMat);
          neonBeam.position.set(0, 4.34, -4.1);
          this.envGroup.add(neonBeam);

          // 4. Subtle Floating Cyber Dust/Ambient Particles
          const ambientCount = 45;
          const dustGeo = new THREE.BufferGeometry();
          const dustPositions = new Float32Array(ambientCount * 3);
          for (let i = 0; i < ambientCount; i++) {
            dustPositions[i * 3] = (Math.random() - 0.5) * 8;
            dustPositions[i * 3 + 1] = Math.random() * 3.5 + 0.2;
            dustPositions[i * 3 + 2] = -Math.random() * 4.5 - 0.5;
          }
          dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
          const dustMat = new THREE.PointsMaterial({
            size: 0.025,
            color: 0x66ccff,
            transparent: true,
            opacity: 0.55,
          });
          this.dustField = new THREE.Points(dustGeo, dustMat);
          this.envGroup.add(this.dustField);

          this.add(this.envGroup);
        }

        // --- Target Creation and Motion Config ---
        buildTargetGallery() {
          const targetConfigs = [
            {
              id: 0,
              basePos: new THREE.Vector3(-1.1, 1.6, -2.4),
              amplitude: new THREE.Vector3(0.7, 0.45, 0.25),
              frequency: new THREE.Vector3(1.1, 1.6, 0.8),
              phase: 0.0,
              scale: 0.85,
            },
            {
              id: 1,
              basePos: new THREE.Vector3(0.0, 1.45, -3.2),
              amplitude: new THREE.Vector3(1.1, 0.55, 0.4),
              frequency: new THREE.Vector3(0.85, 1.25, 0.9),
              phase: 2.1,
              scale: 1.05,
            },
            {
              id: 2,
              basePos: new THREE.Vector3(1.1, 1.7, -2.6),
              amplitude: new THREE.Vector3(0.8, 0.4, 0.3),
              frequency: new THREE.Vector3(1.3, 0.95, 1.1),
              phase: 4.2,
              scale: 0.9,
            },
          ];

          targetConfigs.forEach((cfg) => {
            const target = this.createTargetMesh(cfg.scale);
            target.userData = {
              ...cfg,
              wobble: 0,
              hitTimer: 0,
              curPos: cfg.basePos.clone(),
            };
            target.position.copy(cfg.basePos);
            this.add(target);
            this.targets.push(target);
          });
        }

        createTargetMesh(scaleFactor = 1.0) {
          const group = new THREE.Group();
          group.name = 'MovingTarget';

          // Outer Ring (Radius ~ 0.34m) - 25 points
          const outerGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.03, 32);
          outerGeo.rotateX(Math.PI / 2);
          const outerMat = new THREE.MeshStandardMaterial({
            color: 0x3388ff,
            roughness: 0.3,
            metalness: 0.2,
          });
          const outerMesh = new THREE.Mesh(outerGeo, outerMat);
          outerMesh.name = 'OuterRing';
          group.add(outerMesh);

          // Middle Ring (Radius ~ 0.22m) - 50 points
          const midGeo = new THREE.CylinderGeometry(0.23, 0.23, 0.035, 32);
          midGeo.rotateX(Math.PI / 2);
          const midMat = new THREE.MeshStandardMaterial({
            color: 0xff3b30,
            roughness: 0.35,
            metalness: 0.1,
          });
          const midMesh = new THREE.Mesh(midGeo, midMat);
          midMesh.position.z = 0.005;
          midMesh.name = 'MidRing';
          group.add(midMesh);

          // Inner Bullseye (Radius ~ 0.11m) - 100 points
          const bullseyeGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.04, 32);
          bullseyeGeo.rotateX(Math.PI / 2);
          const bullseyeMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0x553300,
            roughness: 0.25,
            metalness: 0.4,
          });
          const bullseyeMesh = new THREE.Mesh(bullseyeGeo, bullseyeMat);
          bullseyeMesh.position.z = 0.01;
          bullseyeMesh.name = 'Bullseye';
          group.add(bullseyeMesh);

          // Outer glowing holographic border ring
          const ringGeo = new THREE.TorusGeometry(0.355, 0.015, 16, 48);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0x88eeff,
            wireframe: false,
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          group.add(ringMesh);

          group.scale.setScalar(scaleFactor);
          return group;
        }

        // --- Spatial UI Overlay / Card ---
        buildSpatialUi() {
          this.scoreText = new xb.UIText({
            text: 'Score: 0',
            style: {
              fontSize: 32,
              fontWeight: 'bold',
              color: '#ffd700',
              textAlign: 'center',
            },
          });

          this.statsText = new xb.UIText({
            text: 'Hits: 0 / 0 (0%)\nCombo: 0x',
            style: {
              fontSize: 18,
              lineHeight: 1.4,
              opacity: 0.9,
              textAlign: 'center',
            },
          });

          this.highScoreText = new xb.UIText({
            text: 'Best: 0',
            style: {
              fontSize: 16,
              opacity: 0.75,
              textAlign: 'center',
            },
          });

          const speedLabel = new xb.UIText({
            text: 'Target Speed: 1.0x',
            style: {fontSize: 16, fontWeight: 'bold'},
          });

          const speedSlider = new xb.UISlider({
            ariaLabel: 'Target speed adjustment',
            min: 20,
            max: 200,
            step: 10,
            value: 100,
            style: {width: '100%', height: 38},
            onInput: (val) => {
              this.targetSpeedMult = val / 100;
              speedLabel.text = `Target Speed: ${(val / 100).toFixed(1)}x`;
            },
          });

          const resetButton = new xb.UIButton({
            label: 'Reset Game',
            icon: 'restart_alt',
            style: {width: '100%', height: 44},
            onClick: () => this.resetGame(),
          });

          this.uiCard = new xb.UICard({
            size: {width: 0.52, height: 'auto'},
            manipulation: true,
            edge: {scale: true},
            style: {
              flexDirection: 'column',
              gap: 12,
              padding: 18,
              backgroundColor: 'rgba(10, 15, 28, 0.88)',
              borderRadius: 20,
            },
            children: [
              new xb.UIText({
                text: 'TARGET TOSS XR',
                style: {
                  fontSize: 22,
                  fontWeight: 'bold',
                  letterSpacing: 2,
                  textAlign: 'center',
                },
              }),
              this.scoreText,
              this.highScoreText,
              this.statsText,
              new xb.UIPanel({
                style: {
                  width: '100%',
                  flexDirection: 'column',
                  gap: 6,
                  marginTop: 6,
                },
                children: [speedLabel, speedSlider],
              }),
              resetButton,
            ],
          });

          // Mount to user's left at comfortable depth and angle
          this.uiCard.position.set(-0.88, 1.45, -1.25);
          this.uiCard.rotation.y = 0.35;
          this.add(this.uiCard);
        }

        buildParticlePool() {
          const count = 60;
          const geo = new THREE.SphereGeometry(0.02, 8, 8);
          for (let i = 0; i < count; i++) {
            const mat = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0,
            });
            const p = new THREE.Mesh(geo, mat);
            p.visible = false;
            p.userData = {
              active: false,
              life: 0,
              velocity: new THREE.Vector3(),
            };
            this.add(p);
            this.particles.push(p);
          }
        }

        spawnHitSparks(pos, colorHex, count = 14) {
          let spawned = 0;
          for (const p of this.particles) {
            if (!p.userData.active) {
              p.visible = true;
              p.userData.active = true;
              p.userData.life = 1.0;
              p.position.copy(pos);
              p.material.color.set(colorHex);
              p.material.opacity = 1.0;
              p.userData.velocity.set(
                (Math.random() - 0.5) * 4.0,
                (Math.random() - 0.2) * 3.5,
                (Math.random() - 0.5) * 4.0
              );
              spawned++;
              if (spawned >= count) break;
            }
          }
        }

        // --- Ball Launching Mechanics ---
        onSelectStart(event) {
          const now = performance.now();
          if (now - this.lastThrowTime < this.throwCooldownMs) return;
          this.lastThrowTime = now;

          const controller = event.source?.controller;
          let origin = new THREE.Vector3();
          let forward = new THREE.Vector3(0, 0, -1);

          if (controller) {
            controller.getWorldPosition(origin);
            forward.applyQuaternion(controller.quaternion).normalize();
            // Move spawn point slightly forward along controller ray
            origin.addScaledVector(forward, 0.08);
          } else {
            // Desktop fallback via camera
            xb.core.camera.getWorldPosition(origin);
            forward = new THREE.Vector3(0, 0, -1)
              .applyQuaternion(xb.core.camera.quaternion)
              .normalize();
            origin.addScaledVector(forward, 0.2);
            origin.y -= 0.1;
          }

          // Launch velocity with a slight upward arc
          const speed = 12.5;
          const launchDir = forward.clone();
          launchDir.y += 0.08;
          launchDir.normalize();

          const velocity = launchDir.multiplyScalar(speed);
          this.createBall(origin, velocity);

          this.thrownCount++;
          this.sfx.playThrow();
          this.updateStatsDisplay();
        }

        createBall(position, velocity) {
          const radius = 0.065;
          const ballColors = [0xff5533, 0xffd000, 0x00d2ff, 0x00ff88, 0xff00bb];
          const color = ballColors[this.thrownCount % ballColors.length];

          const geo = new THREE.SphereGeometry(radius, 24, 24);
          const mat = new THREE.MeshStandardMaterial({
            color,
            roughness: 0.2,
            metalness: 0.15,
            emissive: color,
            emissiveIntensity: 0.2,
          });
          const ball = new THREE.Mesh(geo, mat);
          ball.position.copy(position);
          ball.userData = {
            velocity: velocity.clone(),
            radius,
            active: true,
            lifeTime: 0,
            maxLifeTime: 3.5,
          };
          this.add(ball);
          this.balls.push(ball);
        }

        // --- Main Frame Update ---
        update(delta) {
          super.update?.(delta);
          const dt = Math.min(delta || 0.016, 0.05);
          const time = performance.now() * 0.001;

          if (this.dustField) {
            this.dustField.rotation.y = time * 0.02;
          }

          this.updateTargets(time, dt);
          this.updateBalls(dt);
          this.updateParticles(dt);
        }

        updateTargets(time, dt) {
          const speedFactor = this.targetSpeedMult;

          this.targets.forEach((target) => {
            const data = target.userData;

            // Parametric 3D Lissajous curve movement
            const t = time * speedFactor + data.phase;
            const x = data.basePos.x + Math.sin(t * data.frequency.x) * data.amplitude.x;
            const y = data.basePos.y + Math.cos(t * data.frequency.y) * data.amplitude.y;
            const z = data.basePos.z + Math.sin(t * data.frequency.z) * data.amplitude.z;

            target.position.set(x, y, z);

            // Natural bank & tilt based on velocity direction
            const vx = Math.cos(t * data.frequency.x) * data.amplitude.x * data.frequency.x;
            const vy = -Math.sin(t * data.frequency.y) * data.amplitude.y * data.frequency.y;

            target.rotation.z = -vx * 0.22;
            target.rotation.x = vy * 0.18;
            target.rotation.y = Math.sin(t * 0.8) * 0.15;

            // Hit wobble animation feedback
            if (data.wobble > 0) {
              data.wobble = Math.max(0, data.wobble - dt * 3.5);
              const wobbleScale = 1.0 + Math.sin(data.wobble * Math.PI * 4) * 0.25 * data.wobble;
              target.scale.setScalar(data.scale * wobbleScale);
            }
          });
        }

        updateBalls(dt) {
          for (let i = this.balls.length - 1; i >= 0; i--) {
            const ball = this.balls[i];
            const data = ball.userData;

            data.lifeTime += dt;
            if (!data.active || data.lifeTime > data.maxLifeTime) {
              this.removeBall(ball, i);
              continue;
            }

            // Apply projectile physics
            data.velocity.y += this.gravity * dt;
            ball.position.addScaledVector(data.velocity, dt);

            // Spin ball as it flies
            ball.rotation.x += data.velocity.z * dt * 2.0;
            ball.rotation.y += data.velocity.x * dt * 2.0;

            // Check collisions with all moving targets
            let hitOccurred = false;
            for (const target of this.targets) {
              const targetRadius = 0.35 * target.userData.scale;
              const dist = ball.position.distanceTo(target.position);

              if (dist < targetRadius + data.radius) {
                // Determine precision ring tier
                const relativeHitDist = dist / target.userData.scale;
                let points = 25;
                let tier = 1;
                let sparkColor = 0x3388ff;

                if (relativeHitDist <= 0.13) {
                  points = 100;
                  tier = 3;
                  sparkColor = 0xffd700;
                } else if (relativeHitDist <= 0.25) {
                  points = 50;
                  tier = 2;
                  sparkColor = 0xff3344;
                }

                this.onTargetHit(target, ball.position, points, tier, sparkColor);
                hitOccurred = true;
                break;
              }
            }

            if (hitOccurred) {
              this.removeBall(ball, i);
              continue;
            }

            // Despawn if hitting below floor
            if (ball.position.y < -0.2) {
              this.combo = 0;
              this.updateStatsDisplay();
              this.removeBall(ball, i);
            }
          }
        }

        onTargetHit(target, hitPosition, basePoints, tier, color) {
          this.hitCount++;
          this.combo++;
          if (this.combo > this.maxCombo) this.maxCombo = this.combo;

          const comboMult = Math.min(4, 1 + Math.floor((this.combo - 1) / 3));
          const earnedPoints = basePoints * comboMult;
          this.score += earnedPoints;
          if (this.score > this.highScore) this.highScore = this.score;

          // Visual and audio impacts
          target.userData.wobble = 1.0;
          this.spawnHitSparks(hitPosition, color, tier === 3 ? 24 : 14);

          if (this.combo > 1 && this.combo % 3 === 0) {
            this.sfx.playCombo();
          } else {
            this.sfx.playHit(tier);
          }

          this.updateStatsDisplay();
        }

        removeBall(ball, index) {
          this.remove(ball);
          ball.geometry.dispose();
          ball.material.dispose();
          this.balls.splice(index, 1);
        }

        updateParticles(dt) {
          for (const p of this.particles) {
            if (!p.userData.active) continue;
            p.userData.life -= dt * 1.8;
            if (p.userData.life <= 0) {
              p.userData.active = false;
              p.visible = false;
              continue;
            }
            p.userData.velocity.y -= 6.0 * dt;
            p.position.addScaledVector(p.userData.velocity, dt);
            p.material.opacity = p.userData.life;
            p.scale.setScalar(Math.max(0.2, p.userData.life));
          }
        }

        updateStatsDisplay() {
          this.scoreText.text = `Score: ${this.score}`;
          this.highScoreText.text = `Best: ${this.highScore}`;
          const accuracy =
            this.thrownCount > 0
              ? Math.round((this.hitCount / this.thrownCount) * 100)
              : 0;
          const comboStr =
            this.combo > 1
              ? ` 🔥 ${this.combo}x STREAK!`
              : `Combo: ${this.combo}x`;
          this.statsText.text = `Hits: ${this.hitCount} / ${this.thrownCount} (${accuracy}%)\n${comboStr}`;
        }

        resetGame() {
          this.score = 0;
          this.thrownCount = 0;
          this.hitCount = 0;
          this.combo = 0;
          for (let i = this.balls.length - 1; i >= 0; i--) {
            this.removeBall(this.balls[i], i);
          }
          this.updateStatsDisplay();
        }

        dispose() {
          for (let i = this.balls.length - 1; i >= 0; i--) {
            this.removeBall(this.balls[i], i);
          }
          this.particles.forEach((p) => {
            p.geometry.dispose();
            p.material.dispose();
          });
        }
      }

      // --- Initialization ---
      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Ball Throw Target XR');
        options.setAppDescription(
          'Aim and throw balls at continuous 3D moving targets with combo precision scoring.'
        );
        options.reticles.enabled = true;
        options.enableHands();
        options.hands.visualization = true;

        xb.add(new BallThrowGame());
        xb.init(options);
      });
    </script>
  </body>
</html>
