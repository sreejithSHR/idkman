    <script type="module">
import * as THREE from 'three';
import * as xb from 'xrblocks';

const CAN_RADIUS = 0.052;
const CAN_HEIGHT = 0.15;
const BALL_RADIUS = 0.046;
const TABLE_Y = 0.92;
const TABLE_Z = -1.65;
const STAND_POS = new THREE.Vector3(0, 0.95, -0.68);
const INITIAL_BALLS = 5;

class CarnivalAudio {
  constructor() {
    this.ctx = null;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playWhoosh() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(380, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.24);
    } catch (_) {}
  }

  playCanHit() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(820, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    } catch (_) {}
  }

  playCheer() {
    try {
      this.ensureContext();
      if (!this.ctx) return;
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.32);
      });
    } catch (_) {}
  }
}

function createBaseballTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f7f4ec';
  ctx.fillRect(0, 0, 512, 256);

  ctx.strokeStyle = '#c62828';
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let x = 0; x <= 512; x += 4) {
    const y = 128 + Math.sin((x / 512) * Math.PI * 2) * 54;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.lineWidth = 3;
  for (let x = 0; x <= 512; x += 18) {
    const y = 128 + Math.sin((x / 512) * Math.PI * 2) * 54;
    ctx.beginPath();
    ctx.moveTo(x - 5, y - 9);
    ctx.lineTo(x + 5, y + 9);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createCanTexture(colorHex, pointsLabel) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = colorHex;
  ctx.fillRect(0, 0, 256, 256);

  // Metallic top and bottom borders
  ctx.fillStyle = '#e0e0e0';
  ctx.fillRect(0, 0, 256, 28);
  ctx.fillRect(0, 228, 256, 28);

  // White label badge
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(128, 128, 62, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#212121';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Points text
  ctx.fillStyle = '#d32f2f';
  ctx.font = 'bold 44px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pointsLabel, 128, 128);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

class ConfettiSystem extends THREE.Group {
  constructor(count = 70) {
    super();
    this.particles = [];
    const geom = new THREE.PlaneGeometry(0.025, 0.025);
    const colors = [0xff3b30, 0xffcc00, 0x34c759, 0x007aff, 0xff9500, 0xaf52de];

    for (let i = 0; i < count; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: colors[i % colors.length],
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.visible = false;
      this.add(mesh);
      this.particles.push({
        mesh,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3(),
        life: 0,
        maxLife: 0,
      });
    }
  }

  burst(origin) {
    for (const p of this.particles) {
      p.mesh.position.copy(origin);
      p.mesh.visible = true;
      p.vel.set(
        (Math.random() - 0.5) * 3.5,
        Math.random() * 2.8 + 1.2,
        (Math.random() - 0.5) * 3.0
      );
      p.rotVel.set(
        Math.random() * 12,
        Math.random() * 12,
        Math.random() * 12
      );
      p.life = 0;
      p.maxLife = 1.6 + Math.random() * 0.8;
    }
  }

  update(dt) {
    for (const p of this.particles) {
      if (!p.mesh.visible) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
        continue;
      }
      p.vel.y -= 7.5 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.rotation.x += p.rotVel.x * dt;
      p.mesh.rotation.y += p.rotVel.y * dt;
      p.mesh.scale.setScalar(Math.max(0.01, 1 - p.life / p.maxLife));
    }
  }
}

class CarnivalGameScene extends xb.Script {
  constructor() {
    super();
    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.pitchPower = 5.5;

    this.audio = new CarnivalAudio();
    this.baseballTexture = createBaseballTexture();

    this.cans = [];
    this.balls = [];
    this.controllers = [];
    this.lastControllerPositions = new Map();

    // Grabbing state
    this.isGrabbingInteractiveBall = false;
    this.grabbedController = null;
    this.isMouseDown = false;
    this.dragStartPos = new THREE.Vector2();

    this.initPhysics();
  }

  initPhysics() {
    this.world = new CANNON.World();
    this.world.gravity.set(0, -9.82, 0);
    this.world.broadphase = new CANNON.NaiveBroadphase();
    this.world.solver.iterations = 12;

    const defaultMat = new CANNON.Material('default');
    const contactMat = new CANNON.ContactMaterial(defaultMat, defaultMat, {
      friction: 0.42,
      restitution: 0.32,
    });
    this.world.addContactMaterial(contactMat);
    this.world.defaultContactMaterial = contactMat;
  }

  init() {
    this.setupLighting();
    this.setupCarnivalBooth();
    this.setupCanPyramid();
    this.setupBallStand();
    this.setupHandsAndControllers();
    this.setupSpatialUI();
    this.setupDesktopControls();

    this.confetti = new ConfettiSystem(80);
    this.add(this.confetti);
  }

  setupLighting() {
    const hemi = new THREE.HemisphereLight(0xfff7e6, 0x422a1d, 2.6);
    this.add(hemi);

    const dir = new THREE.DirectionalLight(0xfff5e6, 2.5);
    dir.position.set(2.0, 4.2, 1.5);
    dir.castShadow = true;
    this.add(dir);

    // Warm booth lamps
    const leftLamp = new THREE.PointLight(0xffb74d, 2.0, 5.0);
    leftLamp.position.set(-0.8, 2.2, TABLE_Z + 0.3);
    const rightLamp = new THREE.PointLight(0xffb74d, 2.0, 5.0);
    rightLamp.position.set(0.8, 2.2, TABLE_Z + 0.3);
    this.add(leftLamp, rightLamp);
  }

  setupCarnivalBooth() {
    this.boothGroup = new THREE.Group();

    // Wood counter table
    const tableGeom = new THREE.BoxGeometry(1.7, 0.1, 0.9);
    const tableMat = new THREE.MeshStandardMaterial({
      color: 0x5d4037,
      roughness: 0.65,
      metalness: 0.1,
    });
    const tableMesh = new THREE.Mesh(tableGeom, tableMat);
    tableMesh.position.set(0, TABLE_Y - 0.05, TABLE_Z);
    tableMesh.receiveShadow = true;
    this.boothGroup.add(tableMesh);

    // Physical static counter surface
    const tableBody = new CANNON.Body({ mass: 0 });
    tableBody.addShape(new CANNON.Box(new CANNON.Vec3(0.85, 0.05, 0.45)));
    tableBody.position.set(0, TABLE_Y - 0.05, TABLE_Z);
    this.world.addBody(tableBody);

    // Table legs
    const legGeom = new THREE.CylinderGeometry(0.04, 0.04, TABLE_Y - 0.1, 16);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 });
    const legCoords = [
      [-0.75, (TABLE_Y - 0.1) / 2, TABLE_Z - 0.35],
      [0.75, (TABLE_Y - 0.1) / 2, TABLE_Z - 0.35],
      [-0.75, (TABLE_Y - 0.1) / 2, TABLE_Z + 0.35],
      [0.75, (TABLE_Y - 0.1) / 2, TABLE_Z + 0.35],
    ];
    for (const [lx, ly, lz] of legCoords) {
      const leg = new THREE.Mesh(legGeom, legMat);
      leg.position.set(lx, ly, lz);
      this.boothGroup.add(leg);
    }

    // Booth backdrop backboard
    const backGeom = new THREE.BoxGeometry(2.2, 2.2, 0.08);
    const backMat = new THREE.MeshStandardMaterial({
      color: 0x1a237e,
      roughness: 0.7,
    });
    const backMesh = new THREE.Mesh(backGeom, backMat);
    backMesh.position.set(0, 1.45, TABLE_Z - 0.45);
    this.boothGroup.add(backMesh);

    const backBody = new CANNON.Body({ mass: 0 });
    backBody.addShape(new CANNON.Box(new CANNON.Vec3(1.1, 1.1, 0.04)));
    backBody.position.set(0, 1.45, TABLE_Z - 0.45);
    this.world.addBody(backBody);

    // Side guards to keep cans contained on table
    const sideGeom = new THREE.BoxGeometry(0.06, 0.3, 0.85);
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
    const leftSide = new THREE.Mesh(sideGeom, sideMat);
    leftSide.position.set(-0.82, TABLE_Y + 0.15, TABLE_Z);
    const rightSide = new THREE.Mesh(sideGeom, sideMat);
    rightSide.position.set(0.82, TABLE_Y + 0.15, TABLE_Z);
    this.boothGroup.add(leftSide, rightSide);

    // Floor physics plane
    const floorBody = new CANNON.Body({ mass: 0 });
    floorBody.addShape(new CANNON.Plane());
    floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    floorBody.position.set(0, 0, 0);
    this.world.addBody(floorBody);

    // Striped Awning canopy
    const awning = new THREE.Group();
    const stripes = 9;
    const stripeW = 2.2 / stripes;
    for (let i = 0; i < stripes; i++) {
      const sGeom = new THREE.BoxGeometry(stripeW, 0.04, 0.7);
      const isRed = i % 2 === 0;
      const sMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xd32f2f : 0xffffff,
        roughness: 0.5,
      });
      const sMesh = new THREE.Mesh(sGeom, sMat);
      sMesh.position.set(-1.1 + stripeW * (i + 0.5), 0, 0);
      awning.add(sMesh);
    }
    awning.position.set(0, 2.5, TABLE_Z - 0.15);
    awning.rotation.x = 0.28;
    this.boothGroup.add(awning);

    this.add(this.boothGroup);
  }

  setupCanPyramid() {
    const pyramidLayout = [
      // Bottom Row (3 cans) - 100 points
      { x: -0.13, y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#e53935', label: '100', pts: 100 },
      { x: 0.0,   y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#1e88e5', label: '100', pts: 100 },
      { x: 0.13,  y: TABLE_Y + CAN_HEIGHT / 2 + 0.005, z: TABLE_Z, color: '#43a047', label: '100', pts: 100 },
      // Middle Row (2 cans) - 200 points
      { x: -0.065, y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.015, z: TABLE_Z, color: '#fb8c00', label: '200', pts: 200 },
      { x: 0.065,  y: TABLE_Y + CAN_HEIGHT * 1.5 + 0.015, z: TABLE_Z, color: '#8e24aa', label: '200', pts: 200 },
      // Top Row (1 can) - 500 points
      { x: 0.0,    y: TABLE_Y + CAN_HEIGHT * 2.5 + 0.025, z: TABLE_Z, color: '#fbc02d', label: '500', pts: 500 },
    ];

    const canGeom = new THREE.CylinderGeometry(CAN_RADIUS, CAN_RADIUS, CAN_HEIGHT, 24);

    for (const cfg of pyramidLayout) {
      const tex = createCanTexture(cfg.color, cfg.label);
      const canMat = new THREE.MeshStandardMaterial({
        map: tex,
        metalness: 0.55,
        roughness: 0.35,
      });
      const mesh = new THREE.Mesh(canGeom, canMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      this.add(mesh);

      // Stable rigid body using box bounds for perfect initial stacking balance
      const body = new CANNON.Body({
        mass: 0.35,
        position: new CANNON.Vec3(cfg.x, cfg.y, cfg.z),
      });
      body.addShape(new CANNON.Box(new CANNON.Vec3(CAN_RADIUS * 0.9, CAN_HEIGHT / 2, CAN_RADIUS * 0.9)));
      body.linearDamping = 0.25;
      body.angularDamping = 0.3;

      this.world.addBody(body);

      this.cans.push({
        mesh,
        body,
        initialPos: new CANNON.Vec3(cfg.x, cfg.y, cfg.z),
        points: cfg.pts,
        isKnocked: false,
      });
    }

    this.syncCansTransforms();
  }

  setupBallStand() {
    const standGeom = new THREE.CylinderGeometry(0.16, 0.2, 0.95, 24);
    const standMat = new THREE.MeshStandardMaterial({
      color: 0x37474f,
      roughness: 0.6,
      metalness: 0.2,
    });
    this.stand = new THREE.Mesh(standGeom, standMat);
    this.stand.position.set(STAND_POS.x, STAND_POS.y / 2, STAND_POS.z);
    this.add(this.stand);

    // Interactive baseball on pedestal
    const ballGeom = new THREE.SphereGeometry(BALL_RADIUS, 24, 24);
    const ballMat = new THREE.MeshStandardMaterial({
      map: this.baseballTexture,
      roughness: 0.38,
      metalness: 0.1,
    });
    this.interactiveBall = new THREE.Mesh(ballGeom, ballMat);
    this.interactiveBall.position.copy(STAND_POS);
    this.interactiveBall.position.y += BALL_RADIUS + 0.02;
    this.interactiveBall.castShadow = true;

    // Glowing target ring around ball to indicate grabability
    const ringGeom = new THREE.RingGeometry(BALL_RADIUS + 0.015, BALL_RADIUS + 0.032, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00e5ff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75,
    });
    this.grabRing = new THREE.Mesh(ringGeom, ringMat);
    this.grabRing.rotation.x = -Math.PI / 2;
    this.grabRing.position.y = -BALL_RADIUS * 0.5;
    this.interactiveBall.add(this.grabRing);

    this.add(this.interactiveBall);
  }

  setupHandsAndControllers() {
    this.handVisuals = [];
    const controllerColors = [0x29b6f6, 0xab47bc];

    for (let i = 0; i < 2; i++) {
      const group = new THREE.Group();
      group.name = `ControllerHand_${i}`;
      group.visible = false;

      // Stylized glove palm / controller body
      const palmGeom = new THREE.BoxGeometry(0.065, 0.035, 0.11);
      const palmMat = new THREE.MeshStandardMaterial({
        color: controllerColors[i],
        roughness: 0.4,
        metalness: 0.3,
      });
      const palm = new THREE.Mesh(palmGeom, palmMat);
      group.add(palm);

      // Grip sphere
      const gripGeom = new THREE.SphereGeometry(0.028, 16, 16);
      const gripMat = new THREE.MeshStandardMaterial({ color: 0x263238 });
      const grip = new THREE.Mesh(gripGeom, gripMat);
      grip.position.set(0, -0.02, 0.02);
      group.add(grip);

      // Forward pointing laser reticle ray
      const rayGeom = new THREE.CylinderGeometry(0.002, 0.002, 0.7, 8);
      const rayMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        transparent: true,
        opacity: 0.65,
      });
      const ray = new THREE.Mesh(rayGeom, rayMat);
      ray.rotation.x = -Math.PI / 2;
      ray.position.set(0, 0, -0.35);
      group.add(ray);

      this.add(group);
      this.handVisuals.push({ group, ray, color: controllerColors[i] });
    }
  }

  setupDesktopControls() {
    window.addEventListener('mousedown', (e) => this.onPointerDown(e));
    window.addEventListener('mousemove', (e) => this.onPointerMove(e));
    window.addEventListener('mouseup', (e) => this.onPointerUp(e));
    window.addEventListener('touchstart', (e) => this.onTouchStart(e), { passive: false });
    window.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: false });
    window.addEventListener('touchend', (e) => this.onTouchEnd(e), { passive: false });
  }

  onPointerDown(event) {
    if (event.target.tagName === 'BUTTON' || event.target.closest('button')) return;
    this.isMouseDown = true;
    this.dragStartPos.set(event.clientX, event.clientY);
    this.dragStartTime = performance.now();
  }

  onPointerMove(event) {
    if (!this.isMouseDown) return;
    const dy = event.clientY - this.dragStartPos.y;
    // Animate interactive ball slightly during drag
    this.interactiveBall.position.y = STAND_POS.y + BALL_RADIUS + 0.02 - dy * 0.0006;
  }

  onPointerUp(event) {
    if (!this.isMouseDown) return;
    this.isMouseDown = false;

    const dx = event.clientX - this.dragStartPos.x;
    const dy = event.clientY - this.dragStartPos.y;
    const dt = Math.max(16, performance.now() - this.dragStartTime);

    // If dragged upward/forward or clicked, pitch the ball!
    const flingStrength = Math.hypot(dx, dy);
    let pitchVelocity;

    if (flingStrength > 30 && dy < 0) {
      // Swiped upward: fling in direction of swipe
      const vx = (dx / dt) * 1.8;
      const vy = Math.min(8.5, Math.max(2.2, (-dy / dt) * 2.6));
      const vz = -Math.min(9.5, Math.max(3.5, (flingStrength / dt) * 3.2));
      pitchVelocity = new THREE.Vector3(vx, vy, vz);
    } else {
      // Direct pitch forward towards target center
      const targetX = (event.clientX / window.innerWidth - 0.5) * 0.6;
      pitchVelocity = new THREE.Vector3(targetX * 3.5, 3.2, -5.8);
    }

    this.pitchBallWithVelocity(pitchVelocity);
    this.interactiveBall.position.copy(STAND_POS);
    this.interactiveBall.position.y += BALL_RADIUS + 0.02;
  }

  onTouchStart(e) {
    if (e.touches.length > 0) {
      this.onPointerDown(e.touches[0]);
    }
  }

  onTouchMove(e) {
    if (e.touches.length > 0) {
      this.onPointerMove(e.touches[0]);
    }
  }

  onTouchEnd(e) {
    if (e.changedTouches.length > 0) {
      this.onPointerUp(e.changedTouches[0]);
    }
  }

  pitchBallWithVelocity(velocity) {
    if (this.ballsRemaining <= 0) return;

    this.ballsRemaining--;
    this.updateUI();
    this.audio.playWhoosh();

    const spawnPos = new THREE.Vector3(
      this.interactiveBall.position.x,
      this.interactiveBall.position.y + 0.08,
      this.interactiveBall.position.z
    );

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_RADIUS, 24, 24),
      new THREE.MeshStandardMaterial({
        map: this.baseballTexture,
        roughness: 0.4,
        metalness: 0.1,
      })
    );
    ballMesh.castShadow = true;
    ballMesh.position.copy(spawnPos);
    this.add(ballMesh);

    const ballBody = new CANNON.Body({
      mass: 0.52,
      shape: new CANNON.Sphere(BALL_RADIUS),
      position: new CANNON.Vec3(spawnPos.x, spawnPos.y, spawnPos.z),
    });
    ballBody.velocity.set(velocity.x, velocity.y, velocity.z);
    ballBody.angularVelocity.set(
      (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 20
    );

    // Collision audio on ball impact with can or table
    ballBody.addEventListener('collide', (ev) => {
      if (ev.body && ev.body.mass > 0) {
        this.audio.playCanHit();
      }
    });

    this.world.addBody(ballBody);
    this.balls.push({ mesh: ballMesh, body: ballBody, aliveTime: 0 });
  }

  pitchTowardsCans(powerMultiplier = 1.0) {
    if (this.ballsRemaining <= 0) return;

    const speed = (this.pitchPower + Math.random() * 0.4) * powerMultiplier;
    const target = new THREE.Vector3(
      (Math.random() - 0.5) * 0.18,
      TABLE_Y + CAN_HEIGHT + 0.08,
      TABLE_Z
    );
    const start = new THREE.Vector3(0, 1.35, -0.65);
    const delta = target.clone().sub(start);
    const time = delta.length() / speed;

    const vel = delta.divideScalar(time);
    vel.y += 0.5 * 9.82 * time;

    this.pitchBallWithVelocity(vel);
  }

  setupSpatialUI() {
    this.scoreText = new xb.UIText({
      text: 'SCORE: 0',
      style: {
        fontSize: 30,
        fontWeight: 'bold',
        color: '#ffea00',
        textAlign: 'center',
      },
    });

    this.ballsText = new xb.UIText({
      text: `BALLS: ${this.ballsRemaining}`,
      style: {
        fontSize: 22,
        fontWeight: 'bold',
        color: '#ffffff',
        textAlign: 'center',
      },
    });

    this.statusText = new xb.UIText({
      text: 'Grab & toss with VR hand, swipe mouse, or press Pitch!',
      style: {
        fontSize: 15,
        color: '#b0bec5',
        textAlign: 'center',
        lineHeight: 1.3,
      },
    });

    this.powerSlider = new xb.UISlider({
      ariaLabel: 'Pitch Power',
      min: 3.5,
      max: 9.0,
      step: 0.5,
      value: this.pitchPower,
      style: { width: '100%', height: 36 },
      onInput: (val) => {
        this.pitchPower = val;
      },
    });

    const pitchBtn = new xb.UIButton({
      label: 'Pitch Ball',
      icon: 'sports_baseball',
      style: { flexGrow: 1 },
      onClick: () => this.pitchTowardsCans(1.0),
    });

    const resetBtn = new xb.UIButton({
      label: 'Reset Cans',
      icon: 'restart_alt',
      style: { flexGrow: 1 },
      onClick: () => this.resetGame(),
    });

    this.uiCard = new xb.UICard({
      size: { width: 0.65, height: 'auto' },
      manipulation: true,
      edge: { scale: true },
      style: {
        flexDirection: 'column',
        gap: 12,
        padding: 18,
        backgroundColor: 'rgba(15, 23, 42, 0.92)',
        borderRadius: 20,
      },
      children: [
        new xb.UIText({
          text: '🎪 CARNIVAL TOSS',
          style: {
            fontSize: 32,
            fontWeight: 'bold',
            textAlign: 'center',
            color: '#ff5252',
          },
        }),
        this.scoreText,
        this.ballsText,
        this.statusText,
        new xb.UIPanel({
          style: {
            width: '100%',
            flexDirection: 'row',
            justifyContent: 'space-between',
            marginTop: 4,
          },
          children: [
            new xb.UIText({ text: 'Pitch Power', style: { fontSize: 16 } }),
          ],
        }),
        this.powerSlider,
        new xb.UIPanel({
          style: { width: '100%', flexDirection: 'row', gap: 10 },
          children: [pitchBtn, resetBtn],
        }),
      ],
    });

    this.uiCard.position.set(-0.85, 1.45, -1.2);
    this.uiCard.rotation.y = 0.32;
    this.add(this.uiCard);
  }

  updateUI() {
    this.scoreText.text = `SCORE: ${this.score}`;
    this.ballsText.text = `BALLS: ${this.ballsRemaining}`;

    if (this.knockedCount === this.cans.length) {
      this.statusText.text = '🎉 STRIKE! ALL CANS DOWN! +500 PTS!';
      this.statusText.style.color = '#00e676';
    } else if (this.ballsRemaining <= 0) {
      this.statusText.text = 'Out of balls! Hit Reset Cans to play again!';
      this.statusText.style.color = '#ff9100';
    } else {
      this.statusText.text = `${this.knockedCount}/6 cans knocked down!`;
      this.statusText.style.color = '#cfd8dc';
    }
  }

  resetGame() {
    for (const can of this.cans) {
      can.body.position.copy(can.initialPos);
      can.body.velocity.set(0, 0, 0);
      can.body.angularVelocity.set(0, 0, 0);
      can.body.quaternion.set(0, 0, 0, 1);
      can.isKnocked = false;
    }
    this.syncCansTransforms();

    for (const b of this.balls) {
      this.world.removeBody(b.body);
      this.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
    this.balls = [];

    this.score = 0;
    this.ballsRemaining = INITIAL_BALLS;
    this.knockedCount = 0;
    this.interactiveBall.position.copy(STAND_POS);
    this.interactiveBall.position.y += BALL_RADIUS + 0.02;
    this.updateUI();
  }

  syncCansTransforms() {
    for (const can of this.cans) {
      can.mesh.position.copy(can.body.position);
      can.mesh.quaternion.copy(can.body.quaternion);
    }
  }

  updateControllers(dt) {
    const inputControllers = xb.core.input?.controllers || [];

    for (let i = 0; i < this.handVisuals.length; i++) {
      const visual = this.handVisuals[i];
      const controller = inputControllers[i];

      if (controller && controller.visible) {
        visual.group.visible = true;
        visual.group.position.copy(controller.position);
        visual.group.quaternion.copy(controller.quaternion);

        // Track velocity
        const prev = this.lastControllerPositions.get(controller) || controller.position.clone();
        const vel = controller.position.clone().sub(prev).divideScalar(Math.max(0.001, dt));
        this.lastControllerPositions.set(controller, controller.position.clone());

        // Check grabbing interaction with the baseball on pedestal
        const distToBall = controller.position.distanceTo(this.interactiveBall.position);
        const isTriggerPressed = Boolean(controller.userData?.selected);

        if (distToBall < 0.18 && isTriggerPressed && !this.isGrabbingInteractiveBall) {
          this.isGrabbingInteractiveBall = true;
          this.grabbedController = controller;
        }

        // Grabbing update
        if (this.isGrabbingInteractiveBall && this.grabbedController === controller) {
          this.interactiveBall.position.copy(controller.position);

          // On release: throw!
          if (!isTriggerPressed) {
            this.isGrabbingInteractiveBall = false;
            this.grabbedController = null;
            let throwVel = vel.clone().multiplyScalar(1.5);
            if (throwVel.length() < 1.5) {
              throwVel = new THREE.Vector3(0, 2.8, -5.5);
            }
            this.pitchBallWithVelocity(throwVel);
            this.interactiveBall.position.copy(STAND_POS);
            this.interactiveBall.position.y += BALL_RADIUS + 0.02;
          }
        }
      } else {
        visual.group.visible = false;
      }
    }
  }

  update() {
    const dt = xb.getDeltaTime() || 0.016;

    // Pulse grab ring
    this.grabRing.rotation.z += 0.025;
    this.grabRing.material.opacity = 0.55 + Math.sin(performance.now() * 0.006) * 0.25;

    // Step physics world
    this.world.step(Math.min(dt, 0.033));

    // Update cans and scoring
    this.syncCansTransforms();
    let newlyKnocked = 0;

    for (const can of this.cans) {
      if (!can.isKnocked) {
        // Can is considered knocked if tilted > 40 degrees or fallen below table height
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(can.mesh.quaternion);
        const tilt = Math.acos(Math.max(-1, Math.min(1, up.y)));
        const fellDown = can.mesh.position.y < TABLE_Y - 0.05;

        if (tilt > 0.65 || fellDown) {
          can.isKnocked = true;
          newlyKnocked++;
          this.score += can.points;
        }
      }
    }

    if (newlyKnocked > 0) {
      this.knockedCount += newlyKnocked;
      this.updateUI();

      if (this.knockedCount === this.cans.length) {
        this.score += 500;
        this.audio.playCheer();
        this.confetti.burst(new THREE.Vector3(0, TABLE_Y + 0.35, TABLE_Z));
        this.updateUI();
      }
    }

    // Update active thrown baseballs
    for (let i = this.balls.length - 1; i >= 0; i--) {
      const b = this.balls[i];
      b.aliveTime += dt;
      b.mesh.position.copy(b.body.position);
      b.mesh.quaternion.copy(b.body.quaternion);

      // Despawn balls after 6 seconds
      if (b.aliveTime > 6.0) {
        this.world.removeBody(b.body);
        this.remove(b.mesh);
        b.mesh.geometry.dispose();
        b.mesh.material.dispose();
        this.balls.splice(i, 1);
      }
    }

    this.updateControllers(dt);
    this.confetti.update(dt);
  }

  dispose() {
    this.baseballTexture.dispose();
    for (const can of this.cans) {
      can.mesh.geometry.dispose();
      can.mesh.material.dispose();
    }
    for (const b of this.balls) {
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const options = new xb.Options();
  options.setAppTitle('Carnival Can Toss');
  options.setAppDescription(
    'Step up to the carnival booth! Grab and fling baseballs to knock down the stacked cans.'
  );
  options.enableHands();
  options.enableReticles();
  options.hands.visualization = true;
  options.reticles.enabled = true;
  options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
  options.xrButton.showEnterSimulatorButton = true;

  xb.add(new CarnivalGameScene());
  xb.init(options);
});
    </script>
